name: JREI Windows Safe Git Transfer Isolated QA (NO DEPLOY)
on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - '.github/workflows/jrei-windows-git-auto-sync-isolated-qa.yml'
      - 'platform/jrei-v5/windows-worker/jrei-repo-auto-sync.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-parser-and-readonly-contract:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Parse original PowerShell 5.1 script with strict parser
        shell: pwsh
        run: |
          $path = (Resolve-Path 'platform/jrei-v5/windows-worker/jrei-repo-auto-sync.ps1').Path
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Output 'JREI_SAFE_SYNC_WINDOWS_PARSE_OK'
      - name: Check read-only status on synthetic private repo and preserve local edits
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'jrei-isolated-temp-localappdata'
          $repo=Join-Path $env:LOCALAPPDATA 'JREI-Python\repo'
          New-Item -ItemType Directory -Force -Path $repo | Out-Null
          git -C $repo init -q
          git -C $repo config user.name 'JREI isolated fixture'
          git -C $repo config user.email 'ci@example.invalid'
          git -C $repo checkout -q -b migration/bertina-linux6
          git -C $repo remote add origin 'https://github.com/drrezazadeh65/drjavadrezazadeh.com'
          'synthetic, no private data' | Set-Content -LiteralPath (Join-Path $repo 'synthetic.txt')
          git -C $repo add synthetic.txt
          git -C $repo commit -m 'Local fixture' -q
          $script=Join-Path $env:GITHUB_WORKSPACE 'platform\jrei-v5\windows-worker\jrei-repo-auto-sync.ps1'
          $out=& powershell.exe -NoProfile -NonInteractive -File $script -Mode Check
          if($LASTEXITCODE -ne 0){throw 'JREI_SYNC_CHECK_FAILED'}
          $joined=$out -join ';'
          if($joined -notmatch 'REPO_SYNC_TASK_NOT_REGISTERED' -or
             $joined -notmatch 'GIT_PYTHON_TRANSFER_ONLY'){
              throw 'JREI_SYNC_READ_ONLY_CONTRACT_INVALID'
          }
          'locally modified, must survive' | Add-Content -LiteralPath (Join-Path $repo 'synthetic.txt')
          $stderr=Join-Path $env:RUNNER_TEMP 'jrei-local-modification-stderr.txt'
          $stdout=Join-Path $env:RUNNER_TEMP 'jrei-local-modification-stdout.txt'
          $check=Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -ArgumentList @('-NoProfile','-NonInteractive','-File',('"' + $script + '"'),'-Mode','Check') `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if($check.ExitCode -eq 0){throw 'JREI_LOCAL_MODIFICATIONS_NOT_PRESERVED'}
          if((Get-Content -LiteralPath (Join-Path $repo 'synthetic.txt') -Raw) -notmatch 'locally modified'){
            throw 'JREI_LOCAL_MODIFICATION_OVERWRITTEN'
          }
          Write-Output 'JREI_READ_ONLY_CHECK_AND_LOCAL_EDIT_PRESERVATION_OK'
      - name: Exercise isolated Task Scheduler registration and guaranteed cleanup
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'jrei-isolated-temp-localappdata'
          $repo=Join-Path $env:LOCALAPPDATA 'JREI-Python\repo'
          git -C $repo restore -- synthetic.txt
          if($LASTEXITCODE -ne 0){throw 'FIXTURE_RESTORE_FAILED'}
          $script=Join-Path $env:GITHUB_WORKSPACE 'platform\jrei-v5\windows-worker\jrei-repo-auto-sync.ps1'
          try{
            $out=& powershell.exe -NoProfile -NonInteractive -File $script -Mode Install -OwnerApproved
            if($LASTEXITCODE -ne 0){throw 'JREI_SCHEDULER_INSTALL_FAILED'}
            if(($out -join ';') -notmatch 'REPO_SYNC_TASK_REGISTERED'){
              throw 'JREI_SCHEDULER_INSTALL_MISSING_RECEIPT'
            }
            $task=Get-ScheduledTask -TaskName 'JREI-Repo-Auto-Sync' -ErrorAction Stop
            if($task.Triggers.Count -ne 2){throw 'JREI_SCHEDULER_MISSING_RECURRENCE'}
            Write-Output 'JREI_SCHEDULER_REGISTRATION_FIXTURE_PASS'
          } finally {
            Unregister-ScheduledTask -TaskName 'JREI-Repo-Auto-Sync' -Confirm:$false -ErrorAction SilentlyContinue
          }
          if(Get-ScheduledTask -TaskName 'JREI-Repo-Auto-Sync' -ErrorAction SilentlyContinue){
            throw 'JREI_TEMPORARY_TASK_NOT_REMOVED'
          }
      - name: No user or production systems touched
        if: always()
        shell: pwsh
        run: |
          'Synthetic Windows repo tests only; temporary CI Scheduler registration is removed. No actual user PC, GitHub push, deploy, Bertina SQL, Python install, service restart or scheduled execution.' >> $env:GITHUB_STEP_SUMMARY
