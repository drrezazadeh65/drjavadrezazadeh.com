name: AWOSE social engine (offline tests only)
on:
  push:
    branches:
      - migration/bertina-linux6
    paths:
      - platform/social-distribution/**
      - .github/workflows/awose-social-engine-tests.yml
  pull_request:
    paths:
      - platform/social-distribution/**
      - .github/workflows/awose-social-engine-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: node --check platform/social-distribution/engine.mjs
      - name: Run safety and scheduling tests
        run: node --test platform/social-distribution/*.test.mjs
