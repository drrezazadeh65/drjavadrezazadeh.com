name: RAVE search discovery audit
on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node rave/discovery/search-audit.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rave-search-audit
          path: rave/reports/search-audit.json
          retention-days: 30
