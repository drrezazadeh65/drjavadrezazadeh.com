name: Bertina Activation Audit

on:
  push:
    branches:
      - migration/bertina-linux6
    paths:
      - '.github/workflows/bertina-activation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build public site
        run: node scripts/build-public-site.mjs
      - name: Inventory inactive/offline user-facing copy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.public-site')
          terms=[
            r'غیرفعال',r'هنوز فعال نیست',r'هنوز آماده نیست',r'موقتاً در دسترس نیست',
            r'آفلاین',r'Offline',r'offline',r'not active',r'not yet available',
            r'not yet active',r'coming soon',r'preview',r'Preview',
            r'not configured',r'unavailable'
          ]
          rx=re.compile('|'.join(terms),re.I)
          rows=[]
          for p in root.rglob('*'):
            if not p.is_file() or p.suffix.lower() not in {'.html','.js','.json','.txt'}: continue
            try:s=p.read_text(encoding='utf-8',errors='ignore')
            except:continue
            for n,line in enumerate(s.splitlines(),1):
              if rx.search(line):
                rows.append((p.relative_to(root).as_posix(),n,line.strip()[:420]))
          print('ACTIVATION_MATCHES',len(rows))
          for row in rows[:700]: print(f'{row[0]}:{row[1]}: {row[2]}')
          PY
      - name: Verify core live runtime
        run: |
          set -euo pipefail
          for path in /api/health /api/auth/health /api/commerce/health /fa/ /en/ /fa/shop/ /fa/register/ /fa/login/ /fa/customer-dashboard/; do
            code="$(curl -kLsS -o /tmp/body -w '%{http_code}' --max-time 30 --resolve drjavadrezazadeh.com:443:188.40.203.218 "https://drjavadrezazadeh.com$path")"
            echo "$path HTTP $code"
            test "$code" = "200"
          done
