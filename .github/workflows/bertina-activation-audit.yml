name: Bertina Activation Audit

on:
  push:
    branches:
      - migration/bertina-linux6
    paths:
      - '.github/workflows/bertina-activation-audit.yml'
  workflow_dispatch:

# activation-audit-run: 2026-10-10T15:30:00Z
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build public site
        run: node scripts/build-public-site.mjs
      - name: Inventory inactive/offline user-facing copy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.public-site')
          terms=[
            r'غیرفعال',r'هنوز فعال نیست',r'هنوز آماده نیست',r'موقتاً در دسترس نیست',
            r'آفلاین',r'Offline',r'offline',r'not active',r'not yet available',
            r'not yet active',r'coming soon',r'preview',r'Preview',
            r'not configured',r'unavailable'
          ]
          rx=re.compile('|'.join(terms),re.I)
          rows=[]
          for p in root.rglob('*'):
            if not p.is_file() or p.suffix.lower() not in {'.html','.js','.json','.txt'}: continue
            try:s=p.read_text(encoding='utf-8',errors='ignore')
            except:continue
            for n,line in enumerate(s.splitlines(),1):
              if rx.search(line):
                rows.append((p.relative_to(root).as_posix(),n,line.strip()[:420]))
          print('ACTIVATION_MATCHES',len(rows))
          for row in rows[:700]: print(f'{row[0]}:{row[1]}: {row[2]}')
          PY
      - name: Verify storefront recovery
        run: |
          set -euo pipefail
          curl -kisS --max-time 30 --resolve drjavadrezazadeh.com:443:188.40.203.218 https://drjavadrezazadeh.com/shop/ -o /tmp/root-shop.raw
          tr -d '\015' < /tmp/root-shop.raw > /tmp/root-shop.txt
          sed -n '1,24p' /tmp/root-shop.txt
          grep -Eiq '^HTTP/[^ ]+ 301' /tmp/root-shop.txt
          grep -Eiq '^location: (https://drjavadrezazadeh\.com)?/fa/shop/?([?#].*)?$' /tmp/root-shop.txt

          curl -kisS --max-time 30 --resolve drjavadrezazadeh.com:443:188.40.203.218 https://drjavadrezazadeh.com/fa/shop/ -o /tmp/fa-shop.txt
          grep -Eiq '^HTTP/[^ ]+ 200' /tmp/fa-shop.txt
          if grep -Eiq '^x-robots-tag:.*noindex' /tmp/fa-shop.txt; then
            echo "Public FA shop still receives X-Robots noindex" >&2
            exit 1
          fi

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:188.40.203.218 https://drjavadrezazadeh.com/sw.js -o /tmp/sw.js
          echo "Live service worker header:"
          sed -n '1,36p' /tmp/sw.js
          grep -Eq 'PRIVATE_PREFIXES' /tmp/sw.js
          grep -F "if(isPrivate(url))" /tmp/sw.js
          grep -F "cache:'no-store'" /tmp/sw.js
          ! grep -F "'/fa/shop/','/en/shop/','/shop/'" /tmp/sw.js

      - name: Verify core live runtime
        run: |
          set -euo pipefail
          for path in /api/health /api/auth/health /api/commerce/health /fa/ /en/ /fa/shop/ /fa/register/ /fa/login/ /fa/customer-dashboard/; do
            code="$(curl -kLsS -o /tmp/body -w '%{http_code}' --max-time 30 --resolve drjavadrezazadeh.com:443:188.40.203.218 "https://drjavadrezazadeh.com$path")"
            echo "$path HTTP $code"
            test "$code" = "200"
          done
