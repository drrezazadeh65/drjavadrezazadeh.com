permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check platform/free-first-stage-policy.mjs
          node --check platform/free-first-stage-consent-adapter.mjs
          node --check platform/scientific-release-gate.mjs
          node --check platform/scientific-evidence-policy.mjs
          node --check platform/rcas-preview-edition-contract.mjs
          node --check assets/js/talent-dashboard-view-model.mjs
          node --check assets/js/operations-scientific-schema.js
          node --check assets/js/bahar-formative-workspace-v1.js
      - name: Isolated PHP Bertina consent projection
        run: |
          php -l platform/bertina-consent-projection.php
          php -l api/golden-talent.php
          php -l api/golden-talent-consent.php
          php -l api/golden-talent-consent-write.php
          php -l api/operations.php
          php -l api/operations-scientific-schema.php
          php -l tests/golden-talent-guardian.php
          php tests/golden-talent-guardian.php
          php -l tests/bertina-consent-projection.php
          php -l platform/bertina-free-stage-authorisation.php
          php -l platform/bertina-age-attestation-reader.php
          php -l platform/bertina-minor-assent-reader.php
          php -l platform/bertina-free-stage-trusted-reader.php
          php -l tests/bertina-free-stage-authorisation.php
          php -l platform/bertina-dashboard-projections.php
          php -l platform/bertina-scientific-schema-readiness.php
          php -l tests/bertina-dashboard-projections.php
          php tests/bertina-consent-projection.php
          php tests/bertina-free-stage-authorisation.php
          php tests/bertina-dashboard-projections.php
      - name: Privacy, consent, free/paid and scientific policy regression
        run: |
          node --test platform/free-first-stage-policy.test.mjs platform/free-first-stage-consent-adapter.test.mjs platform/scientific-release-gate.test.mjs tests/talent-dashboard-view-model.test.mjs tests/rcas-preview-edition-contract.test.mjs tests/scientific-evidence-register.test.mjs

  mysql-fixture:
    name: Isolated MySQL subject, guardian, consent and free-stage integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-password
          MYSQL_DATABASE: operations_fixture
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      OPERATIONS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=operations_fixture;charset=utf8mb4
      OPERATIONS_TEST_USER: root
      OPERATIONS_TEST_PASSWORD: fixture-password
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated MySQL PDO test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mysql
          php -m | grep -iq pdo_mysql
      - name: Syntax and MySQL fixture checks (temporary tables only)
        run: |
          php -l tests/bertina-free-stage-mysql.php
          php tests/bertina-free-stage-mysql.php
          php tests/bahar-guardian-mysql.php
          php -l tests/bertina-guardian-transaction-lock-mysql.php
          SCIENTIFIC_LOCK_FIXTURE_ENABLED=1 php tests/bertina-guardian-transaction-lock-mysql.php
          php -l tests/bertina-consent-withdrawal-mysql.php
          SCIENTIFIC_WITHDRAWAL_FIXTURE_ENABLED=1 php tests/bertina-consent-withdrawal-mysql.php
          php -l tests/bertina-consent-withdrawal-concurrency-mysql.php
          SCIENTIFIC_WITHDRAWAL_CONCURRENCY_FIXTURE=1 php tests/bertina-consent-withdrawal-concurrency-mysql.php
          php -l tests/bertina-age-attestation-mysql.php
          SCIENTIFIC_AGE_FIXTURE_ENABLED=1 php tests/bertina-age-attestation-mysql.php
          php -l tests/bertina-trusted-free-stage-reader-mysql.php
          SCIENTIFIC_TRUSTED_READER_FIXTURE=1 php tests/bertina-trusted-free-stage-reader-mysql.php
          php -l tests/bertina-safeguarding-migration-dry-run-mysql.php
          SCIENTIFIC_DDL_FIXTURE_ENABLED=1 php tests/bertina-safeguarding-migration-dry-run-mysql.php

  mariadb-fixture:
    name: Isolated MariaDB 10.11 guardian and consent compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: fixture-password
          MARIADB_DATABASE: operations_fixture
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -pfixture-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      OPERATIONS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=operations_fixture;charset=utf8mb4
      OPERATIONS_TEST_USER: root
      OPERATIONS_TEST_PASSWORD: fixture-password
    steps:
      - uses: actions/checkout@v4
      - name: Install MariaDB PDO test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mysql
          php -m | grep -iq pdo_mysql
      - name: MariaDB 10.11 temporary-table consent and guardian checks
        run: |
          php -l tests/bertina-free-stage-mysql.php
          php tests/bertina-free-stage-mysql.php
          php tests/bahar-guardian-mysql.php
          php -l tests/bertina-guardian-transaction-lock-mysql.php
          SCIENTIFIC_LOCK_FIXTURE_ENABLED=1 php tests/bertina-guardian-transaction-lock-mysql.php
          php -l tests/bertina-consent-withdrawal-mysql.php
          SCIENTIFIC_WITHDRAWAL_FIXTURE_ENABLED=1 php tests/bertina-consent-withdrawal-mysql.php
          php -l tests/bertina-consent-withdrawal-concurrency-mysql.php
          SCIENTIFIC_WITHDRAWAL_CONCURRENCY_FIXTURE=1 php tests/bertina-consent-withdrawal-concurrency-mysql.php
          php -l tests/bertina-age-attestation-mysql.php
          SCIENTIFIC_AGE_FIXTURE_ENABLED=1 php tests/bertina-age-attestation-mysql.php
          php -l tests/bertina-trusted-free-stage-reader-mysql.php
          SCIENTIFIC_TRUSTED_READER_FIXTURE=1 php tests/bertina-trusted-free-stage-reader-mysql.php
          php -l tests/bertina-safeguarding-migration-dry-run-mysql.php
          SCIENTIFIC_DDL_FIXTURE_ENABLED=1 php tests/bertina-safeguarding-migration-dry-run-mysql.php

  assembly-check:
    name: Sanitized Bertina release includes canonical consent library
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build sanitized site WITHOUT deployment
        run: |
          node scripts/build-public-site.mjs
      - name: Inspect archived API and exclude research directories
        run: |
          node tests/bertina-public-consent-assembly.mjs
          node --check .public-site/assets/js/operations-scientific-schema.js
          php -l .public-site/api/golden-talent.php
          php -l .public-site/api/golden-talent-consent.php
          php -l .public-site/api/golden-talent-consent-write.php
          php -l .public-site/api/operations.php
          php -l .public-site/api/operations-scientific-schema.php

  admin-schema-authorization:
    name: Scientific schema endpoint requires verified admin MFA and auditable reads
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP SQLite fixture dependencies (no real DB)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3
          php -m | grep -iq pdo_sqlite
      - name: Authenticated admin route security regression
        run: |
          php -l api/operations-scientific-schema.php
          php -l api/operations.php
          php -l tests/operations-security.php
          php tests/operations-security.php

  admin-schema-browser:
    name: Bilingual scientific schema plus existing operations dashboard browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Chromium test runner
        run: |
          npm install --no-save @playwright/test@1.56.0
          npx playwright install --with-deps chromium
      - name: Start local fixture site (never production)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/scientific-ui-fixture.log 2>&1 &
          curl -fsS --retry-connrefused --retry 15 --retry-delay 1 --max-time 3 http://127.0.0.1:4173/fa/app/admin/ > /dev/null
      - name: Test FA/EN lazy data, MFA denial, private state clear, hostile payload
        run: |
          npx playwright test tests/operations-scientific-schema-browser.spec.js tests/operations-browser.spec.js tests/bahar-formative-workspace-browser.spec.js --reporter=line
