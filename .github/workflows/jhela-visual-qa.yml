name: JHELA Dedicated Visual & Print QA
on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - 'journal/**/*.html'
      - 'assets/css/journal-v2.css'
      - 'assets/css/jhela-roadmap.css'
      - 'assets/images/jhela/**'
      - 'identity/jhela-document.css'
      - 'identity/templates/jhela-*.html'
      - 'docs/journal/prototypes/**'
      - 'tests/jhela-browser-visual.spec.js'
      - '.github/workflows/jhela-visual-qa.yml'
  pull_request:
    branches: [migration/bertina-linux6]
    paths:
      - 'journal/**/*.html'
      - 'assets/css/journal-v2.css'
      - 'assets/images/jhela/**'
      - 'identity/jhela-document.css'
      - 'docs/journal/prototypes/**'
      - 'tests/jhela-browser-visual.spec.js'
      - '.github/workflows/jhela-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jhela-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jhela-browser:
    name: JHELA 33 pages / 8 roles / A4 specimens
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      PW_TEST_SCREENSHOT_NO_FONTS_READY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.56.0
          npx playwright install --with-deps chromium
      - name: Serve repository design fixtures only
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/jhela-visual-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/journal/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/jhela-visual-http.log
          exit 1
      - name: Capture bilingual 320–1440 layouts, protected-role prototypes and A4 specimens
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/jhela-browser-visual.spec.js --workers=3 --reporter=line 2>&1 | tee jhela-visual-qa.log
      - name: Upload visual and print evidence for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jhela-visual-and-print-evidence
          path: |
            test-results/jhela-browser-visual
            jhela-visual-qa.log
          if-no-files-found: warn
          retention-days: 14
