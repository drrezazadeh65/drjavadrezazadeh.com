name: Knowledge Article UX Validation

on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - 'fa/rahnamaha/**'
      - 'assets/css/**'
      - 'assets/js/knowledge-article.js'
      - 'tests/knowledge-articles-premium.mjs'
      - '.github/workflows/knowledge-articles-premium-upgrade.yml'
  pull_request:
    branches: [migration/bertina-linux6]
    paths:
      - 'fa/rahnamaha/**'
      - 'assets/css/**'
      - 'assets/js/knowledge-article.js'
      - 'tests/knowledge-articles-premium.mjs'
      - '.github/workflows/knowledge-articles-premium-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source without publishing changes
        run: |
          python3 scripts/upgrade_knowledge_articles.py --check-only
          node tests/knowledge-articles-premium.mjs
          node tests/knowledge-hub-seo.mjs
