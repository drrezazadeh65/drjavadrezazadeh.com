name: SEO GEO Regression

on:
  push:
    branches: [migration/bertina-linux6]
  pull_request:
    branches: [migration/bertina-linux6]

permissions:
  contents: read

concurrency:
  group: seo-geo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source SEO/GEO regression audit
        run: node scripts/seo-regression.mjs
      - name: Run visual-system regression audit
        run: node scripts/design-regression.mjs
      - name: Run responsive resilience source audit
        run: node scripts/responsive-resilience-audit.mjs
      - name: Diagnose frontend copy hygiene — core
        env:
          COPY_HYGIENE_GROUP: core
        run: node scripts/frontend-copy-hygiene-audit.mjs
      - name: Diagnose frontend copy hygiene — editorial
        env:
          COPY_HYGIENE_GROUP: editorial
        run: node scripts/frontend-copy-hygiene-audit.mjs
      - name: Diagnose frontend copy hygiene — implementation
        env:
          COPY_HYGIENE_GROUP: implementation
        run: node scripts/frontend-copy-hygiene-audit.mjs
      - name: Diagnose frontend copy hygiene — Persian implementation language
        env:
          COPY_HYGIENE_GROUP: persian
        run: node scripts/frontend-copy-hygiene-audit.mjs
      - name: Run frontend copy-hygiene audit
        run: node scripts/frontend-copy-hygiene-audit.mjs
      - name: Run client-readable data hygiene audit
        run: node scripts/public-data-hygiene-audit.mjs
      - name: Verify public data projections match canonical sources
        run: node scripts/build-public-data.mjs --check
      - name: Run canonical media-library audit
        run: node scripts/media-library-audit.mjs
      - name: Run link-integrity audit
        run: node scripts/link-integrity-audit.mjs
      - name: Run URL-stability audit
        run: node scripts/url-stability-audit.mjs
      - name: Run internal-link graph audit
        run: node scripts/internal-link-graph-audit.mjs
      - name: Run structured/social URL integrity audit
        run: node scripts/structured-url-audit.mjs
      - name: Run llms.txt public discovery audit
        run: node scripts/llms-txt-audit.mjs
      - name: Run AI/search crawler policy audit
        run: node scripts/ai-crawler-policy-audit.mjs
      - name: Run metadata uniqueness and content-identity audit
        run: node scripts/metadata-uniqueness-audit.mjs
      - name: Run accessibility source audit
        run: node scripts/accessibility-source-audit.mjs
      - name: Run performance source audit
        run: node scripts/performance-source-audit.mjs
      - name: Run committed-secret exposure audit
        run: node scripts/public-secret-audit.mjs
      - name: Run PWA private-cache privacy audit
        run: node scripts/pwa-private-cache-audit.mjs
      - name: Run trust and legal metadata audit
        run: node scripts/trust-legal-audit.mjs
      - name: Run news trust and freshness audit
        run: node scripts/news-trust-audit.mjs
      - name: Run sitemap lastmod consistency audit
        run: node scripts/sitemap-lastmod-audit.mjs
      - name: Run evergreen guide trust audit
        run: node scripts/evergreen-guide-trust-audit.mjs
      - name: Run related-content graph audit
        run: node scripts/related-content-audit.mjs
      - name: Run FAQ structured-content integrity audit
        run: node scripts/faq-integrity-audit.mjs
      - name: Run RSS distribution audit
        run: node scripts/rss-audit.mjs
      - name: Run conversion path audit
        run: node scripts/conversion-path-audit.mjs
      - name: Run analytics activation/privacy contract audit
        run: node scripts/analytics-contract-audit.mjs
      - name: Run pre-gateway commerce schema safety audit
        run: node scripts/commerce-schema-safety-audit.mjs
      - name: Run commerce paid-receipt contract audit
        run: node scripts/commerce-receipt-contract-audit.mjs
      - name: Validate IndexNow integration contract
        env:
          PROD_ORIGIN: https://drjavadrezazadeh.com
          INDEXNOW_ENABLED: '0'
        run: node scripts/indexnow-submit.mjs --all
      - name: Run legacy URL continuity audit
        run: node scripts/legacy-url-continuity-audit.mjs
      - name: Validate JavaScript and MJS syntax across release code
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets/js scripts platform -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Run ecosystem governance contract tests
        run: node platform/ecosystem-governance.test.mjs
      - name: Run public AI assistant runtime tests
        run: node platform/assistant-runtime.test.mjs
      - name: Run identity authentication policy tests
        run: node platform/identity-auth-policy.test.mjs
      - name: Run purchaser-only student support authorization tests
        run: node platform/paid-student-support.test.mjs
      - name: Run module architecture graph tests
        run: node platform/module-governance.test.mjs
      - name: Run platform readiness control
        run: node scripts/platform-readiness.mjs
      - name: Run dedicated-master migration preflight
        run: node scripts/master-migration-preflight.mjs
      - name: Run payment adapter contract tests
        run: node platform/payment-provider-adapter.test.mjs
      - name: Run book commerce contract tests
        run: node platform/book-commerce.test.mjs
      - name: Run canonical service catalogue intake contract
        run: node platform/service-catalog-contract.test.mjs
      - name: Run pathway reference contract tests
        run: node platform/pathway-reference.test.mjs
      - name: Run Golden Path lifecycle tests
        run: node platform/golden-path-lifecycle.test.mjs
      - name: Run Golden Talent orchestrator tests
        run: node platform/golden-talent-orchestrator.test.mjs
      - name: Run BAHAR persistence tests
        run: node platform/bahar-persistence.test.mjs
      - name: Run Golden Talent engine unit tests
        run: node platform/golden-talent-engine.test.mjs
      - name: Run Golden Talent evidence analytics tests
        run: node platform/golden-talent-evidence-analytics.test.mjs
      - name: Run development and coaching governance tests
        run: node platform/development-coaching.test.mjs
      - name: Run master vision contract tests
        run: node platform/master-vision-contract.test.mjs

      - name: Validate RCAS production bridge
        run: node -e "import('./platform/rcas-evidence-bridge.mjs').then(m=>{const e=m.rcasToEvidence({session_id:'ci',instrument_version:'1',responses:[{item_code:'A1',value:3},{item_code:'D1',value:2}]});if(!e.some(x=>x.domain_code==='D5')||!e.some(x=>x.domain_code==='D6')||e.some(x=>x.quality_state!=='UNREVIEWED'))process.exit(1);console.log('RCAS bridge passed')})"

      - name: Run public entity schema audit
        run: node platform/public-entity-schema-audit.mjs
      - name: Run master ecosystem audit
        run: node scripts/master-audit.mjs
      - name: Write master audit summary
        if: always()
        run: node scripts/master-audit.mjs --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Validate observer evidence gate
        run: node -e "Promise.all([import('./platform/rcas-observer-evidence-bridge.mjs'),import('./platform/golden-talent-engine.mjs')]).then(([o,g])=>{const e=o.observerToEvidence({session_id:'ci',instrument_version:'1.1',subject_user_id:'subject',respondent_role:'PARENT',relationship_verified:true,visibility_authorised:true,fields:{environmental_barrier_support:'context'}});if(e.length!==1||e[0].quality_state!=='UNREVIEWED')process.exit(1);const r=g.routeEvidence(e);if(r.routes.find(x=>x.route_code==='D4').evidence_state!=='INSUFFICIENT')process.exit(1);console.log('Observer evidence gate passed')})"
