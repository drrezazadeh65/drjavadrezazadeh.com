name: SEO GEO Regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: seo-geo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source SEO/GEO regression audit
        run: node scripts/seo-regression.mjs
