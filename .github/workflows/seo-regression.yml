name: SEO GEO Regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: seo-geo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source SEO/GEO regression audit
        run: node scripts/seo-regression.mjs
      - name: Run Golden Talent engine unit tests
        run: node platform/golden-talent-engine.test.mjs

      - name: Validate RCAS production bridge
        run: node -e "import('./platform/rcas-evidence-bridge.mjs').then(m=>{const e=m.rcasToEvidence({session_id:'ci',instrument_version:'1',responses:[{item_code:'A1',value:3},{item_code:'D1',value:2}]});if(!e.some(x=>x.domain_code==='D5')||!e.some(x=>x.domain_code==='D6')||e.some(x=>x.quality_state!=='UNREVIEWED'))process.exit(1);console.log('RCAS bridge passed')})"
