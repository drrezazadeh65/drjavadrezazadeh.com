name: Bertina Origin Verify

on:
  push:
    branches:
      - migration/bertina-linux6
    paths:
      - '.github/workflows/bertina-origin-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

# live config probe storefront-v6-final-2026-10-10T15:30:00Z
jobs:
  verify:
    # mail readiness probe
    runs-on: ubuntu-latest
    steps:
      - name: Verify Bertina origin directly
        run: |
          ORIGIN_IP="188.40.203.218"

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP             https://drjavadrezazadeh.com/fa/ -o /tmp/fa.html
          grep -F '<html lang="fa" dir="rtl">' /tmp/fa.html

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP             https://drjavadrezazadeh.com/en/ -o /tmp/en.html
          grep -F '<html lang="en"' /tmp/en.html

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP             https://drjavadrezazadeh.com/fa/customer-dashboard/ -o /tmp/dashboard.html
          grep -F '<meta name="robots" content="noindex,nofollow">' /tmp/dashboard.html

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP             https://drjavadrezazadeh.com/robots.txt -o /tmp/robots.txt
          test -s /tmp/robots.txt

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP             https://drjavadrezazadeh.com/sitemap.xml -o /tmp/sitemap.xml
          grep -F 'drjavadrezazadeh.com' /tmp/sitemap.xml

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP             https://drjavadrezazadeh.com/api/health -o /tmp/api-health.json
          cat /tmp/api-health.json
          grep -F '"hosting":"bertina"' /tmp/api-health.json
          grep -F '"database":true' /tmp/api-health.json
          grep -F '"mailTransport":"bertina-smtp"' /tmp/api-health.json
          grep -F '"auth":true' /tmp/api-health.json

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP \
            https://drjavadrezazadeh.com/api/auth/health -o /tmp/auth-health.json
          cat /tmp/auth-health.json
          grep -F '"service":"auth"' /tmp/auth-health.json
          grep -F '"ready":true' /tmp/auth-health.json
          grep -F '"database":true' /tmp/auth-health.json
          grep -F '"email":true' /tmp/auth-health.json
          grep -F '"passwordKdf":true' /tmp/auth-health.json

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP             https://drjavadrezazadeh.com/api/commerce/health -o /tmp/commerce-health.json
          cat /tmp/commerce-health.json
          grep -F '"orderCapture":true' /tmp/commerce-health.json

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP \
            -H 'Origin: https://drjavadrezazadeh.com' \
            -H 'Content-Type: application/json' \
            --data '{"dryRun":true,"items":[{"sku":"book:roshanaei","quantity":1}],"customer":{"name":"Store Smoke Test","email":"smoke-test@example.com","address":"Smoke test delivery address","postal":"99999","phone":""}}' \
            https://drjavadrezazadeh.com/api/commerce/prepare -o /tmp/order-dry-run.json
          cat /tmp/order-dry-run.json
          grep -F '"ok":true' /tmp/order-dry-run.json
          grep -F '"dryRun":true' /tmp/order-dry-run.json
          grep -F '"orderCapture":true' /tmp/order-dry-run.json
          grep -F '"totalToman":2000000' /tmp/order-dry-run.json
          grep -F '"paymentStarted":false' /tmp/order-dry-run.json

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP \
            https://drjavadrezazadeh.com/fa/shop/ -o /tmp/shop-live.html
          grep -F 'ثبت سفارش روی سرور فعال است' /tmp/shop-live.html
          grep -F 'book-store.js?v=20261010-order-capture-v6' /tmp/shop-live.html

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP \
            https://drjavadrezazadeh.com/fa/shop/checkout/ -o /tmp/checkout-live.html
          grep -F 'در حال بررسی آمادگی ثبت سفارش' /tmp/checkout-live.html
          grep -F 'book-store.js?v=20261010-order-capture-v6' /tmp/checkout-live.html

          echo "=== ROOT ALIAS NORMAL ==="
          curl -kisS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP \
            -H 'Cache-Control: no-cache' \
            https://drjavadrezazadeh.com/shop/ -o /tmp/shop-normal.txt
          tr -d '\015' < /tmp/shop-normal.txt | sed -n '1,30p'

          echo "=== ROOT ALIAS CACHE-BUSTED ==="
          curl -kisS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP \
            -H 'Cache-Control: no-cache' \
            "https://drjavadrezazadeh.com/shop/?_origin_probe=${GITHUB_RUN_ID}" -o /tmp/shop-busted.txt
          tr -d '\015' < /tmp/shop-busted.txt | sed -n '1,30p'

          echo "=== OTHER ROOT ALIASES ==="
          for p in about books login register; do
            curl -kisS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP \
              -H 'Cache-Control: no-cache' "https://drjavadrezazadeh.com/$p/" -o "/tmp/$p.txt"
            echo "-- $p --"
            tr -d '\015' < "/tmp/$p.txt" | sed -n '1,16p' | grep -Ei '^(HTTP/|location:|x-litespeed-cache:|cache-control:)' || true
          done
