name: Konkur Mother Database SQL QA (Ephemeral Only)
on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - "database/unified/003e_admission_knowledge_catalog_PROPOSED.sql"
      - "database/unified/003f_candidate_exam_data_PROPOSED.sql"
      - "docs/migrations/20261020_konkur_scorecards_readonly_preflight.sql"
      - "tests/konkur-candidate-data-schema-contract.test.mjs"
      - "docs/migrations/20261020_konkur_catalog_readonly_preflight.sql"
      - "docs/migrations/20261020_konkur_catalog_readonly_postflight.sql"
      - "docs/migrations/20261020_konkur_1405_sources_DRAFT_seed_PROPOSED.sql"
      - "docs/migrations/20261021_konkur_1405_page_anchors_DRAFT_PROPOSED.sql"
      - "tests/konkur-1405-page-anchors.test.mjs"
      - "tests/konkur-mother-schema-contract.test.mjs"
      - "api/konkur-admission.php"
      - "api/index.php"
      - "tests/konkur-catalogue-api-contract.test.mjs"
      - "tests/konkur-catalogue-ephemeral.php"
      - "tests/fixtures/konkur-catalogue-synthetic.sql"
      - ".github/workflows/konkur-mother-database-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mariadb-fixture:
    name: Validate additive 003e against fresh MariaDB 10.11 without real data
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-only-fixture-password
          MARIADB_DATABASE: drjavad1_store
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      MYSQL_PWD: ci-only-fixture-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify schema and no-destructive-operation contracts
        run: |
          node --test tests/konkur-mother-schema-contract.test.mjs
          node --test tests/konkur-1405-page-anchors.test.mjs
          node --test tests/konkur-catalogue-api-contract.test.mjs
          node --test tests/konkur-candidate-data-schema-contract.test.mjs
      - name: Install client for temporary isolated MariaDB container
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client php-cli php-mysql
      - name: Install existing canonical parent schema into disposable fixture only
        shell: bash
        run: |
          set -euo pipefail
          db=(mariadb --protocol=tcp -h127.0.0.1 -P3306 -uroot --database=drjavad1_store)
          "${db[@]}" < docs/BERTINA_MYSQL_SCHEMA.sql
          "${db[@]}" < database/unified/001_core_governance.sql
          "${db[@]}" < database/unified/003a_education_longitudinal.sql
          "${db[@]}" < docs/migrations/20261020_konkur_catalog_readonly_preflight.sql > /tmp/konkur-preflight-fixture.txt
          echo 'Disposable canonical parent fixture and read-only preflight succeeded.'
      - name: Create eight proposed tables and check foreign keys and idempotence
        shell: bash
        run: |
          set -euo pipefail
          db=(mariadb --protocol=tcp -h127.0.0.1 -P3306 -uroot --database=drjavad1_store)
          "${db[@]}" < database/unified/003e_admission_knowledge_catalog_PROPOSED.sql
          "${db[@]}" < docs/migrations/20261020_konkur_catalog_readonly_postflight.sql > /tmp/konkur-postflight-fixture.txt
          count=$("${db[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='drjavad1_store' AND TABLE_NAME LIKE 'eco_admission_%' AND TABLE_TYPE='BASE TABLE'")
          test "$count" = "8"
          fks=$("${db[@]}" --batch --skip-column-names -e "SELECT COUNT(DISTINCT TABLE_NAME,CONSTRAINT_NAME) FROM information_schema.KEY_COLUMN_USAGE WHERE TABLE_SCHEMA='drjavad1_store' AND TABLE_NAME LIKE 'eco_admission_%' AND REFERENCED_TABLE_NAME IS NOT NULL")
          test "$fks" -ge 15
          "${db[@]}" < database/unified/003e_admission_knowledge_catalog_PROPOSED.sql
          again=$("${db[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='drjavad1_store' AND TABLE_NAME LIKE 'eco_admission_%' AND TABLE_TYPE='BASE TABLE'")
          test "$again" = "8"
          echo "8 tables, $fks foreign keys; repeated DDL caused no additional tables (disposable database)."
      - name: Verify proposed private scorecard schema in isolated MariaDB, no real student data
        shell: bash
        run: |
          set -euo pipefail
          db=(mariadb --protocol=tcp -h127.0.0.1 -P3306 -uroot --database=drjavad1_store)
          "${db[@]}" < docs/migrations/20261020_konkur_scorecards_readonly_preflight.sql > /tmp/konkur-scorecard-preflight-fixture.txt
          "${db[@]}" < database/unified/003f_candidate_exam_data_PROPOSED.sql
          count=$("${db[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='drjavad1_store' AND TABLE_TYPE='BASE TABLE' AND (TABLE_NAME LIKE 'eco_exam_%' OR TABLE_NAME LIKE 'eco_candidate_%')")
          test "$count" = "9"
          fks=$("${db[@]}" --batch --skip-column-names -e "SELECT COUNT(DISTINCT TABLE_NAME,CONSTRAINT_NAME) FROM information_schema.KEY_COLUMN_USAGE WHERE TABLE_SCHEMA='drjavad1_store' AND (TABLE_NAME LIKE 'eco_exam_%' OR TABLE_NAME LIKE 'eco_candidate_%') AND REFERENCED_TABLE_NAME IS NOT NULL")
          test "$fks" -ge 18
          "${db[@]}" < database/unified/003f_candidate_exam_data_PROPOSED.sql
          attempts=$("${db[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM eco_candidate_exam_attempts")
          drafts=$("${db[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM eco_candidate_selection_drafts")
          test "$attempts" = "0"
          test "$drafts" = "0"
          echo "9 additional proposed private-schema tables and $fks foreign keys accepted in synthetic MariaDB; zero learner records."

      - name: Verify optional draft seed never enables eligibility
        shell: bash
        run: |
          set -euo pipefail
          db=(mariadb --protocol=tcp -h127.0.0.1 -P3306 -uroot --database=drjavad1_store)
          "${db[@]}" < docs/migrations/20261020_konkur_1405_sources_DRAFT_seed_PROPOSED.sql
          "${db[@]}" < docs/migrations/20261020_konkur_1405_sources_DRAFT_seed_PROPOSED.sql
          cycles=$("${db[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM eco_admission_cycles WHERE admission_year=1405 AND record_status='DRAFT'")
          docs=$("${db[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM eco_admission_documents WHERE document_review_state='OWNER_CONFIRMED'")
          offerings=$("${db[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM eco_admission_programme_offerings")
          approved=$("${db[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM eco_admission_documents WHERE document_review_state='QA_APPROVED'")
          test "$cycles" = "1"
          test "$docs" = "6"
          test "$offerings" = "0"
          test "$approved" = "0"
          echo "6 draft source documents, 0 verified offerings, 0 approved documents — EPHEMERAL QA ONLY."
      - name: Exercise idempotent page-anchor import against disposable MariaDB only
        shell: bash
        run: |
          set -euo pipefail
          db=(mariadb --protocol=tcp -h127.0.0.1 -P3306 -uroot --database=drjavad1_store)
          "${db[@]}" < docs/migrations/20261021_konkur_1405_page_anchors_DRAFT_PROPOSED.sql
          pages=$("${db[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM eco_admission_document_pages")
          test "$pages" = "2412"
          unreviewed=$("${db[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM eco_admission_document_pages WHERE page_review_state='UNREVIEWED'")
          test "$unreviewed" = "2412"
          "${db[@]}" < docs/migrations/20261021_konkur_1405_page_anchors_DRAFT_PROPOSED.sql
          again=$("${db[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM eco_admission_document_pages")
          test "$again" = "2412"
          offerings=$("${db[@]}" --batch --skip-column-names -e "SELECT COUNT(*) FROM eco_admission_programme_offerings")
          test "$offerings" = "0"
          echo "Staged 2,412 UNREVIEWED page anchors across six PDF sources, repeated import produced no duplicates. EPHEMERAL QA ONLY."

      - name: Verify PHP syntax and synthetic approved-only catalogue end to end
        shell: bash
        run: |
          set -euo pipefail
          php -l api/konkur-admission.php
          php -l api/index.php
          php -l tests/konkur-catalogue-ephemeral.php
          db=(mariadb --protocol=tcp -h127.0.0.1 -P3306 -uroot --database=drjavad1_store)
          "${db[@]}" < tests/fixtures/konkur-catalogue-synthetic.sql
          JR_KONKUR_CI_DSN='mysql:host=127.0.0.1;port=3306;dbname=drjavad1_store;charset=utf8mb4' \
          JR_KONKUR_CI_USER=root \
          JR_KONKUR_CI_PASSWORD="$MYSQL_PWD" \
          JR_KONKUR_SYNTHETIC_FIXTURE=true \
          php tests/konkur-catalogue-ephemeral.php
          echo 'Synthetic verified-only PHP catalogue assertions passed. No live Bertina access.'

