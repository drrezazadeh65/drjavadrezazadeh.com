name: BitPay Sandbox Smoke

on:
  push:
    branches: [main]
    paths:
      - 'platform/bitpay-adapter.mjs'
      - 'platform/bitpay-adapter.test.mjs'
      - 'scripts/bitpay-sandbox-smoke.mjs'
      - '.github/workflows/bitpay-sandbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit contract
        run: node platform/bitpay-adapter.test.mjs
      - name: Official BitPay sandbox smoke
        env:
          BITPAY_TEST_REDIRECT: https://drjavadrezazadeh.com/fa/shop/checkout/?bitpay_test=1
        run: node scripts/bitpay-sandbox-smoke.mjs
