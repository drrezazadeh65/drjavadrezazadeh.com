name: BitPay Source Contracts

on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - 'api/**'
      - 'platform/bitpay-*'
      - 'tests/bertina-receipt-contract.php'
      - '.github/workflows/bitpay-sandbox-smoke.yml'
  pull_request:
    branches: [migration/bertina-linux6]
    paths:
      - 'api/**'
      - 'platform/bitpay-*'
      - 'tests/bertina-receipt-contract.php'
      - '.github/workflows/bitpay-sandbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source without publishing changes
        run: |
          node platform/bitpay-adapter.test.mjs
          node platform/bitpay-callback.test.mjs
          php tests/bertina-receipt-contract.php
          echo 'External gateway roundtrips remain a separate controlled activation task after trusted TLS.'
