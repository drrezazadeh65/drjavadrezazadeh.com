name: BitPay Sandbox Smoke

on:
  push:
    branches: [main]
    paths:
      - 'platform/bitpay-adapter.mjs'
      - 'platform/bitpay-adapter.test.mjs'
      - 'platform/bitpay-callback.mjs'
      - 'platform/bitpay-callback.test.mjs'
      - 'scripts/bitpay-sandbox-smoke.mjs'
      - 'scripts/bitpay-form-probe.mjs'
      - 'scripts/bitpay-positive-roundtrip.mjs'
      - 'edge/payments/**'
      - '.github/workflows/bitpay-sandbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Adapter contract
        run: node platform/bitpay-adapter.test.mjs
      - name: Callback integrity contract
        run: node platform/bitpay-callback.test.mjs
      - name: Payments worker syntax
        run: node --check edge/payments/src/index.js
      - name: Sandbox callback form probe
        run: node scripts/bitpay-form-probe.mjs
      - name: Positive sandbox roundtrip
        run: node scripts/bitpay-positive-roundtrip.mjs
      - name: Official BitPay sandbox smoke
        env:
          BITPAY_TEST_REDIRECT: https://drjavadrezazadeh.com/fa/shop/checkout/?bitpay_test=1
        run: node scripts/bitpay-sandbox-smoke.mjs
