name: "JREI Desktop — Build Windows EXE Installer (No Deployment)"
# Optional owner-only packaging. Not a Bertina deploy or a model download.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jrei-desktop-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-desktop:
    name: Build one JREI-Setup.exe for Windows 10/11 x64
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact JREI source revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Python for packaging only (not installed on owner PC)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Package original JREI Tk desktop to single EXE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check --no-input pyinstaller==6.16.0
          if($LASTEXITCODE -ne 0){throw 'JREI_DESKTOP_PYINSTALLER_UNAVAILABLE'}
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name JREI --distpath 'platform/jrei-python/jrei_desktop/dist' --workpath "$env:RUNNER_TEMP/jrei-pyi-work" --specpath "$env:RUNNER_TEMP" 'platform/jrei-python/jrei_desktop/app.py'
          if($LASTEXITCODE -ne 0){throw 'JREI_DESKTOP_WINDOWS_EXE_BUILD_FAILED'}
          if(-not (Test-Path -LiteralPath 'platform/jrei-python/jrei_desktop/dist/JREI.exe' -PathType Leaf)){throw 'JREI_DESKTOP_GUI_EXE_MISSING'}
      - name: Locate Windows installer compiler
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not (Test-Path -LiteralPath $iscc -PathType Leaf)){
            choco install innosetup --no-progress -y
            if($LASTEXITCODE -ne 0){throw 'JREI_DESKTOP_WINDOWS_PACKAGER_UNAVAILABLE'}
          }
          if(-not (Test-Path -LiteralPath $iscc -PathType Leaf)){throw 'JREI_DESKTOP_ISCC_MISSING'}
          "JREI_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Produce per-user JREI-Setup.exe
        shell: pwsh
        working-directory: platform/jrei-python/jrei_desktop
        run: |
          $ErrorActionPreference='Stop'
          & $env:JREI_ISCC 'JREI-Desktop.iss'
          if($LASTEXITCODE -ne 0){throw 'JREI_DESKTOP_SETUP_COMPILATION_FAILED'}
          if(-not (Test-Path -LiteralPath 'output/JREI-Setup.exe' -PathType Leaf)){throw 'JREI_DESKTOP_INSTALLER_MISSING'}
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath 'output/JREI-Setup.exe').Hash.ToLowerInvariant()
          $size=(Get-Item -LiteralPath 'output/JREI-Setup.exe').Length
          @(
            'JREI Desktop first-party Windows installer'
            'Source commit: ${{ github.sha }}'
            "SHA256: $hash"
            "Size: $size bytes"
            'No executable code was deployed to the website.'
            'Installer does not bundle third-party pretrained model weights.'
            'Existing owner JREI backend 127.0.0.1:8092 must already be installed.'
            'No final integrated functional test was run by this packaging workflow.'
            'Windows SmartScreen can warn about unsigned binaries.'
          ) | Set-Content -Encoding utf8 'output/BUILD-RECEIPT.txt'
      - name: Attach installer and hash to GitHub Actions run
        uses: actions/upload-artifact@v4
        with:
          name: JREI-Desktop-Windows-Setup
          path: |
            platform/jrei-python/jrei_desktop/output/JREI-Setup.exe
            platform/jrei-python/jrei_desktop/output/BUILD-RECEIPT.txt
          if-no-files-found: error
          retention-days: 30
