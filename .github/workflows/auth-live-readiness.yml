name: Customer Auth Live Readiness
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'payment-api/auth-routes.js'
      - 'payment-api/worker-v4.4-corrected.js'
      - 'payment-api/worker-single-file-candidate.js'
      - 'assets/js/customer-auth.js'
      - 'tests/auth-registration-readiness.test.mjs'
      - 'tests/auth-worker-routing.test.mjs'
      - '.github/workflows/auth-live-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'payment-api/auth-routes.js'
      - 'payment-api/worker-v4.4-corrected.js'
      - 'payment-api/worker-single-file-candidate.js'
      - 'payment-api/migrations/v4.4.1-customer-auth.sql'
      - 'assets/js/customer-auth.js'
      - 'fa/register/**'
      - 'fa/login/**'
      - 'fa/bazyabi-hesab/**'
      - 'en/register/**'
      - 'en/login/**'
      - 'en/recover/**'
      - 'scripts/auth-live-readiness-audit.mjs'
      - 'tests/auth-registration-readiness.test.mjs'
      - 'tests/auth-worker-routing.test.mjs'
      - '.github/workflows/auth-live-readiness.yml'
permissions:
  contents: read
jobs:
  live-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source syntax and offline registration safety
        run: |
          node --check payment-api/auth-routes.js
          node --check payment-api/worker-v4.4-corrected.js
          node --check payment-api/worker-single-file-candidate.js
          node --check assets/js/customer-auth.js
          node tests/auth-registration-readiness.test.mjs
          node tests/auth-worker-routing.test.mjs
      - name: Verify deployed unified customer auth runtime
        if: github.event_name != 'pull_request'
        run: node scripts/auth-live-readiness-audit.mjs
