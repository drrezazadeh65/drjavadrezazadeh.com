name: Bertina Customer Auth Readiness
on:
  workflow_dispatch:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - 'api/**'
      - 'assets/js/customer-auth.js'
      - 'fa/register/**'
      - 'fa/login/**'
      - 'fa/bazyabi-hesab/**'
      - 'en/register/**'
      - 'en/login/**'
      - 'en/recover/**'
      - 'scripts/auth-live-readiness-audit.mjs'
      - '.github/workflows/auth-live-readiness.yml'
# readiness-run: 2026-10-10T14:15:00Z
permissions:
  contents: read
jobs:
  live-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed Bertina unified customer auth runtime
        run: node scripts/auth-live-readiness-audit.mjs
