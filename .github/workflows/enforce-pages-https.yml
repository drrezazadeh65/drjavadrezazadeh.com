name: Enforce GitHub Pages HTTPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enforce-pages-https.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Enable HTTPS enforcement for GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/pages-update.json -w '%{http_code}'             -X PUT             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPOSITORY/pages"             --data '{"https_enforced":true}')"

          echo "Update HTTP status: $status"
          if [ "$status" != "204" ] && [ "$status" != "200" ]; then
            cat /tmp/pages-update.json || true
            exit 1
          fi

      - name: Verify GitHub Pages HTTPS state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sS             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPOSITORY/pages" > /tmp/pages-state.json

          python3 - <<'PY'
          import json
          with open('/tmp/pages-state.json', encoding='utf-8') as f:
              data=json.load(f)
          print('cname:', data.get('cname'))
          print('https_enforced:', data.get('https_enforced'))
          print('status:', data.get('status'))
          if data.get('https_enforced') is not True:
              raise SystemExit('HTTPS enforcement is not enabled.')
          PY
