name: Verify GitHub Pages HTTPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enforce-pages-https.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify permanent HTTPS origin
        shell: bash
        run: |
          set -euo pipefail
          origin="https://drjavadrezazadeh.com"
          status="$(curl -sS --fail --max-time 25 -o /tmp/root.html -w '%{http_code}' "$origin/")"
          echo "HTTPS root status: $status"
          test "$status" = "200"

          for path in /fa/ /en/ /robots.txt /sitemap.xml; do
            code="$(curl -sS --fail --max-time 25 -o /dev/null -w '%{http_code}' "$origin$path")"
            echo "$path -> $code"
            test "$code" = "200"
          done

          echo "TLS certificate validation succeeded through curl."
          echo "HTTPS enforcement is managed by the GitHub Pages UI; this workflow verifies rather than mutates that setting."
