name: Bertina Migration Preflight

on:
  push:
    branches:
      - migration/bertina-linux6
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'sw.js'
      - 'site.webmanifest'
      - 'robots.txt'
      - 'llms.txt'
      - 'sitemap*.xml'
      - 'feed.xml'
      - 'CNAME'
      - '_config.yml'
      - '.htaccess'
      # The complete release package also contains the protected PHP API.
      - 'api/**'
      - 'platform/news-intelligence/**'
      - 'docs/migrations/20261024_jrei_news_*.sql'
      - 'tests/**'
      - 'scripts/build-public-data.mjs'
      - 'scripts/build-public-site.mjs'
      - '.github/workflows/bertina-migration-preflight.yml'
      - '.github/workflows/deploy-bertina.yml'
  pull_request:
    branches: [migration/bertina-linux6]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bertina-migration-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify safe public data projections
        run: node scripts/build-public-data.mjs --check

      - name: Build sanitized public site
        run: node scripts/build-public-site.mjs

      - name: Verify the exact packaged JREI News adapters and default-off activation
        run: |
          set -euo pipefail
          node --test tests/jrei-news-private-release.test.mjs
          php -l .public-site/api/operations-jrei-news.php
          test -f .public-site/api/internal/jrei-news/news-library.php
          test -f .public-site/api/internal/jrei-news/publication-readiness.php
          test -f .public-site/assets/js/jrei-news-owner-panel-v1.mjs
          test -f .public-site/assets/js/jrei-news-archive-v1.js
          test ! -e .public-site/platform/news-intelligence

      - name: Stamp exact owner-review candidate SHA (not a deployment)
        run: |
          set -euo pipefail
          node scripts/stamp-bertina-release.mjs
          grep -Fq "const CACHE_VERSION='jr-site-bertina-${GITHUB_SHA}';" .public-site/sw.js
          grep -Fq "jr-deploy-revision\" content=\"${GITHUB_SHA}\"" .public-site/fa/shop/index.html
          grep -Fq "jr-deploy-revision\" content=\"${GITHUB_SHA}\"" .public-site/en/shop/index.html
          echo "Archive is source-locked to ${GITHUB_SHA}. This run NEVER deploys or applies SQL. The owner-only deployment workflow remains authoritative." >> "$GITHUB_STEP_SUMMARY"

      - name: Apply Bertina/Apache deployment surface
        run: |
          test -f .public-site/.htaccess
          rm -f .public-site/CNAME .public-site/_headers .public-site/_redirects
          test ! -e .public-site/platform
          test ! -e .public-site/foundation
          test ! -e .public-site/scripts
          test ! -e .public-site/tests
          test ! -e .public-site/edge
          test ! -e .public-site/payment-api
          test ! -e .public-site/docs
          test ! -e .public-site/.github
          test ! -e .public-site/assets/media-registry.json
          test ! -e .public-site/assets/release-v4.4.json

      - name: Verify critical public routes
        run: |
          test -f .public-site/index.html
          test -f .public-site/fa/index.html
          test -f .public-site/en/index.html
          test -f .public-site/fa/customer-dashboard/index.html
          test -f .public-site/robots.txt
          test -f .public-site/sitemap.xml
          grep -Eiq '<meta name="robots" content="[^"]*noindex[^"]*nofollow' .public-site/fa/customer-dashboard/index.html

      - name: Build migration archive
        run: |
          cd .public-site
          zip -qr ../bertina-public-site.zip .

      - name: Upload verified migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: bertina-public-site
          path: bertina-public-site.zip
          if-no-files-found: error
          retention-days: 14
