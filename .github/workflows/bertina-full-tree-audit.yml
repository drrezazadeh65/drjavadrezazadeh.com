name: Bertina Full Tree Audit
on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - '.github/workflows/bertina-full-tree-audit.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List every retired-provider reference
        run: |
          set +e
          pattern='workers\.dev|api\.resend\.com|RESEND_API_KEY|wrangler|cloudflare:workers|challenges\.cloudflare\.com|Cloudflare Pages|Cloudflare Worker|Resend'
          grep -RInEi             --exclude='bertina-full-tree-audit.yml'             --exclude='bertina-provider-guard.yml'             --exclude-dir=.git             --exclude-dir=node_modules             --exclude-dir=.public-site             "$pattern" . || true
