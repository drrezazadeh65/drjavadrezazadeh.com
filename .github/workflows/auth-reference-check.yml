name: Bertina Identity Source Checks

on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - 'api/**'
      - 'assets/js/customer-auth.js'
      - 'platform/identity-auth-policy*'
      - 'tests/account-commerce-consistency.test.mjs'
      - 'tests/registration-mobile-contract.test.mjs'
      - '.github/workflows/auth-reference-check.yml'
  pull_request:
    branches: [migration/bertina-linux6]
    paths:
      - 'api/**'
      - 'assets/js/customer-auth.js'
      - 'platform/identity-auth-policy*'
      - 'tests/account-commerce-consistency.test.mjs'
      - 'tests/registration-mobile-contract.test.mjs'
      - '.github/workflows/auth-reference-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source without publishing changes
        run: |
          php -l api/index.php
          php -l api/config.example.php
          node --check assets/js/customer-auth.js
          node --test platform/identity-auth-policy.test.mjs tests/account-commerce-consistency.test.mjs tests/registration-mobile-contract.test.mjs
