name: Browser QA

on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'sw.js'
      - 'site.webmanifest'
      - 'tests/public-browser-qa.spec.js'
      - 'tests/customer-dashboard-browser.spec.js'
      - '.github/workflows/browser-qa.yml'
  pull_request:
    branches: [migration/bertina-linux6]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'sw.js'
      - 'site.webmanifest'
      - 'tests/public-browser-qa.spec.js'
      - 'tests/customer-dashboard-browser.spec.js'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The production site intentionally uses system-native font stacks.
      # Playwright's internal document.fonts.ready wait can stall on Linux CI
      # even when there are no external webfont requests.
      PW_TEST_SCREENSHOT_NO_FONTS_READY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runtime
        run: npm install --no-save @playwright/test@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/drsite-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/drsite-http.log
          exit 1
      - name: Run responsive browser QA
        shell: bash
        run: |
          set +e
          set -o pipefail
          npx playwright test tests/public-browser-qa.spec.js tests/customer-dashboard-browser.spec.js --reporter=line 2>&1 | tee /tmp/browser-qa.log
          status=${PIPESTATUS[0]}
          mkdir -p test-results
          cp /tmp/browser-qa.log test-results/browser-qa.log
          exit "$status"
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-qa-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
