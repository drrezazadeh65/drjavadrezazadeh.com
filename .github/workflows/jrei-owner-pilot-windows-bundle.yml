name: JREI Owner Pilot Windows Bundle (No Deployment)
on:
  push:
    branches:
      - migration/bertina-linux6
    paths:
      - '.github/workflows/jrei-owner-pilot-windows-bundle.yml'
      - 'platform/jrei-v5/windows-worker/jrei-worker.mjs'
      - 'platform/jrei-v5/windows-worker/jrei-owner-pilot-worker.mjs'
      - 'platform/jrei-v5/windows-worker/JREI-OWNER-PRIVATE-PILOT.cmd'
      - 'platform/jrei-v5/windows-worker/JREI-CONNECT-EXISTING-NODE-A.cmd'
      - 'platform/jrei-v5/windows-worker/JREI-CONNECT-EXISTING-NODE-B.cmd'
      - 'platform/jrei-v5/windows-worker/jrei-connect-existing-node-b.ps1'
      - 'platform/jrei-v5/windows-worker/jrei-node-b-stability-status.ps1'
      - 'tests/jrei-node-a-persistent-connect.test.mjs'
      - 'platform/jrei-v5/windows-worker/jrei-connect-existing-node-a.ps1'
      - 'platform/jrei-v5/windows-worker/jrei-managed-startup.ps1'
      - 'platform/jrei-v5/windows-worker/jrei-local-model-start.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-existing-node-a-update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static review of exact private pilot runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check platform/jrei-v5/windows-worker/jrei-worker.mjs
          node --check platform/jrei-v5/windows-worker/jrei-owner-pilot-worker.mjs
          node --check platform/jrei-v5/windows-worker/jrei-local-doctor.mjs
          node --check platform/jrei-v5/jrei-educational-answer-review.mjs
          node --check platform/jrei-v5/jrei-deterministic-arithmetic.mjs
          node --test tests/jrei-owner-private-pilot.test.mjs
          node --test tests/jrei-node-a-persistent-connect.test.mjs
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop"; foreach($name in @("jrei-connect-existing-node-a.ps1","jrei-connect-existing-node-b.ps1","jrei-node-b-stability-status.ps1","jrei-managed-startup.ps1","jrei-local-model-start.ps1")) { $tokens=$null; $parseErrors=$null; [System.Management.Automation.Language.Parser]::ParseFile("platform/jrei-v5/windows-worker/$name",[ref]$tokens,[ref]$parseErrors) | Out-Null; if($parseErrors.Count -gt 0) {throw "PowerShell source syntax invalid: $name"} }'
          fi
      - name: Package source update without owner keys, model or private config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/platform/jrei-v5/windows-worker bundle/platform/jrei-v5
          for file in JREI-OWNER-PRIVATE-PILOT.cmd JREI-CONNECT-EXISTING-NODE-A.cmd JREI-CONNECT-EXISTING-NODE-B.cmd JREI-READINESS-CHECK.cmd jrei-connect-existing-node-a.ps1 jrei-connect-existing-node-b.ps1 jrei-node-b-stability-status.ps1 jrei-managed-startup.ps1 jrei-local-model-start.ps1 jrei-local-doctor.mjs jrei-worker.mjs jrei-local-chat-worker.mjs jrei-owner-pilot-worker.mjs jrei-loopback-model-adapter.mjs jrei-worker-error-code.mjs jrei-windows-dpapi.ps1; do
            cp "platform/jrei-v5/windows-worker/$file" "bundle/platform/jrei-v5/windows-worker/$file"
          done
          for file in jrei-educational-answer-review.mjs jrei-deterministic-arithmetic.mjs; do
            cp "platform/jrei-v5/$file" "bundle/platform/jrei-v5/$file"
          done
          cat > bundle/README-JREI-OWNER-PILOT.txt <<'EOF'
          JREI PRIVATE QWEN PILOT - WINDOWS A/B, NOT PUBLIC AI

          VERIFIED OWNER TOPOLOGY 2026-10-26
          Node A identifier: 28b1c0d2-b833-41cb-97e2-df92c9373de0
          Node B identifier: 7f742039-6c42-4cb7-9bd3-044e30b059f7
          Owner observed the first real private Bertina -> Node B Qwen ->
          Bertina round trip. A running model is not public-AI release proof.

          1. Extract the bundle INTO the existing JREI-Development folder;
             preserve ALL existing private JSON/DPAPI keys and GGUF files.
          2. On the owner Windows PC with the EXISTING, proven Node B Qwen,
             run platform/jrei-v5/windows-worker/
             JREI-CONNECT-EXISTING-NODE-B.cmd and authorize Y.
             The installer checks the exact Node B identifier, GGUF and
             llama.cpp SHA pins, existing signed config and memory budget.
          3. Keep the original Qwen loopback port 127.0.0.1:8081;
             model and signed worker are scheduled under the signed-in
             Windows owner, not exposed to the public network.
          4. Verify LOCAL status without revealing private credentials:
             powershell.exe -NoProfile -File
             platform/jrei-v5/windows-worker/jrei-node-b-stability-status.ps1
             Expect the model HEALTHY and the pilot task RUNNING.
          5. Then use the existing MFA owner-only Qwen pilot on the site
             to verify an actual signed round trip. Local status alone
             does not prove Bertina connectivity.
          6. If Node A must be separately prepared, use the Node A script
             on its OWN Windows PC only. Never copy or edit node identity,
             private config, DPAPI key or public model-release flags.

          Worker idle polling backs off to at most 20s, transient errors
          retry with bounded delays; revoked keys still stop immediately.
          Automatic startup occurs after the matching Windows owner LOGS IN
          and that PC remains powered, awake and connected to the Internet.
          Existing functioning scheduled tasks are preserved.
          NO website deploy, SQL migration, model download, weight training
          payment action, or public generative approval is in this bundle.
          EOF
          (cd bundle && find platform -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - name: Publish owner-downloadable no-secret update
        uses: actions/upload-artifact@v4
        with:
          name: JREI-OWNER-PILOT-WINDOWS-NODES
          path: bundle/
          retention-days: 30
          if-no-files-found: error
