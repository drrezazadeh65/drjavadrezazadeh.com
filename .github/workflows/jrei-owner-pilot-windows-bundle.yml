name: JREI Owner Pilot Windows Bundle (No Deployment)
on:
  push:
    branches:
      - migration/bertina-linux6
    paths:
      - '.github/workflows/jrei-owner-pilot-windows-bundle.yml'
      - 'platform/jrei-v5/windows-worker/jrei-worker.mjs'
      - 'platform/jrei-v5/windows-worker/jrei-owner-pilot-worker.mjs'
      - 'platform/jrei-v5/windows-worker/JREI-OWNER-PRIVATE-PILOT.cmd'
      - 'platform/jrei-v5/windows-worker/JREI-CONNECT-EXISTING-NODE-A.cmd'
      - 'platform/jrei-v5/windows-worker/jrei-connect-existing-node-a.ps1'
      - 'platform/jrei-v5/windows-worker/jrei-managed-startup.ps1'
      - 'platform/jrei-v5/windows-worker/jrei-local-model-start.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-existing-node-a-update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static review of exact private pilot runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check platform/jrei-v5/windows-worker/jrei-worker.mjs
          node --check platform/jrei-v5/windows-worker/jrei-owner-pilot-worker.mjs
          node --check platform/jrei-v5/windows-worker/jrei-local-doctor.mjs
          node --check platform/jrei-v5/jrei-educational-answer-review.mjs
          node --check platform/jrei-v5/jrei-deterministic-arithmetic.mjs
          node --test tests/jrei-owner-private-pilot.test.mjs
          node --test tests/jrei-node-a-persistent-connect.test.mjs
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop"; foreach($name in @("jrei-connect-existing-node-a.ps1","jrei-managed-startup.ps1","jrei-local-model-start.ps1")) { $tokens=$null; $parseErrors=$null; [System.Management.Automation.Language.Parser]::ParseFile("platform/jrei-v5/windows-worker/$name",[ref]$tokens,[ref]$parseErrors) | Out-Null; if($parseErrors.Count -gt 0) {throw "PowerShell source syntax invalid: $name"} }'
          fi
      - name: Package source update without owner keys, model or private config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/platform/jrei-v5/windows-worker bundle/platform/jrei-v5
          for file in JREI-OWNER-PRIVATE-PILOT.cmd JREI-CONNECT-EXISTING-NODE-A.cmd JREI-READINESS-CHECK.cmd jrei-connect-existing-node-a.ps1 jrei-managed-startup.ps1 jrei-local-model-start.ps1 jrei-local-doctor.mjs jrei-worker.mjs jrei-local-chat-worker.mjs jrei-owner-pilot-worker.mjs jrei-loopback-model-adapter.mjs jrei-worker-error-code.mjs jrei-windows-dpapi.ps1; do
            cp "platform/jrei-v5/windows-worker/$file" "bundle/platform/jrei-v5/windows-worker/$file"
          done
          for file in jrei-educational-answer-review.mjs jrei-deterministic-arithmetic.mjs; do
            cp "platform/jrei-v5/$file" "bundle/platform/jrei-v5/$file"
          done
          cat > bundle/README-JREI-OWNER-PILOT.txt <<'EOF'
          JREI EXPERIMENTAL PRIVATE OWNER PILOT — NOT PUBLIC AI

          1. Extract ALL contents INTO the existing JREI-Development folder
             so the platform/jrei-v5/windows-worker paths match exactly.
             Replace only the provided source files when Windows asks.
          2. DO NOT move or upload any private DPAPI key or JSON config.
          3. On EXISTING 32GB Node A, double-click:
             platform/jrei-v5/windows-worker/
             JREI-CONNECT-EXISTING-NODE-A.cmd
             Approve Y. It keeps existing signed keys, model weights and
             Node B unchanged. It installs missing owner logon tasks only.
             It starts the hash-pinned model if the loopback model is down.
             If the separately reviewed live chat configuration is ON,
             it starts the signed chat worker. Otherwise, it starts the
             private pilot ONLY if the private model rights-review
             approval already exists. It never sets private approval flags.
          4. For an optional read-only check, double-click
             JREI-READINESS-CHECK.cmd. It never changes credentials.
          5. Review the existing MFA owner JREI diagnostics for actual
             signed model queue receipts and any remaining private host
             encryption, migration, retention or release gates.
          6. Do not call public AI LIVE until actual bilingual website-to-
             Bertina-to-model-to-site results and host privacy gates pass.

          No model downloaded or replaced. No public release flag or
          quality acceptance is changed. Responses may be incorrect.
          The server needs the existing registered Node A to be ENABLED,
          a rights-reviewed model with exact matching SHA and the private
          local-chat encryption key configured.
          This bundle alone does NOT guarantee a successful pilot, which
          must be confirmed by a real signed round-trip from Node A.
          EOF
          (cd bundle && find platform -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - name: Publish owner-downloadable no-secret update
        uses: actions/upload-artifact@v4
        with:
          name: JREI-OWNER-PILOT-NODE-A
          path: bundle/
          retention-days: 30
          if-no-files-found: error
