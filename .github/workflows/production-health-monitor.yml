name: Production SEO Health

on:
  workflow_dispatch:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - scripts/production-health-audit.mjs
      - foundation/V4.4-EXECUTION-AND-EMAIL-CLOSURE-2026-10-09.md
      - api/index.php
      - api/config.example.php
      - .github/workflows/production-health-monitor.yml
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: production-seo-health
  cancel-in-progress: true

jobs:
  live-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'migration/bertina-linux6' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit live production origin
        env:
          PROD_ORIGIN: https://drjavadrezazadeh.com
          PRODUCTION_HEALTH_STRICT: '1'
        run: node scripts/production-health-audit.mjs
      - name: Explain strict production state
        if: always()
        run: |
          echo "Production health monitoring is active in STRICT mode."
          echo "Bertina public CA-trusted TLS remains an external gate. This monitor keeps strict TLS verification; a source pass is not public certification."
