name: Production SEO Health

on:
  workflow_dispatch:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - scripts/production-health-audit.mjs
      - foundation/V4.4-EXECUTION-AND-EMAIL-CLOSURE-2026-10-09.md
      - api/index.php
      - api/config.example.php
      - .github/workflows/production-health-monitor.yml
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: production-seo-health
  cancel-in-progress: true

jobs:
  live-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'migration/bertina-linux6' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit live production origin
        env:
          PROD_ORIGIN: https://drjavadrezazadeh.com
          PRODUCTION_HEALTH_STRICT: '1'
          PRODUCTION_HEALTH_EVIDENCE_PATH: production-public-evidence.json
        run: node scripts/production-health-audit.mjs
      - name: Upload sanitized live source-versus-release proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bertina-public-live-proof
          path: production-public-evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Explain strict production scope
        if: always()
        run: |
          echo "Independent production checks use CA-trusted HTTPS without curl -k."
          echo "The observed live release may legitimately trail branch HEAD until signed recovery and a serialized deployment."
          echo "Source/browser CI and public checkout-readiness indicators are not signed restore, MFA, payment settlement or fulfilment proof."
