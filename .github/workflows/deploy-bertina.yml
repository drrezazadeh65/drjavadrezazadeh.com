name: Deploy to Bertina

on:
  push:
    branches:
      - migration/bertina-linux6
    paths:
      - '.bertina-deploy-trigger'
      - '.github/workflows/deploy-bertina.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bertina-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and verify sanitized public site
        run: |
          node scripts/build-public-data.mjs --check
          node scripts/build-public-site.mjs
          test -f .public-site/.htaccess
          test ! -e .public-site/platform
          test ! -e .public-site/foundation
          test ! -e .public-site/scripts
          test ! -e .public-site/tests
          test ! -e .public-site/edge
          test ! -e .public-site/payment-api
          test ! -e .public-site/docs
          test ! -e .public-site/.github

      - name: Check Bertina repository secrets
        id: credentials
        env:
          FTP_HOST: ${{ secrets.BERTINA_FTP_HOST }}
          FTP_USER: ${{ secrets.BERTINA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BERTINA_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.BERTINA_FTP_REMOTE_DIR }}
        run: |
          if [ -n "$FTP_HOST" ] && [ -n "$FTP_USER" ] && [ -n "$FTP_PASSWORD" ] && [ -n "$FTP_REMOTE_DIR" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Bertina deployment credentials are configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Bertina deployment skipped: repository secrets are not configured yet." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install secure FTP client
        if: steps.credentials.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy sanitized artifact over explicit TLS
        if: steps.credentials.outputs.ready == 'true'
        env:
          FTP_HOST: ${{ secrets.BERTINA_FTP_HOST }}
          FTP_USER: ${{ secrets.BERTINA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BERTINA_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.BERTINA_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail

          deploy_once() {
            timeout 900s lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 1
          set net:timeout 20
          set net:reconnect-interval-base 2
          set net:reconnect-interval-max 8
          mirror -R --delete --continue --parallel=2 --verbose \
            --exclude-glob ".well-known/**" \
            --exclude-glob "cgi-bin/**" \
            --exclude-glob ".user.ini" \
            --exclude-glob "php.ini" \
            --exclude-glob "api/config.local.php" \
            --exclude-glob "api/storage/**" \
            .public-site/ "$FTP_REMOTE_DIR"
          bye
          LFTP
          }

          if ! deploy_once; then
            echo "First FTPS mirror attempt did not complete; retrying once from transferred state."
            sleep 5
            deploy_once
          fi

      - name: Verify Bertina origin directly
        if: steps.credentials.outputs.ready == 'true'
        env:
          FTP_HOST: ${{ secrets.BERTINA_FTP_HOST }}
        run: |
          ORIGIN_IP="$(getent ahostsv4 "$FTP_HOST" | awk 'NR==1{print $1}')"
          test -n "$ORIGIN_IP"

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:"$ORIGIN_IP"             https://drjavadrezazadeh.com/fa/ -o /tmp/fa.html
          grep -F '<html lang="fa" dir="rtl">' /tmp/fa.html

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:"$ORIGIN_IP"             https://drjavadrezazadeh.com/en/ -o /tmp/en.html
          grep -F '<html lang="en"' /tmp/en.html

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:"$ORIGIN_IP"             https://drjavadrezazadeh.com/fa/customer-dashboard/ -o /tmp/dashboard.html
          grep -F '<meta name="robots" content="noindex,nofollow">' /tmp/dashboard.html

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:"$ORIGIN_IP"             https://drjavadrezazadeh.com/robots.txt -o /tmp/robots.txt
          test -s /tmp/robots.txt

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:"$ORIGIN_IP"             https://drjavadrezazadeh.com/sitemap.xml -o /tmp/sitemap.xml
          grep -F 'drjavadrezazadeh.com' /tmp/sitemap.xml

          echo "Verifying every deployed HTML file against the exact sanitized build..."
          checked=0
          while IFS= read -r file; do
            rel="${file#.public-site}"
            tmp="$(mktemp)"
            curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:"$ORIGIN_IP"               "https://drjavadrezazadeh.com${rel}" -o "$tmp"
            if ! cmp -s "$file" "$tmp"; then
              echo "Remote HTML mismatch: ${rel}"
              rm -f "$tmp"
              exit 1
            fi
            rm -f "$tmp"
            checked=$((checked + 1))
          done < <(find .public-site -type f -name '*.html' | sort)
          echo "Exact HTML verification passed for ${checked} pages."

      - name: Deployment summary
        if: steps.credentials.outputs.ready == 'true'
        run: |
          echo "Bertina deployment and direct-origin verification completed from commit ${GITHUB_SHA}."
          echo "Public DNS/SSL propagation can now be verified independently."
