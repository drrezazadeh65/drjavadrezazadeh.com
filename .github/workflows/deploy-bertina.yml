          echo "Managed redirect lines:"
          grep -En 'RewriteRule.*shop|djavadezazadeh|RewriteCond.*HTTP_HOST|Redirect' /tmp/remote-root.htaccess || true

          set +e
          timeout 60s lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://server388.bertina.biz" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 1
          set net:timeout 15
          cd "$FTP_REMOTE_DIR"
          get ../.htaccess -o /tmp/remote-parent.htaccess
          bye
          LFTP
          parent_rc=$?
          set -e
          if [ "$parent_rc" -eq 0 ] && [ -s /tmp/remote-parent.htaccess ]; then
            echo "Parent .htaccess redirect-related lines:"
            grep -En 'RewriteRule.*shop|djavadezazadeh|RewriteCond.*HTTP_HOST|Redirect' /tmp/remote-parent.htaccess || true
          else
            echo "No readable parent .htaccess through the deployment account."
          fi

