        env:
          FTP_USER: ${{ secrets.BERTINA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BERTINA_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.BERTINA_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          echo "188.40.203.218 server388.bertina.biz" | sudo tee -a /etc/hosts >/dev/null
          timeout 90s lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://server388.bertina.biz" \
            -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; set ftp:passive-mode true; set ftp:prefer-epsv false; cd \"$FTP_REMOTE_DIR\"; cls -1 ../backup-*_drjavad1.tar.gz; bye" \
            > /tmp/bertina-backup-list.txt
          python3 scripts/bertina-prune-backups.py /tmp/bertina-backup-list.txt > /tmp/bertina-backup-prune.json
          python3 - <<'PY'
          import json
          plan=json.load(open('/tmp/bertina-backup-prune.json',encoding='utf-8'))
          print('Retaining canonical cPanel backup:',plan['keep'])
          print('Older backup archives to remove:',len(plan['remove']))
          with open('/tmp/bertina-backup-prune.commands','w',encoding='utf-8') as f:
              for name in plan['remove']:
                  f.write('rm "../'+name+'"\\n')
          PY
          if [ -s /tmp/bertina-backup-prune.commands ]; then
            {
              printf 'set ftp:ssl-force true\\nset ftp:ssl-protect-data true\\nset ssl:verify-certificate yes\\nset ftp:passive-mode true\\nset ftp:prefer-epsv false\\ncd "%s"\\n' "$FTP_REMOTE_DIR"
              cat /tmp/bertina-backup-prune.commands
              printf 'bye\\n'
            } > /tmp/bertina-backup-prune.lftp
            timeout 90s lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://server388.bertina.biz" -f /tmp/bertina-backup-prune.lftp
          fi
          echo "One cPanel backup retained; older matching account archives were removed after the live release checks passed." >> "$GITHUB_STEP_SUMMARY"

