name: Deploy to Bertina

on:
  push:
    branches:
      - migration/bertina-linux6
  workflow_dispatch:
    inputs:
      recovery_mode:
        description: "Recovery policy (default signed; alternate accepts untested restore risk)"
        required: true
        type: choice
        default: signed_restore
        options:
          - signed_restore
          - owner_cpanel_custody
      approved_commit_sha:
        description: "For cPanel custody ONLY: paste exact 40-character branch HEAD SHA"
        required: false
        type: string
      expected_live_sha:
        description: "For cPanel custody ONLY: paste current deployed 40-character /sw.js SHA"
        required: false
        type: string
      owner_acknowledgement:
        description: "For cPanel custody ONLY: type ACCEPT_UNTESTED_RESTORE_RISK_V5"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bertina-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/migration/bertina-linux6'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-password
          MYSQL_DATABASE: operations_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-password"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture the live release fingerprint for automatic deployment
        if: github.event_name == 'push'
        id: live_release
        run: |
          set -euo pipefail
          curl -fsSL --max-time 25 https://drjavadrezazadeh.com/sw.js -o /tmp/live-sw.js
          live_sha="$(sed -n "s/^const CACHE_VERSION='jr-site-bertina-\\([a-f0-9]\\{40\\}\\)';$/\\1/p" /tmp/live-sw.js)"
          [[ "$live_sha" =~ ^[a-f0-9]{40}$ ]]
          test "$live_sha" != "$GITHUB_SHA"
          echo "sha=$live_sha" >> "$GITHUB_OUTPUT"

      - name: Authorize the exact recovery policy before any deploy activity
        id: release_policy
        env:
          RECOVERY_MODE_INPUT: ${{ inputs.recovery_mode }}
          APPROVED_COMMIT_SHA_INPUT: ${{ inputs.approved_commit_sha }}
          EXPECTED_LIVE_SHA_INPUT: ${{ inputs.expected_live_sha }}
          OWNER_ACKNOWLEDGEMENT_INPUT: ${{ inputs.owner_acknowledgement }}
          LIVE_RELEASE_SHA: ${{ steps.live_release.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [[ "$LIVE_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            test "$LIVE_RELEASE_SHA" != "$GITHUB_SHA"
            echo "mode=owner_cpanel_custody" >> "$GITHUB_OUTPUT"
            echo "expected_live_sha=$LIVE_RELEASE_SHA" >> "$GITHUB_OUTPUT"
            echo "Standing owner instruction: automatic site releases use the verified current Bertina state and retain one newest cPanel account backup. An isolated restoration is not independently tested." >> "$GITHUB_STEP_SUMMARY"
          else
            mode="${RECOVERY_MODE_INPUT:-signed_restore}"
            case "$mode" in
              signed_restore) echo "mode=signed_restore" >> "$GITHUB_OUTPUT" ;;
              owner_cpanel_custody)
                test "$GITHUB_EVENT_NAME" = workflow_dispatch
                test "$GITHUB_ACTOR" = drrezazadeh65
                test "$APPROVED_COMMIT_SHA_INPUT" = "$GITHUB_SHA"
                test "$OWNER_ACKNOWLEDGEMENT_INPUT" = ACCEPT_UNTESTED_RESTORE_RISK_V5
                [[ "$EXPECTED_LIVE_SHA_INPUT" =~ ^[a-f0-9]{40}$ ]]
                test "$EXPECTED_LIVE_SHA_INPUT" != "$GITHUB_SHA"
                echo "mode=owner_cpanel_custody" >> "$GITHUB_OUTPUT"
                echo "expected_live_sha=$EXPECTED_LIVE_SHA_INPUT" >> "$GITHUB_OUTPUT"
                echo "Owner knowingly accepts **no independent isolated restore** for this one run; current live-SHA drift guard remains mandatory." >> "$GITHUB_STEP_SUMMARY"
                ;;
              *) echo "Invalid recovery mode" >&2; exit 1 ;;
            esac
          fi

      - name: Restrict automatic releases to public site changes
        if: github.event_name == 'push'
        env:
          EXPECTED_LIVE_SHA: ${{ steps.release_policy.outputs.expected_live_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$EXPECTED_LIVE_SHA^{commit}"
          changed="$(git diff --name-only "$EXPECTED_LIVE_SHA" "$GITHUB_SHA")"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/deploy-bertina.yml|scripts/build-public-site.mjs|scripts/build-public-data.mjs|scripts/stamp-bertina-release.mjs|scripts/bertina-controlled-cpanel-gate.php|tests/bertina-controlled-cpanel-gate.php|scripts/bertina-prune-backups.py|tests/bertina-prune-backups.py|scripts/workflow-governance-audit.mjs|.github/workflows/bertina-controlled-release-guard.yml|docs/governance/STAGE09_PRIVATE_DEPENDENCIES.json|docs/governance/V5_CONTROLLED_CPANEL_RELEASE_20261013.md|fa/*|en/*|assets/images/*|assets/css/*|assets/fonts/*|assets/icons/*|assets/data/*|index.html|offline.html|robots.txt|sitemap.xml|favicon.svg|site.webmanifest|manifest.json|.bertina-deploy-trigger)
                ;;
              api/*|platform/*|foundation/*|edge/*|payment-api/*|database/*|migrations/*|docs/*|tests/*|scripts/*|.github/*|.bertina-backup-trigger|*.php|*.sql|*.env|.htaccess|package.json|package-lock.json|composer.json|composer.lock)
                echo "Automatic production release blocked by protected change: $path" >&2
                exit 1
                ;;
              assets/js/*)
                case "$path" in
                  *checkout*|*commerce*|*payment*|*donation*|*receipt*|*order*|*cart*)
                    echo "Automatic production release blocked by financial/runtime change: $path" >&2
                    exit 1
                    ;;
                  *) ;;
                esac
                ;;
              *)
                echo "Automatic production release blocked by unclassified change: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"
          echo "Only public-site paths changed since the deployed commit." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile and exercise both fail-closed recovery policy gates
        run: |
          php -l scripts/bertina-private-recovery-gate.php
          php -l scripts/bertina-controlled-cpanel-gate.php
          php tests/bertina-private-recovery-gate.php
          php tests/bertina-controlled-cpanel-gate.php
          python3 tests/bertina-release-assembly.py

      - name: Verify operations registry, security and real MySQL
        env:
          OPERATIONS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=operations_fixture;charset=utf8mb4
          OPERATIONS_TEST_USER: root
          OPERATIONS_TEST_PASSWORD: fixture-password
        run: |
          node scripts/operations-registry-audit.mjs
          python3 scripts/operations-canonical-registry.py api/internal/operations-registry.json --validate-only --identity-manifest api/internal/operations-action-identities-v1.json
          python3 tests/operations-canonical-registry.py
          php tests/operations-reporting.php
          for file in api/*.php; do php -l "$file"; done
          php tests/bertina-smtp-body-contract.php
          php tests/bertina-service-buyer-contact.php
          node --check assets/js/commerce-checkout.js
          node tests/bertina-service-contact-checkout.mjs
          php tests/operations-security.php
          php tests/operations-mysql.php
          node --check assets/js/operations-social.js
          node --check assets/js/operations-social-composer.js
          node --test platform/social-distribution/*.test.mjs
          # Only isolated CI MySQL 8. Never connect to the live Bertina database.
          php -r '$pdo=new PDO("mysql:host=127.0.0.1;port=3306;dbname=operations_fixture;charset=utf8mb4","root","fixture-password"); $pdo->exec("CREATE DATABASE IF NOT EXISTS social_fixture CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          SOCIAL_TEST_DSN='mysql:host=127.0.0.1;port=3306;dbname=social_fixture;charset=utf8mb4' SOCIAL_TEST_USER=root SOCIAL_TEST_PASSWORD=fixture-password php tests/social-queue-mysql.php
          php tests/bertina-receipt-access.php
          php tests/bertina-receipt-contract.php
          php tests/bertina-commerce-callback-contract.php
          php tests/bertina-commerce-mysql-contract.php
          php tests/bertina-donations-mysql-contract.php
          php tests/bertina-student-support-contract.php
          php -l scripts/journal-ojs-preflight.php
          php -l tests/journal-ojs-preflight.php
          php tests/journal-ojs-preflight.php

      - name: Verify operations browser behavior before release
        run: |
          npm install --no-save @playwright/test@1.56.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/operations-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/operations-browser.spec.js tests/operations-reporting-browser.spec.js tests/bookstore-checkout-browser.spec.js tests/service-request-summary.spec.js --reporter=line

      - name: Independently certify apex and www TLS
        run: node scripts/operations-tls-certify.mjs /tmp/operations-tls.json

      - name: Retain independent certificate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-tls-${{ github.sha }}
          path: /tmp/operations-tls.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Build and verify sanitized public site
        run: |
          set -euo pipefail
          node scripts/build-public-data.mjs --check
          node scripts/build-public-site.mjs
          node scripts/bookstore-release-audit.mjs
          node scripts/public-retired-commerce-audit.mjs
          node scripts/stamp-bertina-release.mjs
          test -f .public-site/.htaccess
          test ! -e .public-site/platform
          test ! -e .public-site/foundation
          test ! -e .public-site/scripts
          test ! -e .public-site/tests
          test ! -e .public-site/edge
          test ! -e .public-site/payment-api
          test ! -e .public-site/docs
          test ! -e .public-site/.github

      - name: Check Bertina repository secrets
        id: credentials
        env:
          FTP_USER: ${{ secrets.BERTINA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BERTINA_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.BERTINA_FTP_REMOTE_DIR }}
        run: |
          if [ -n "$FTP_USER" ] && [ -n "$FTP_PASSWORD" ] && [ -n "$FTP_REMOTE_DIR" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Bertina deployment credentials are configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Bertina deployment blocked: repository secrets are not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Package exact public release
        if: steps.credentials.outputs.ready == 'true'
        run: |
          set -euo pipefail
          OPERATIONS_TESTS_PASSED=true node scripts/operations-release-evidence.mjs
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root=pathlib.Path('.public-site')
          files={}
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel=p.relative_to(root).as_posix()
              files[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={'commit':os.environ['GITHUB_SHA'],'fileCount':len(files),'files':files}
          (root/'bertina-deploy-manifest.json').write_text(json.dumps(manifest,separators=(',',':')),encoding='utf-8')
          with zipfile.ZipFile('/tmp/bertina-site.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  z.write(p,p.relative_to(root).as_posix())
          (root/'bertina-deploy-manifest.json').unlink()
          print(f"Packaged {len(files)} managed files.")
          PY

      - name: Install secure FTP client
        if: steps.credentials.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Reject a stale production commit before uploading
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/migration/bertina-linux6 | cut -f1)"
          test "$current" = "$GITHUB_SHA"

      - name: Upload one release package over explicit TLS
        if: steps.credentials.outputs.ready == 'true'
        id: package
        env:
          FTP_USER: ${{ secrets.BERTINA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BERTINA_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.BERTINA_FTP_REMOTE_DIR }}
          RECOVERY_MODE: ${{ steps.release_policy.outputs.mode }}
          EXPECTED_LIVE_SHA: ${{ steps.release_policy.outputs.expected_live_sha }}
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          TOKEN_HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          NONCE="$(openssl rand -hex 10)"
          ZIP_NAME="bertina-release-$NONCE.zip"
          SCRIPT_NAME="bertina-deploy-$NONCE.php"
          RECOVERY_GATE_SOURCE="$(tail -n +2 scripts/bertina-private-recovery-gate.php)"
          CONTROLLED_GATE_SOURCE="$(tail -n +2 scripts/bertina-controlled-cpanel-gate.php)"
          BACKUP_REQUEST_B64="$(base64 -w0 .bertina-backup-trigger)"
          test -n "$RECOVERY_GATE_SOURCE" && test -n "$CONTROLLED_GATE_SOURCE"
          test -n "$BACKUP_REQUEST_B64"
          [[ "$RECOVERY_MODE" = signed_restore || "$RECOVERY_MODE" = owner_cpanel_custody ]]
          if [ "$RECOVERY_MODE" = owner_cpanel_custody ]; then
            [[ "$EXPECTED_LIVE_SHA" =~ ^[a-f0-9]{40}$ ]]
          fi

          cat > "/tmp/$SCRIPT_NAME" <<PHP
          <?php
          // Both recovery policies are source-controlled and execute before extraction.
          // Signed RSA restore remains the default. Controlled owner exception is explicit.
          $RECOVERY_GATE_SOURCE
          $CONTROLLED_GATE_SOURCE
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          header('X-Robots-Tag: noindex, noarchive');
          \$expectedHash = '$TOKEN_HASH';
          \$provided = isset(\$_SERVER['HTTP_X_DEPLOY_TOKEN']) ? (string) \$_SERVER['HTTP_X_DEPLOY_TOKEN'] : '';
          \$providedHash = hash('sha256', \$provided);
          \$tokenOk = function_exists('hash_equals') ? hash_equals(\$expectedHash, \$providedHash) : (\$expectedHash === \$providedHash);
          if (!\$tokenOk) {
              http_response_code(403);
              echo json_encode(['ok'=>false,'error'=>'forbidden']);
              exit;
          }
          ignore_user_abort(true);
          \$deployLock = @fopen(sys_get_temp_dir() . '/drjr-bertina-deploy-' . hash('sha256', __DIR__) . '.lock', 'c');
          if (!\$deployLock || !flock(\$deployLock, LOCK_EX | LOCK_NB)) {
              @unlink(__DIR__ . '/$ZIP_NAME');
              @unlink(__FILE__);
              http_response_code(409);
              echo json_encode(['ok'=>false,'error'=>'deployment_in_progress']);
              exit;
          }
          \$zipPath = __DIR__ . '/$ZIP_NAME';
          \$manifestPath = __DIR__ . '/bertina-deploy-manifest.json';
          \$cleanup = function() use (\$zipPath, \$manifestPath) {
              @unlink(\$zipPath);
              @unlink(\$manifestPath);
              @unlink(__FILE__);
          };
          // Distinct explicit release paths. Never misrepresent cPanel custody
          // as a signed isolated-restore proof. Both fail BEFORE any source extraction.
          // Only fixed valid enum values reach this PHP after job-owner/SHA validation.
          try {
              if ('$RECOVERY_MODE'==='signed_restore') {
                  drjrRecoveryCheck(__DIR__, '$BACKUP_REQUEST_B64', time());
              } elseif ('$RECOVERY_MODE'==='owner_cpanel_custody') {
                  drjrCpanelBackupCheck(__DIR__, '$EXPECTED_LIVE_SHA', time());
              } else {
                  throw new RuntimeException('release_policy_invalid');
              }
          } catch (Throwable \$e) {
              \$cleanup();
              http_response_code(503);
              echo json_encode(['ok'=>false,'error'=>'approved_recovery_policy_not_satisfied']);
              exit;
          }
          // Protect the already-live storefront: new source depends on the
          // additive Stage09 InnoDB tables AND pre-existing commerce-order columns.
          // This is READ ONLY. Do not mutate/reseed stocks or infer paid orders.
          // Check AFTER the selected owner-approved recovery policy,
          // and BEFORE extracting even one source file.
          try {
              \$cfg = require __DIR__ . '/api/config.local.php';
              if (!is_array(\$cfg)) throw new RuntimeException('private_config_missing');
              \$pdo = new PDO((string)(\$cfg['db_dsn'] ?? ''),
                  (string)(\$cfg['db_user'] ?? ''), (string)(\$cfg['db_password'] ?? ''), [
                      PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
                      PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
                      PDO::ATTR_EMULATE_PREPARES => false,
                  ]);
              \$columns = array_column(\$pdo->query('SHOW COLUMNS FROM commerce_orders')->fetchAll(), 'Field');
              foreach (['customer_email','customer_json','receipt_email_sent_at'] as \$column) {
                  if (!in_array(\$column, \$columns, true)) throw new RuntimeException('missing_commerce_column');
              }
              \$required = ['commerce_book_stock','commerce_book_reservations',
                  'commerce_stock_movements','commerce_payment_claims','commerce_outbox',
                  'commerce_service_cases','commerce_parcels','commerce_refund_requests'];
              foreach (\$required as \$table) {
                  // Fixed trusted table names; no request-controlled SQL identifiers.
                  \$pdo->query('SELECT 1 FROM ' . \$table . ' LIMIT 1');
              }
              // SELECT ... FOR UPDATE and stock/payment atomicity require InnoDB,
              // including the legacy orders table; table presence alone is insufficient.
              \$engines = [];
              foreach (\$pdo->query('SELECT TABLE_NAME,ENGINE FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE()')->fetchAll() as \$tableRow) {
                  \$engines[(string)(\$tableRow['TABLE_NAME']??'')] = (string)(\$tableRow['ENGINE']??'');
              }
              foreach (array_merge(['commerce_orders'],\$required) as \$tableName) {
                  if ((\$engines[\$tableName]??'')!=='InnoDB') throw new RuntimeException('non_transactional_commerce_table');
              }
              \$indexes = \$pdo->query('SHOW INDEX FROM commerce_payment_claims')->fetchAll();
              \$keys = [];
              foreach (\$indexes as \$index) {
                  \$key=(string)(\$index['Key_name']??'');
                  \$position=(int)(\$index['Seq_in_index']??0);
                  if (\$position>0 && (\$index['Non_unique']??1)==0) {
                      \$keys[\$key][\$position]=(string)(\$index['Column_name']??'');
                  }
              }
              foreach (\$keys as &\$cols) ksort(\$cols, SORT_NUMERIC);
              unset(\$cols);
              if (array_values(\$keys['PRIMARY']??[])!==['provider','transaction_id'] ||
                  array_values(\$keys['uq_payment_order']??[])!==['provider','order_id'])
                  throw new RuntimeException('payment_claim_unique_constraints_missing');
          } catch (Throwable \$e) {
              \$cleanup();
              http_response_code(503);
              echo json_encode(['ok'=>false,'error'=>'stage09_schema_preflight_required']);
              exit;
          }
          if (!class_exists('ZipArchive')) {
              http_response_code(500);
              echo json_encode(['ok'=>false,'error'=>'zip_extension_unavailable']);
              @unlink(__FILE__);
              exit;
          }
          \$zip = new ZipArchive();
          if (\$zip->open(\$zipPath) !== true) {
              http_response_code(500);
              echo json_encode(['ok'=>false,'error'=>'package_open_failed']);
              @unlink(__FILE__);
              exit;
          }
          for (\$i=0; \$i<\$zip->numFiles; \$i++) {
              \$name = (string)\$zip->getNameIndex(\$i);
              if (\$name === '' || (isset(\$name[0]) && \$name[0] === '/') || strpos(\$name, "\0") !== false ||
                  preg_match('#(^|/)\.\.(/|$)#', \$name)) {
                  \$zip->close();
                  http_response_code(400);
                  echo json_encode(['ok'=>false,'error'=>'unsafe_archive_path']);
                  \$cleanup();
                  exit;
              }
          }
          if (!\$zip->extractTo(__DIR__)) {
              \$zip->close();
              http_response_code(500);
              echo json_encode(['ok'=>false,'error'=>'extract_failed']);
              \$cleanup();
              exit;
          }
          \$zip->close();
          \$raw = @file_get_contents(\$manifestPath);
          \$manifest = is_string(\$raw) ? json_decode(\$raw, true) : null;
          if (!is_array(\$manifest) || !isset(\$manifest['files']) || !is_array(\$manifest['files'])) {
              http_response_code(500);
              echo json_encode(['ok'=>false,'error'=>'manifest_missing']);
              \$cleanup();
              exit;
          }
          \$mismatch = [];
          \$checked = 0;
          foreach (\$manifest['files'] as \$relative => \$expected) {
              \$relative = str_replace('\\\\', '/', (string)\$relative);
              if (\$relative === '' || (isset(\$relative[0]) && \$relative[0] === '/') || preg_match('#(^|/)\.\.(/|$)#', \$relative)) {
                  \$mismatch[] = \$relative;
                  continue;
              }
              \$target = __DIR__ . '/' . \$relative;
              \$actual = is_file(\$target) ? (string)@hash_file('sha256', \$target) : '';
              \$same = function_exists('hash_equals') ? hash_equals((string)\$expected, \$actual) : ((string)\$expected === \$actual);
              if (!is_file(\$target) || !\$same) {
                  \$mismatch[] = \$relative;
              }
              \$checked++;
          }
          foreach (['CNAME','_headers','_redirects','_config.yml'] as \$retired) {
              @unlink(__DIR__ . '/' . \$retired);
          }
          \$commit = isset(\$manifest['commit']) ? (string)\$manifest['commit'] : '';
          \$ok = count(\$mismatch) === 0 && \$commit === '$GITHUB_SHA';
          \$operations = ['ready'=>false];
          if (\$ok) {
              try {
                  \$private = require __DIR__ . '/api/config.local.php';
                  if (!is_array(\$private)) throw new RuntimeException('private_config_missing');
                  \$pdo = new PDO((string)(\$private['db_dsn']??''),(string)(\$private['db_user']??''),(string)(\$private['db_password']??''),[
                      PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC,PDO::ATTR_EMULATE_PREPARES=>false
                  ]);
                  define('BERTINA_API_BOOTSTRAPPED',true);
                  require_once __DIR__.'/api/operations.php';
                  require_once __DIR__.'/api/operations-schema.php';
                  operationsInstall(\$pdo);
                  \$batch=json_decode((string)file_get_contents(__DIR__.'/api/internal/operations-release.json'),true);
                  \$imported=operationsImportRelease(\$pdo,\$batch,'$GITHUB_SHA',\$private,'$GITHUB_RUN_ID');
                  \$operations=['ready'=>true,'imported'=>\$imported,'schema'=>'operations-v1'];
              } catch (Throwable \$e) {
                  \$ok=false;\$operations=['ready'=>false,'error'=>'operations_install_or_import_failed'];
              }
          }
          \$response = ['ok'=>\$ok,'commit'=>\$commit,'checked'=>\$checked,
              'mismatch'=>array_slice(\$mismatch,0,20),'operations'=>\$operations,
              'recoveryPolicy'=>[
                'mode'=>'$RECOVERY_MODE',
                'independentIsolatedRestoreCertified'=>('$RECOVERY_MODE'==='signed_restore')
              ]];
          \$cleanup();
          if (!\$ok) http_response_code(500);
          echo json_encode(\$response, JSON_UNESCAPED_SLASHES);
          PHP

          echo "188.40.203.218 server388.bertina.biz" | sudo tee -a /etc/hosts >/dev/null
          timeout 180s lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://server388.bertina.biz" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 1
          set net:timeout 20
          cd "$FTP_REMOTE_DIR"
          put /tmp/bertina-site.zip -o "$ZIP_NAME"
          put "/tmp/$SCRIPT_NAME" -o "$SCRIPT_NAME"
          bye
          LFTP

          {
            echo "token=$TOKEN"
            echo "zip_name=$ZIP_NAME"
            echo "script_name=$SCRIPT_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Extract and checksum every managed file on Bertina
        if: steps.credentials.outputs.ready == 'true'
        env:
          DEPLOY_TOKEN: ${{ steps.package.outputs.token }}
          DEPLOY_SCRIPT: ${{ steps.package.outputs.script_name }}
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/migration/bertina-linux6 | cut -f1)"
          test "$current" = "$GITHUB_SHA"
          ORIGIN_IP="188.40.203.218"
          HTTP_CODE="$(curl -sS --max-time 180 -o /tmp/deploy-response.json -w '%{http_code}'             --resolve drjavadrezazadeh.com:443:"$ORIGIN_IP"             -H "X-Deploy-Token: $DEPLOY_TOKEN"             "https://drjavadrezazadeh.com/$DEPLOY_SCRIPT")"
          echo "Bertina deploy endpoint HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Bertina deploy endpoint response:"
            cat /tmp/deploy-response.json || true
            echo
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/deploy-response.json','utf8'));
          if(d.ok!==true) throw new Error('Bertina extraction/checksum verification failed: '+JSON.stringify(d));
          if(d.commit!==process.env.GITHUB_SHA) throw new Error('Bertina commit mismatch');
          if(!Number.isInteger(d.checked) || d.checked < 500) throw new Error('Unexpected deployed file count: '+d.checked);
          console.log('Bertina server-side checksum verification PASS:',d.checked,'files; commit',d.commit);
          if(d.operations?.ready!==true) throw new Error('Operations schema and scoped evidence import failed');
          NODE

