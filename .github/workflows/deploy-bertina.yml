name: Deploy to Bertina

# Production deployment is intentionally manual until the owner authorizes one final release.
on:
  workflow_dispatch:
    inputs:
      release_scope:
        description: "full_masterplan requires all acceptance; phased_live_audit is owner-approved current snapshot with PDF and SQL deferred"
        required: true
        type: choice
        default: phased_live_audit
        options:
          - full_masterplan
          - phased_live_audit
      recovery_mode:
        description: "One-click default: owner-accepted hosting-managed backups (no archive inspection); cPanel custody optional"
        required: true
        type: choice
        default: hosting_managed
        options:
          - hosting_managed
          - signed_restore
          - owner_cpanel_custody
      approved_commit_sha:
        description: "Optional: auto-detected GitHub HEAD (leave empty)"
        required: false
        type: string
      expected_live_sha:
        description: "Optional: auto-detected live /sw.js (leave empty)"
        required: false
        type: string
      owner_acknowledgement:
        description: "Owner accepts cPanel custody, not an isolated restore test (one-click preset)"
        required: false
        type: string
        default: ACCEPT_UNTESTED_RESTORE_RISK_V5
      owner_masterplan_final_confirmation:
        description: "Owner phased approval preset; full masterplan needs separate approval"
        required: true
        type: string
        default: I_APPROVE_GUARDED_LIVE_AUDIT_RELEASE_WITH_PDF_AND_SQL_DEFERRED

permissions:
  contents: read

concurrency:
  group: bertina-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'drrezazadeh65' && github.ref == 'refs/heads/migration/bertina-linux6'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-password
          MYSQL_DATABASE: operations_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-password"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Full-acceptance and guarded-phase paths are mutually exclusive.
      # Both require the owner actor, exact SHA, and existing production safety checks.
      # The phased path does not certify any of the 41/21 acceptance records.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject missing or unrecognized release scopes before all gates
        env:
          RELEASE_SCOPE_INPUT: ${{ inputs.release_scope }}
        run: |
          set -euo pipefail
          case "$RELEASE_SCOPE_INPUT" in
            full_masterplan|phased_live_audit) ;;
            *) echo "Unrecognized release scope; production remains blocked." >&2; exit 1 ;;
          esac

      # Resolve both SHA values independently. The owner only needs to click Run workflow.
      # Any optional manual overrides must match the observed immutable values.
      - name: Resolve exact source and live SHA for owner one-click release
        if: github.event_name == 'workflow_dispatch'
        id: owner_release
        env:
          REQUESTED_TARGET_SHA: ${{ inputs.approved_commit_sha }}
          REQUESTED_LIVE_SHA: ${{ inputs.expected_live_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = drrezazadeh65
          test "$GITHUB_REF" = refs/heads/migration/bertina-linux6
          current="$(git ls-remote origin refs/heads/migration/bertina-linux6 | cut -f1)"
          test "$current" = "$GITHUB_SHA" || { echo "Branch advanced; start a fresh run." >&2; exit 1; }
          curl --fail --silent --show-error --location --max-time 25 --retry 2 --header 'Cache-Control: no-cache' 'https://drjavadrezazadeh.com/sw.js' -o /tmp/owner-live-sw.js
          live_sha="$(sed -n "s/^const CACHE_VERSION='jr-site-bertina-\\([a-f0-9]\\{40\\}\\)';$/\\1/p" /tmp/owner-live-sw.js)"
          [[ "$live_sha" =~ ^[a-f0-9]{40}$ ]] || { echo "Live release SHA unavailable; fail closed." >&2; exit 1; }
          test "$live_sha" != "$GITHUB_SHA" || { echo "Exact commit already live; no new deployment needed." >&2; exit 1; }
          if [ -n "$REQUESTED_TARGET_SHA" ]; then test "$REQUESTED_TARGET_SHA" = "$GITHUB_SHA"; fi
          if [ -n "$REQUESTED_LIVE_SHA" ]; then test "$REQUESTED_LIVE_SHA" = "$live_sha"; fi
          echo "target_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "live_sha=$live_sha" >> "$GITHUB_OUTPUT"
          echo "Verified target: $GITHUB_SHA; current live: $live_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: BLOCK PRODUCTION until full 100 percent masterplan acceptance
        if: inputs.release_scope == 'full_masterplan'
        env:
          OWNER_FINAL_MASTERPLAN_CONFIRMATION: ${{ inputs.owner_masterplan_final_confirmation }}
        run: |
          set -euo pipefail
          node --check scripts/masterplan-100-release-gate.mjs
          node --test tests/masterplan-100-release-gate.test.mjs
          node scripts/masterplan-100-release-gate.mjs

      - name: BLOCK unsafe guarded phased release unless owner authorizes exact scope
        if: inputs.release_scope == 'phased_live_audit'
        env:
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          APPROVED_COMMIT_SHA_INPUT: ${{ steps.owner_release.outputs.target_sha }}
          EXPECTED_LIVE_SHA_INPUT: ${{ steps.owner_release.outputs.live_sha }}
          RECOVERY_MODE_INPUT: ${{ inputs.recovery_mode }}
          OWNER_ACKNOWLEDGEMENT_INPUT: ${{ inputs.owner_acknowledgement }}
          OWNER_PHASED_RELEASE_CONFIRMATION: ${{ inputs.owner_masterplan_final_confirmation }}
        run: |
          set -euo pipefail
          node --check scripts/bertina-phased-release-gate.mjs
          node --test tests/bertina-phased-release-gate.test.mjs
          node scripts/bertina-phased-release-gate.mjs
          echo "Guarded current-snapshot mode. PDF installation, SQL migrations, payouts, full 41/21 certification remain deferred." >> "$GITHUB_STEP_SUMMARY"

      - name: Capture the live release fingerprint for automatic deployment
        if: github.event_name == 'push'
        id: live_release
        run: |
          set -euo pipefail
          curl -fsSL --max-time 25 https://drjavadrezazadeh.com/sw.js -o /tmp/live-sw.js
          live_sha="$(sed -n "s/^const CACHE_VERSION='jr-site-bertina-\\([a-f0-9]\\{40\\}\\)';$/\\1/p" /tmp/live-sw.js)"
          [[ "$live_sha" =~ ^[a-f0-9]{40}$ ]]
          test "$live_sha" != "$GITHUB_SHA"
          echo "sha=$live_sha" >> "$GITHUB_OUTPUT"

      - name: Authorize the exact recovery policy before any deploy activity
        id: release_policy
        env:
          RECOVERY_MODE_INPUT: ${{ inputs.recovery_mode }}
          APPROVED_COMMIT_SHA_INPUT: ${{ steps.owner_release.outputs.target_sha }}
          EXPECTED_LIVE_SHA_INPUT: ${{ steps.owner_release.outputs.live_sha }}
          OWNER_ACKNOWLEDGEMENT_INPUT: ${{ inputs.owner_acknowledgement }}
          LIVE_RELEASE_SHA: ${{ steps.live_release.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [[ "$LIVE_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            test "$LIVE_RELEASE_SHA" != "$GITHUB_SHA"
            echo "mode=hosting_managed" >> "$GITHUB_OUTPUT"
            echo "expected_live_sha=$LIVE_RELEASE_SHA" >> "$GITHUB_OUTPUT"
            echo "Owner FULL development mode: hosting-managed backup responsibility; no backup inspection, creation, retention or deletion by this deployment." >> "$GITHUB_STEP_SUMMARY"
          else
            mode="${RECOVERY_MODE_INPUT:-hosting_managed}"
            case "$mode" in
              signed_restore) echo "mode=signed_restore" >> "$GITHUB_OUTPUT" ;;
              hosting_managed|owner_cpanel_custody)
                test "$GITHUB_EVENT_NAME" = workflow_dispatch
                test "$GITHUB_ACTOR" = drrezazadeh65
                test "$APPROVED_COMMIT_SHA_INPUT" = "$GITHUB_SHA"
                if [ "$mode" = owner_cpanel_custody ]; then
                  test "$OWNER_ACKNOWLEDGEMENT_INPUT" = ACCEPT_UNTESTED_RESTORE_RISK_V5
                fi
                [[ "$EXPECTED_LIVE_SHA_INPUT" =~ ^[a-f0-9]{40}$ ]]
                test "$EXPECTED_LIVE_SHA_INPUT" != "$GITHUB_SHA"
                echo "mode=$mode" >> "$GITHUB_OUTPUT"
                echo "expected_live_sha=$EXPECTED_LIVE_SHA_INPUT" >> "$GITHUB_OUTPUT"
                echo "Chosen release mode: $mode; exact source and live SHA guarded. No backup recoverability or independent restore claimed." >> "$GITHUB_STEP_SUMMARY"
                ;;
              *) echo "Invalid recovery mode" >&2; exit 1 ;;
            esac
          fi



      - name: Verify automatic release policy and full-scope decision tests
        if: github.event_name == 'push'
        run: |
          node --check scripts/bertina-auto-release-policy.mjs
          node --check scripts/bertina-release-eligibility.mjs
          node --test tests/bertina-auto-release-policy.test.mjs tests/bertina-release-eligibility.test.mjs

      - name: Validate full source delta before automatic production preflight
        if: github.event_name == 'push'
        env:
          EXPECTED_LIVE_SHA: ${{ steps.release_policy.outputs.expected_live_sha }}
          # 2026-10-14 owner direction: FULL development code release scope.
          # CI, exact live-SHA, schema compatibility and security gates remain.
          # SQL migrations, credentials and real money operations are separate.
          BERTINA_AUTO_DEPLOY_SCOPE: full
        run: |
          set -euo pipefail
          node scripts/bertina-release-eligibility.mjs "$EXPECTED_LIVE_SHA" "$GITHUB_SHA"

      - name: Validate host-managed live SHA gate and assembled PHP release
        run: |
          php -l scripts/bertina-hosting-managed-release.php
          php tests/bertina-hosting-managed-release.php
          python3 tests/bertina-release-assembly.py

      - name: Verify v5.1.0 first-usable customer journey contract (source only)
        run: |
          node scripts/customer-dashboard-audit.mjs
          node scripts/v5-1-usable-release-audit.mjs
          node --check assets/js/consented-lead-intake.js
          node --check assets/js/institutional-brief-builder.mjs
          node --test tests/institutional-conversion.test.mjs
          node --test tests/stage14-growth-privacy.test.mjs tests/revenue-planner-model.test.mjs
          node scripts/stage14-organic-growth-audit.mjs
          node scripts/revenue-planner-contract-audit.mjs

      - name: Verify operations registry, security and real MySQL
        env:
          OPERATIONS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=operations_fixture;charset=utf8mb4
          OPERATIONS_TEST_USER: root
          OPERATIONS_TEST_PASSWORD: fixture-password
        run: |
          node scripts/operations-registry-audit.mjs
          python3 scripts/operations-canonical-registry.py api/internal/operations-registry.json --validate-only --identity-manifest api/internal/operations-action-identities-v1.json
          python3 tests/operations-canonical-registry.py
          php tests/operations-reporting.php
          for file in api/*.php; do php -l "$file"; done
          php tests/bertina-smtp-body-contract.php
          php tests/bertina-service-buyer-contact.php
          node --check assets/js/commerce-checkout.js
          node tests/bertina-service-contact-checkout.mjs
          # Golden Talent / RCAS / BAHAR: synthetic evidence only, no real learners.
          node --check platform/bahar-engine.mjs
          node --check platform/bahar-persistence.mjs
          node --check assets/js/bahar-readiness.js
          node platform/bahar-engine.test.mjs
          node platform/rcas-evidence-bridge.test.mjs
          node platform/ecosystem-journey-orchestrator.test.mjs
          node platform/module-governance.test.mjs
          node platform/bahar-persistence.test.mjs
          node platform/golden-talent-book-crosswalk.test.mjs
          php tests/golden-talent-guardian.php
          php tests/bahar-bertina-schema.php
          php tests/bahar-guardian-mysql.php
          node --check assets/js/bahar-guardian-overview.js
          php tests/operations-security.php
          php tests/jrei-python-optional-load.php
          php tests/operations-mysql.php
          php tests/commerce-service-advance-mysql.php
          php tests/consultation-preference-mysql.php
          node --check assets/js/operations-social.js
          node --check assets/js/operations-social-composer.js
          node --test platform/social-distribution/*.test.mjs
          # Only isolated CI MySQL 8. Never connect to the live Bertina database.
          php -r '$pdo=new PDO("mysql:host=127.0.0.1;port=3306;dbname=operations_fixture;charset=utf8mb4","root","fixture-password"); $pdo->exec("CREATE DATABASE IF NOT EXISTS social_fixture CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          SOCIAL_TEST_DSN='mysql:host=127.0.0.1;port=3306;dbname=social_fixture;charset=utf8mb4' SOCIAL_TEST_USER=root SOCIAL_TEST_PASSWORD=fixture-password php tests/social-queue-mysql.php
          php tests/bertina-receipt-access.php
          php tests/bertina-receipt-contract.php
          php tests/bertina-commerce-callback-contract.php
          php tests/bertina-commerce-mysql-contract.php
          php tests/bertina-donations-mysql-contract.php
          php tests/bertina-student-support-contract.php
          php -l scripts/journal-ojs-preflight.php
          php -l tests/journal-ojs-preflight.php
          php tests/journal-ojs-preflight.php

      - name: Verify operations browser behavior before release
        run: |
          npm install --no-save @playwright/test@1.56.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/operations-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/customer-dashboard-browser.spec.js tests/operations-browser.spec.js tests/operations-reporting-browser.spec.js tests/bookstore-checkout-browser.spec.js tests/service-request-summary.spec.js tests/institutional-conversion.spec.js tests/rcas-start-browser.spec.js tests/bahar-readiness-browser.spec.js tests/bahar-guardian-browser.spec.js tests/public-mobile-navigation.spec.js --reporter=line,html

      - name: Retain Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-diagnostics-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            /tmp/operations-http.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Independently certify apex and www TLS
        run: node scripts/operations-tls-certify.mjs /tmp/operations-tls.json

      - name: Retain independent certificate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-tls-${{ github.sha }}
          path: /tmp/operations-tls.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Build and verify sanitized public site
        run: |
          set -euo pipefail
          node scripts/build-public-data.mjs --check
          node scripts/build-public-site.mjs
          node scripts/bookstore-release-audit.mjs
          node scripts/public-retired-commerce-audit.mjs
          node scripts/stamp-bertina-release.mjs
          test -f .public-site/.htaccess
          test ! -e .public-site/platform
          test ! -e .public-site/foundation
          test ! -e .public-site/scripts
          test ! -e .public-site/tests
          test ! -e .public-site/edge
          test ! -e .public-site/payment-api
          test ! -e .public-site/docs
          test ! -e .public-site/.github
          # OJS is managed independently in Bertina, never shipped with the
          # main site's sanitized public release or its static /journal/ hub.
          test ! -e .public-site/journals
          test ! -e .public-site/journal/portal

      - name: Check Bertina repository secrets
        id: credentials
        env:
          FTP_USER: ${{ secrets.BERTINA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BERTINA_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.BERTINA_FTP_REMOTE_DIR }}
        run: |
          if [ -n "$FTP_USER" ] && [ -n "$FTP_PASSWORD" ] && [ -n "$FTP_REMOTE_DIR" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Bertina deployment credentials are configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Bertina deployment blocked: repository secrets are not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Package exact public release
        if: steps.credentials.outputs.ready == 'true'
        run: |
          set -euo pipefail
          OPERATIONS_TESTS_PASSED=true node scripts/operations-release-evidence.mjs
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root=pathlib.Path('.public-site')
          files={}
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel=p.relative_to(root).as_posix()
              files[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={'commit':os.environ['GITHUB_SHA'],'fileCount':len(files),'files':files}
          (root/'bertina-deploy-manifest.json').write_text(json.dumps(manifest,separators=(',',':')),encoding='utf-8')
          with zipfile.ZipFile('/tmp/bertina-site.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  z.write(p,p.relative_to(root).as_posix())
          (root/'bertina-deploy-manifest.json').unlink()
          print(f"Packaged {len(files)} managed files.")
          PY

      - name: Install secure FTP client
        if: steps.credentials.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Reject a stale production commit before uploading
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/migration/bertina-linux6 | cut -f1)"
          test "$current" = "$GITHUB_SHA"

      - name: Upload one release package over explicit TLS
        if: steps.credentials.outputs.ready == 'true'
        id: package
        env:
          FTP_USER: ${{ secrets.BERTINA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BERTINA_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.BERTINA_FTP_REMOTE_DIR }}
          RECOVERY_MODE: ${{ steps.release_policy.outputs.mode }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          EXPECTED_LIVE_SHA: ${{ steps.release_policy.outputs.expected_live_sha }}
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          TOKEN_HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          NONCE="$(openssl rand -hex 10)"
          ZIP_NAME="bertina-release-$NONCE.zip"
          SCRIPT_NAME="bertina-deploy-$NONCE.php"
          HOSTING_GATE_SOURCE="$(tail -n +2 scripts/bertina-hosting-managed-release.php)"
          RECOVERY_GATE_SOURCE="$(tail -n +2 scripts/bertina-private-recovery-gate.php)"
          CONTROLLED_GATE_SOURCE="$(tail -n +2 scripts/bertina-controlled-cpanel-gate.php)"
          test -n "$HOSTING_GATE_SOURCE"
          BACKUP_REQUEST_B64=''
          [[ "$RECOVERY_MODE" = hosting_managed || "$RECOVERY_MODE" = signed_restore || "$RECOVERY_MODE" = owner_cpanel_custody ]]
          if [ "$RECOVERY_MODE" = signed_restore ]; then
            BACKUP_REQUEST_B64="$(base64 -w0 .bertina-backup-trigger)"
            test -n "$BACKUP_REQUEST_B64"
          else
            [[ "$EXPECTED_LIVE_SHA" =~ ^[a-f0-9]{40}$ ]]
          fi

          cat > "/tmp/$SCRIPT_NAME" <<PHP
          <?php
          // Hosting-managed option checks only live release SHA, never backups.
          // Historical recovery helpers remain opt-in and do not run by default.
          $HOSTING_GATE_SOURCE
          $RECOVERY_GATE_SOURCE
          $CONTROLLED_GATE_SOURCE
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          header('X-Robots-Tag: noindex, noarchive');
          \$expectedHash = '$TOKEN_HASH';
          \$provided = isset(\$_SERVER['HTTP_X_DEPLOY_TOKEN']) ? (string) \$_SERVER['HTTP_X_DEPLOY_TOKEN'] : '';
          \$providedHash = hash('sha256', \$provided);
          \$tokenOk = function_exists('hash_equals') ? hash_equals(\$expectedHash, \$providedHash) : (\$expectedHash === \$providedHash);
          if (!\$tokenOk) {
              http_response_code(403);
              echo json_encode(['ok'=>false,'error'=>'forbidden']);
              exit;
          }
          ignore_user_abort(true);
          \$deployLock = @fopen(sys_get_temp_dir() . '/drjr-bertina-deploy-' . hash('sha256', __DIR__) . '.lock', 'c');
          if (!\$deployLock || !flock(\$deployLock, LOCK_EX | LOCK_NB)) {
              @unlink(__DIR__ . '/$ZIP_NAME');
              @unlink(__FILE__);
              http_response_code(409);
              echo json_encode(['ok'=>false,'error'=>'deployment_in_progress']);
              exit;
          }
          \$zipPath = __DIR__ . '/$ZIP_NAME';
          \$manifestPath = __DIR__ . '/bertina-deploy-manifest.json';
          \$cleanup = function() use (\$zipPath, \$manifestPath) {
              @unlink(\$zipPath);
              @unlink(\$manifestPath);
              @unlink(__FILE__);
          };
          // Validate selected deployment mode BEFORE extracting any files.
          // hosting_managed does not access, inspect or require backup files.
          try {
              if ('$RECOVERY_MODE'==='hosting_managed') {
                  drjrHostingManagedReleaseCheck(__DIR__, '$EXPECTED_LIVE_SHA');
              } elseif ('$RECOVERY_MODE'==='signed_restore') {
                  drjrRecoveryCheck(__DIR__, '$BACKUP_REQUEST_B64', time());
              } elseif ('$RECOVERY_MODE'==='owner_cpanel_custody') {
                  drjrCpanelBackupCheck(__DIR__, '$EXPECTED_LIVE_SHA', time());
              } else {
                  throw new RuntimeException('release_policy_invalid');
              }
          } catch (Throwable \$e) {
              // Only fixed reason codes are returned after deploy-token verification.
              \$reason=(string)\$e->getMessage();
              \$reasonCode=preg_match('/^(?:cpanel_|hosting_release_)[a-z0-9_]{1,80}$/D',\$reason) ? \$reason : 'recovery_check_unavailable';
              \$cleanup();
              http_response_code(503);
              echo json_encode(['ok'=>false,'error'=>'release_policy_preflight_failed','reason'=>\$reasonCode]);
              exit;
          }
          // Read-only database compatibility check; never backfill or migrate.
          try {
              \$cfg = require __DIR__ . '/api/config.local.php';
              if (!is_array(\$cfg)) throw new RuntimeException('private_config_missing');
              \$pdo = new PDO((string)(\$cfg['db_dsn'] ?? ''),
                  (string)(\$cfg['db_user'] ?? ''), (string)(\$cfg['db_password'] ?? ''), [
                      PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
                      PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
                      PDO::ATTR_EMULATE_PREPARES => false,
                  ]);
              \$columns = array_column(\$pdo->query('SHOW COLUMNS FROM commerce_orders')->fetchAll(), 'Field');
              foreach (['customer_email','customer_json','receipt_email_sent_at'] as \$column) {
                  if (!in_array(\$column, \$columns, true)) throw new RuntimeException('missing_commerce_column');
              }
              \$required = ['commerce_book_stock','commerce_book_reservations',
                  'commerce_stock_movements','commerce_payment_claims','commerce_outbox',
                  'commerce_service_cases','commerce_parcels','commerce_refund_requests'];
              foreach (\$required as \$table) {
                  // Fixed trusted table names; no request-controlled SQL identifiers.
                  \$pdo->query('SELECT 1 FROM ' . \$table . ' LIMIT 1');
              }
              // Phase-1 cannot install any new tables. Verify all existing
              // operations dependencies BEFORE archive extraction begins.
              if ('$RELEASE_SCOPE'==='phased_live_audit') {
                foreach (['operations_admin_memberships','operations_session_mfa',
                  'operations_mfa_counters','operations_evidence','operations_audit',
                  'operations_release','operations_action_runs',
                  'operations_collection_policies','operations_collection_cache'] as \$opsTable) {
                    \$pdo->query('SELECT 1 FROM ' . \$opsTable . ' LIMIT 0');
                }
              }
              // SELECT ... FOR UPDATE and stock/payment atomicity require InnoDB,
              // including the legacy orders table; table presence alone is insufficient.
              \$engines = [];
              foreach (\$pdo->query('SELECT TABLE_NAME,ENGINE FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE()')->fetchAll() as \$tableRow) {
                  \$engines[(string)(\$tableRow['TABLE_NAME']??'')] = (string)(\$tableRow['ENGINE']??'');
              }
              foreach (array_merge(['commerce_orders'],\$required) as \$tableName) {
                  if ((\$engines[\$tableName]??'')!=='InnoDB') throw new RuntimeException('non_transactional_commerce_table');
              }
              \$indexes = \$pdo->query('SHOW INDEX FROM commerce_payment_claims')->fetchAll();
              \$keys = [];
              foreach (\$indexes as \$index) {
                  \$key=(string)(\$index['Key_name']??'');
                  \$position=(int)(\$index['Seq_in_index']??0);
                  if (\$position>0 && (\$index['Non_unique']??1)==0) {
                      \$keys[\$key][\$position]=(string)(\$index['Column_name']??'');
                  }
              }
              foreach (\$keys as &\$cols) ksort(\$cols, SORT_NUMERIC);
              unset(\$cols);
              if (array_values(\$keys['PRIMARY']??[])!==['provider','transaction_id'] ||
                  array_values(\$keys['uq_payment_order']??[])!==['provider','order_id'])
                  throw new RuntimeException('payment_claim_unique_constraints_missing');
          } catch (Throwable \$e) {
              \$reason=(string)\$e->getMessage();
              \$known=['private_config_missing','missing_commerce_column',
                'non_transactional_commerce_table','payment_claim_unique_constraints_missing'];
              \$reasonCode=in_array(\$reason,\$known,true) ? \$reason : 'schema_or_db_access';
              \$cleanup();
              http_response_code(503);
              echo json_encode(['ok'=>false,'error'=>'stage09_schema_preflight_required','reason'=>\$reasonCode]);
              exit;
          }
          if (!class_exists('ZipArchive')) {
              http_response_code(500);
              echo json_encode(['ok'=>false,'error'=>'zip_extension_unavailable']);
              @unlink(__FILE__);
              exit;
          }
          \$zip = new ZipArchive();
          if (\$zip->open(\$zipPath) !== true) {
              http_response_code(500);
              echo json_encode(['ok'=>false,'error'=>'package_open_failed']);
              @unlink(__FILE__);
              exit;
          }
          for (\$i=0; \$i<\$zip->numFiles; \$i++) {
              \$name = (string)\$zip->getNameIndex(\$i);
              if (\$name === '' || (isset(\$name[0]) && \$name[0] === '/') || strpos(\$name, "\0") !== false ||
                  preg_match('#(^|/)\.\.(/|$)#', \$name)) {
                  \$zip->close();
                  http_response_code(400);
                  echo json_encode(['ok'=>false,'error'=>'unsafe_archive_path']);
                  \$cleanup();
                  exit;
              }
          }
          if (!\$zip->extractTo(__DIR__)) {
              \$zip->close();
              http_response_code(500);
              echo json_encode(['ok'=>false,'error'=>'extract_failed']);
              \$cleanup();
              exit;
          }
          \$zip->close();
          \$raw = @file_get_contents(\$manifestPath);
          \$manifest = is_string(\$raw) ? json_decode(\$raw, true) : null;
          if (!is_array(\$manifest) || !isset(\$manifest['files']) || !is_array(\$manifest['files'])) {
              http_response_code(500);
              echo json_encode(['ok'=>false,'error'=>'manifest_missing']);
              \$cleanup();
              exit;
          }
          \$mismatch = [];
          \$checked = 0;
          foreach (\$manifest['files'] as \$relative => \$expected) {
              \$relative = str_replace('\\\\', '/', (string)\$relative);
              if (\$relative === '' || (isset(\$relative[0]) && \$relative[0] === '/') || preg_match('#(^|/)\.\.(/|$)#', \$relative)) {
                  \$mismatch[] = \$relative;
                  continue;
              }
              \$target = __DIR__ . '/' . \$relative;
              \$actual = is_file(\$target) ? (string)@hash_file('sha256', \$target) : '';
              \$same = function_exists('hash_equals') ? hash_equals((string)\$expected, \$actual) : ((string)\$expected === \$actual);
              if (!is_file(\$target) || !\$same) {
                  \$mismatch[] = \$relative;
              }
              \$checked++;
          }
          foreach (['CNAME','_headers','_redirects','_config.yml'] as \$retired) {
              @unlink(__DIR__ . '/' . \$retired);
          }
          \$commit = isset(\$manifest['commit']) ? (string)\$manifest['commit'] : '';
          \$ok = count(\$mismatch) === 0 && \$commit === '$GITHUB_SHA';
          \$operations = ['ready'=>false];
          if (\$ok) {
              try {
                  \$private = require __DIR__ . '/api/config.local.php';
                  if (!is_array(\$private)) throw new RuntimeException('private_config_missing');
                  \$pdo = new PDO((string)(\$private['db_dsn']??''),(string)(\$private['db_user']??''),(string)(\$private['db_password']??''),[
                      PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC,PDO::ATTR_EMULATE_PREPARES=>false
                  ]);
                  define('BERTINA_API_BOOTSTRAPPED',true);
                  require_once __DIR__.'/api/operations.php';
                  require_once __DIR__.'/api/operations-schema.php';
                  if ('$RELEASE_SCOPE'!=='phased_live_audit') operationsInstall(\$pdo);
                  \$batch=json_decode((string)file_get_contents(__DIR__.'/api/internal/operations-release.json'),true);
                  \$imported=operationsImportRelease(\$pdo,\$batch,'$GITHUB_SHA',\$private,'$GITHUB_RUN_ID');
                  \$operations=['ready'=>true,'imported'=>\$imported,'schema'=>'operations-v1'];
              } catch (Throwable \$e) {
                  \$ok=false;\$operations=['ready'=>false,'error'=>'operations_install_or_import_failed'];
              }
          }
          \$response = ['ok'=>\$ok,'commit'=>\$commit,'checked'=>\$checked,
              'mismatch'=>array_slice(\$mismatch,0,20),'operations'=>\$operations,
              'recoveryPolicy'=>[
                'mode'=>'$RECOVERY_MODE',
                'independentIsolatedRestoreCertified'=>false,
                'backupVerifiedByRelease'=>false
              ]];
          \$cleanup();
          if (!\$ok) http_response_code(500);
          echo json_encode(\$response, JSON_UNESCAPED_SLASHES);
          PHP

          echo "188.40.203.218 server388.bertina.biz" | sudo tee -a /etc/hosts >/dev/null
          timeout 180s lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://server388.bertina.biz" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 1
          set net:timeout 20
          cd "$FTP_REMOTE_DIR"
          put /tmp/bertina-site.zip -o "$ZIP_NAME"
          put "/tmp/$SCRIPT_NAME" -o "$SCRIPT_NAME"
          bye
