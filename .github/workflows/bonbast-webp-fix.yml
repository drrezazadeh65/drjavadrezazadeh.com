name: One-time Bonbast WebP Fix
on:
  push:
    paths:
      - ".github/workflows/bonbast-webp-fix.yml"
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image runtime
        run: python -m pip install --disable-pip-version-check pillow pillow-avif-plugin
      - name: Convert Bonbast AVIF to WebP
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pillow_avif
          from PIL import Image

          src="assets/images/books/bonbast-javad-rezazadeh-yazdeli-book-cover-2026.avif"
          out="assets/images/books/bonbast-javad-rezazadeh-yazdeli-book-cover-2026.webp"

          with Image.open(src) as im:
              im.save(out, "WEBP", quality=95, method=6)

          with Image.open(out) as check:
              check.verify()

          p="platform/book-catalog.json"
          with open(p, encoding="utf-8") as f:
              d=json.load(f)
          for b in d["books"]:
              if b["id"]=="bonbast":
                  b["bibliography"]["cover_image"]="/assets/images/books/bonbast-javad-rezazadeh-yazdeli-book-cover-2026.webp"
          with open(p,"w",encoding="utf-8") as f:
              json.dump(d,f,ensure_ascii=False,indent=2)
              f.write("\n")
          PY
      - name: Commit WebP fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/books/bonbast-javad-rezazadeh-yazdeli-book-cover-2026.webp platform/book-catalog.json
          git commit -m "Use WebP fallback for Bonbast cover"
          git push
