name: Bertina isolated restore readiness

on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - 'scripts/bertina-private-backup-restore.py'
      - 'scripts/bertina-private-recovery-gate.php'
      - 'tests/bertina-private-recovery-gate.php'
      - 'tests/bertina-release-assembly.py'
      - '.github/workflows/deploy-bertina.yml'
      - 'scripts/bertina-controlled-cpanel-gate.php'
      - 'tests/bertina-controlled-cpanel-gate.php'
      - 'tests/test_private_backup_restore_readiness.py'
      - '.github/workflows/bertina-restore-readiness-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-database-pid1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record exact reviewed recovery-tool SHA256
        run: sha256sum scripts/bertina-private-backup-restore.py scripts/bertina-private-recovery-gate.php
      - name: Compile isolated-restore source and test
        run: python3 -m py_compile scripts/bertina-private-backup-restore.py tests/test_private_backup_restore_readiness.py
      - name: Verify temporary MariaDB bootstrap is rejected
        run: python3 tests/test_private_backup_restore_readiness.py
      - name: Verify RSA-pinned pre-extraction recovery gate
        run: |
          php -l scripts/bertina-private-recovery-gate.php
          php -l tests/bertina-private-recovery-gate.php
          php tests/bertina-private-recovery-gate.php
      - name: Require gate ahead of archive extraction in the release pipeline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/deploy-bertina.yml').read_text()
          assert "drjrRecoveryCheck(__DIR__" in wf
          assert "$RECOVERY_GATE_SOURCE" in wf
          assert wf.index("drjrRecoveryCheck(__DIR__") < wf.index("if (!\\$zip->extractTo(__DIR__))")
          assert "approved_recovery_policy_not_satisfied" in wf
          assert "drjrCpanelBackupCheck(__DIR__" in wf
          assert wf.index("drjrCpanelBackupCheck(__DIR__") < wf.index("if (!\\$zip->extractTo(__DIR__))")
          assert "if ('$RECOVERY_MODE'==='signed_restore')" in wf
          assert "elseif ('$RECOVERY_MODE'==='owner_cpanel_custody')" in wf
          assert "ACCEPT_UNTESTED_RESTORE_RISK_V5" in wf
          print("PASS: signed RSA default and explicit owner cPanel exception BOTH precede production extraction")
          PY
      - name: Compile actual interpolated release endpoint without deploying
        run: |
          php -l scripts/bertina-controlled-cpanel-gate.php
          php tests/bertina-controlled-cpanel-gate.php
          python3 tests/bertina-release-assembly.py
