name: Bertina isolated restore readiness

on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - 'scripts/bertina-private-backup-restore.py'
      - 'tests/test_private_backup_restore_readiness.py'
      - '.github/workflows/bertina-restore-readiness-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-database-pid1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated-restore source and test
        run: python3 -m py_compile scripts/bertina-private-backup-restore.py tests/test_private_backup_restore_readiness.py
      - name: Verify temporary MariaDB bootstrap is rejected
        run: python3 tests/test_private_backup_restore_readiness.py
