permissions:
  contents: read

jobs:
  public-science:
    name: Active BAHAR and RCAS, design identity and zero-regression public artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify educational worksheet cannot persist or transmit input
        run: |
          node --check assets/js/bahar-formative-workspace-v1.js
          node --test tests/scientific-continuity-contract.test.mjs
          node --check assets/js/jr-konkur-foundation-v1.js
          node --test tests/jr-konkur-foundation.test.mjs
          node --check platform/educational-intelligence-v3.mjs
          node --test tests/educational-intelligence-v3.test.mjs
          node --check platform/educational-intelligence-catalogue-adapter-v3.mjs
          node --test tests/educational-intelligence-catalogue-adapter-v3.test.mjs
          node --check platform/educational-intelligence-public-tool-v3.mjs
          node --test tests/educational-intelligence-public-tool-v3.test.mjs
          node --check platform/educational-intelligence-public-search-guard-v3.mjs
          node --test tests/educational-intelligence-public-search-guard-v3.test.mjs
          node --check platform/educational-intelligence-public-exchange-v3.mjs
          node --test tests/educational-intelligence-public-exchange-v3.test.mjs
          node --check platform/educational-intelligence-evidence-answer-v3.mjs
          node --test tests/educational-intelligence-evidence-answer-v3.test.mjs
          php -l api/konkur-public-search-guard.php
          php -l api/konkur-admission.php
          php -l tests/konkur-public-search-guard.php
          php tests/konkur-public-search-guard.php
          node --test tests/konkur-official-scorecard.test.mjs
          node --test tests/konkur-official-scorecard-contract.test.mjs
          node --test tests/konkur-1405-intake.test.mjs
          node --check scripts/konkur-1405-review-queue.mjs
          node --test tests/konkur-1405-review-queue.test.mjs
          node scripts/konkur-1405-review-queue.mjs --check
          node --check scripts/konkur-product-readiness.mjs
          node --test tests/konkur-product-readiness.test.mjs
          node scripts/konkur-product-readiness.mjs
          node --test tests/konkur-mother-schema-contract.test.mjs
          node --test tests/konkur-scorecard-adapters-contract.test.mjs
          node --test tests/konkur-studio-contract.test.mjs
          node --check assets/js/jr-konkur-choice-portability-v1.js
          node --test tests/konkur-choice-portability.test.mjs
          node --test tests/konkur-mock-practice-contract.test.mjs
          node --check assets/js/jr-konkur-study-review-v1.js
          node --test tests/konkur-study-review.test.mjs
          node --check assets/js/jr-konkur-mock-export-v1.js
          node --test tests/konkur-mock-export.test.mjs
          node --check scripts/konkur-003f-proposal-audit.mjs
          node --test tests/konkur-003f-proposal-audit.test.mjs
          node scripts/konkur-003f-proposal-audit.mjs --check
          node --test tests/konkur-mock-provider-registry.test.mjs
          node --test tests/konkur-catalogue-client-contract.test.mjs
          node --check assets/js/golden-talent-evidence-studio-v1.js
          node --check scripts/build-public-site.mjs
          node -e "const fs=require('fs');const s=fs.readFileSync('assets/js/bahar-formative-workspace-v1.js','utf8');for(const x of ['localStorage','sessionStorage','fetch(','XMLHttpRequest(','WebSocket(']){if(s.includes(x))throw Error('BAHAR must not retain/upload: '+x)}"
          node -e "const fs=require('fs');const s=fs.readFileSync('assets/js/golden-talent-evidence-studio-v1.js','utf8');for(const x of ['localStorage','sessionStorage','fetch(','XMLHttpRequest(','WebSocket(']){if(s.includes(x))throw Error('Golden Talent must not retain/upload: '+x)}"
      - name: Install Chromium runner
        run: |
          npm install --no-save @playwright/test@1.56.0
          npx playwright install --with-deps chromium
      - name: Start nonproduction fixture webserver
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/safe-science-web.log 2>&1 &
          curl -fsS --retry-connrefused --retry 15 --retry-delay 1 --max-time 3 http://127.0.0.1:4173/fa/app/student/bahar/ > /dev/null
      - name: Browser acceptance for design, free activities, account and safety
        run: |
          npx playwright test tests/bilingual-global-mobile-browser.spec.js tests/konkur-official-scorecard-browser.spec.js tests/konkur-mock-practice-browser.spec.js tests/konkur-studio-browser.spec.js tests/konkur-catalogue-browser.spec.js tests/scientific-unified-design-browser.spec.js tests/scientific-premium-visual-browser.spec.js tests/bahar-formative-workspace-browser.spec.js tests/golden-talent-evidence-studio-browser.spec.js tests/rcas-start-browser.spec.js tests/scientific-continuity.browser.spec.js tests/customer-dashboard-browser.spec.js tests/bahar-readiness-browser.spec.js --reporter=line
      - name: Build EXACT sanitized public release artifact without deploying
        run: |
          node scripts/build-public-site.mjs
          test -f .public-site/assets/js/bahar-formative-workspace-v1.js
          test -f .public-site/assets/js/golden-talent-evidence-studio-v1.js
          test -f .public-site/fa/golden-talent/index.html
          test -f .public-site/en/golden-talent/index.html
          test -f .public-site/assets/css/jr-scientific-experience-v1.css
          test -f .public-site/fa/app/student/bahar/index.html
          test -f .public-site/en/golden-talent/dashboard/bahar/index.html
          test ! -e .public-site/platform
          test ! -e .public-site/database
          test ! -e .public-site/tests
          test ! -e .public-site/.git
          test ! -e .public-site/.env
          test ! -e .public-site/.env.local
          find .public-site -type f -print0 | sort -z | xargs -0 sha256sum > safe-scientific-public-site-manifest.sha256
          test "$(wc -l < safe-scientific-public-site-manifest.sha256)" -gt 700
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -czf safe-scientific-public-site.tar.gz -C .public-site .
          sha256sum safe-scientific-public-site.tar.gz > safe-scientific-public-site.tar.gz.sha256
          git rev-parse HEAD > safe-scientific-source-sha.txt
      - name: Preserve reviewed archive, source SHA and full checksums
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: safe-scientific-release-${{ github.sha }}
          path: |
            safe-scientific-public-site.tar.gz
            safe-scientific-public-site.tar.gz.sha256
            safe-scientific-public-site-manifest.sha256
            safe-scientific-source-sha.txt
          if-no-files-found: error
          retention-days: 7
      - name: Retain failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-science-qa-failure
          path: |
            test-results/
            playwright-report/
            /tmp/safe-science-web.log
          if-no-files-found: ignore
