name: Bertina Post-Release Operational Acceptance

on:
  workflow_run:
    workflows: ["Deploy to Bertina"]
    types: [completed]
    branches: [migration/bertina-linux6]
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * *'
  push:
    branches: [migration/bertina-linux6]
    paths:
      - 'scripts/bertina-postrelease-check.mjs'
      - 'scripts/lib/public-release-acceptance.mjs'
      - 'scripts/lib/jhela-native-host-acceptance.mjs'
      - 'tests/jhela-native-host-acceptance.test.mjs'
      - 'tests/public-release-acceptance.test.mjs'
      - 'docs/governance/CONTROLLED_DEPLOY_HANDOFF_20261016.md'
      - '.github/workflows/bertina-postrelease-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: bertina-postrelease-acceptance
  cancel-in-progress: true

jobs:
  anonymous-operational-smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'migration/bertina-linux6' || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'migration/bertina-linux6') }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fail-closed public-acceptance tests and observer syntax
        run: |
          node --check scripts/bertina-postrelease-check.mjs
          node --check scripts/lib/public-release-acceptance.mjs
          node --check scripts/lib/jhela-native-host-acceptance.mjs
          node --test tests/jhela-native-host-acceptance.test.mjs
          node --test tests/public-release-acceptance.test.mjs

      - name: Check trusted public TLS, exact release, auth, commerce and 13 articles
        env:
          BERTINA_EXPECTED_RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          BERTINA_ACCEPTANCE_EVIDENCE: bertina-postrelease-evidence.json
        run: node scripts/bertina-postrelease-check.mjs
      - name: Retain sanitized anonymous evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bertina-postrelease-operational-evidence
          path: bertina-postrelease-evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: State verification limits
        if: always()
        run: |
          echo 'This workflow observes only anonymous GET endpoints over CA-trusted HTTPS.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Release SHA, auth readiness, commerce safeguards and 13 public article routes are checked.' >> "$GITHUB_STEP_SUMMARY"
          echo 'It neither submits an order nor proves inbox delivery, settled payments, inventory, independent restore or MFA.' >> "$GITHUB_STEP_SUMMARY"
          node <<'NODE'
          const fs=require('node:fs');
          const file='bertina-postrelease-evidence.json';
          const out=process.env.GITHUB_STEP_SUMMARY;
          const lines=['','### Public P0 acceptance (strict)'];
          if(!fs.existsSync(file)){
            lines.push('- **BLOCKED** — acceptance artifact missing; neither smoke nor deployment readiness established.');
          }else{
            try{
              const e=JSON.parse(fs.readFileSync(file,'utf8'));
              const p=e.publicReleaseAcceptance;
              const status=p?.publicP0Acceptance==='PUBLIC_SURFACES_VERIFIED'?'PUBLIC SURFACES VERIFIED':'BLOCKED';
              lines.push('- **'+status+'** — separate from the 17-check anonymous smoke verdict.');
              lines.push('- Anonymous 17-check smoke: '+(e.passed===true?'PASS':'FAIL or unverified')+'.');
              lines.push('- Exact release SHA pinned: '+(typeof e.expectedReleaseSha==='string'&&e.expectedReleaseSha.length===40?'YES':'NO')+'.');
              const page=p?.checks?.bilingualRoutes;
              lines.push('- Service pages meeting public contract: '+(Number.isInteger(page)?page:'unverified')+'/42.');
              lines.push('- One-hop /home/ redirect: '+(p?.checks?.homeOneHop301===true?'verified':'NOT VERIFIED')+'.');
              lines.push('- Journal TLS observation: '+(p?.checks?.journalTlsPublicHandshakeObserved===true?'trusted handshake observed':'NOT VERIFIED')+'.');
              const known=new Set(['legacy_anonymous_smoke_not_passing','immutable_expected_sha_absent','observed_live_sha_missing','deployed_source_sha_mismatch','gsc_home_301_not_verified','bilingual_42_routes_not_verified','publishing_public_offer_not_verified']);
              const blockers=Array.isArray(p?.blockers)?p.blockers.filter(x=>known.has(x)):[];
              lines.push('- Strict public blockers: '+(blockers.length?blockers.join(', '):status==='BLOCKED'?'evidence missing':'none')+'.');
            }catch(_){
              lines.push('- **BLOCKED** — supplied evidence could not be parsed or authenticated.');
            }
          }
          lines.push('- This summary does NOT certify bank settlement, paid-service fulfilment, SMTP delivery, PKP OJS, private manuscripts, 41 acceptance gates or owner release authorization.');
          fs.appendFileSync(out,lines.join('\n')+'\n');
          NODE
