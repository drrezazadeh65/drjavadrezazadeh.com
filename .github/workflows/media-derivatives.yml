name: Retired Automatic Media Writer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source without publishing changes
        run: |
          node scripts/media-library-audit.mjs
          echo 'Generate derivatives locally from approved sources and submit them through a reviewed PR.'
