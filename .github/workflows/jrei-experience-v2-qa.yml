name: JREI Experience v2 — commercial design QA (No Deployment)
on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - 'scripts/jrei-experience-v2.mjs'
      - 'scripts/build-public-site.mjs'
      - 'assets/css/jrei-experience-v2.css'
      - 'assets/js/jrei-experience-v2.js'
      - 'tests/jrei-experience-v2*'
      - '.github/workflows/jrei-experience-v2-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/jrei-experience-v2.test.mjs tests/jrei-universal-public-chat-consent.test.mjs
      - run: node --check assets/js/jrei-experience-v2.js
      - run: node scripts/build-public-site.mjs
      - name: Verify exact reviewed SEO observations resolved
        run: node -e 'const r=require("./test-results/jr-public-release-audit.json"); if(r.issueCounts.description_review||r.issueCounts.image_dimensions_review) { console.error(r.issues);process.exit(1); }'
      - run: npm install --no-save @playwright/test@1.56.0
      - run: npx playwright install --with-deps chromium
      - name: Verify interactions on local artifact
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .public-site >/tmp/jx-http.log 2>&1 &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/ >/dev/null
          npx playwright test tests/jrei-experience-v2.spec.js --workers=3 --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jrei-experience-v2-diagnostics
          path: test-results/
          retention-days: 7
