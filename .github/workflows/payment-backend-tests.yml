name: Payment Backend Tests
on:
  push:
    paths:
      - 'payment-backend/**'
      - '.github/workflows/payment-backend-tests.yml'
  pull_request:
    paths:
      - 'payment-backend/**'
      - '.github/workflows/payment-backend-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: payment-backend/package-lock.json
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run backend tests
        run: npm test
        env:
          BITPAY_SANDBOX_ENABLED: 'false'
