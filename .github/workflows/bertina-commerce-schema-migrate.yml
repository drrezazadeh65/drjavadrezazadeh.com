name: Bertina Commerce Schema Migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AUTHORIZE_AFTER_SIGNED_RESTORE; requires real private signed recovery proof'
        required: true
        type: string
      expected_source_sha:
        description: 'Exact 40-hex canonical branch SHA reviewed before this production mutation'
        required: true
        type: string
      expected_live_sha:
        description: 'Exact 40-hex current Bertina /sw.js SHA; must match private backup sourceRelease'
        required: true
        type: string

permissions:
  contents: read

# Uses the SAME environment lock as deploy-bertina.yml: a schema migration
# and a release must never interleave on the production Bertina MySQL/files.
concurrency:
  group: bertina-production-deploy
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/migration/bertina-linux6'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Refuse unapproved, stale, unverifiable or unaudited production changes
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_SOURCE: ${{ inputs.expected_source_sha }}
          EXPECTED_LIVE: ${{ inputs.expected_live_sha }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'AUTHORIZE_AFTER_SIGNED_RESTORE'
          [[ "$EXPECTED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_LIVE" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_SOURCE" = "$GITHUB_SHA"
          current="$(git ls-remote origin refs/heads/migration/bertina-linux6 | cut -f1)"
          test "$current" = "$GITHUB_SHA"
          php -l scripts/bertina-private-recovery-gate.php
          php tests/bertina-private-recovery-gate.php
          python3 tests/test_bertina_commerce_migration_guard.py
          python3 - <<'PY'
          import json,os,re,time
          request=json.load(open('.bertina-backup-trigger',encoding='utf-8'))
          expected=os.environ['EXPECTED_LIVE']
          assert request.get('schema')=='bertina-private-backup-v1'
          assert request.get('sourceRelease')==expected
          assert isinstance(request.get('issuedAt'),int) and isinstance(request.get('expiresAt'),int)
          assert request['issuedAt']<=time.time()<request['expiresAt']
          assert request['expiresAt']-request['issuedAt']<=3600
          print('A fresh public request matches the expected live release; private signed proof is NOT yet certified here.')
          PY
          live="$(curl -fsS --max-time 25 --resolve drjavadrezazadeh.com:443:188.40.203.218 https://drjavadrezazadeh.com/sw.js |
            sed -n "s/^const CACHE_VERSION='jr-site-bertina-\\([a-f0-9]\\{40\\}\\)';$/\\1/p" | head -n 1)"
          test "$live" = "$EXPECTED_LIVE"
          echo 'Confirmed expected source and actual TLS-verified live releases; PHP must independently check signed restore.'
      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Create one-time migration script
        id: prep
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          TOKEN_HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          NONCE="$(openssl rand -hex 10)"
          SCRIPT_NAME="commerce-schema-${NONCE}.php"
          cat > "/tmp/${SCRIPT_NAME}" <<'PHP'
          <?php
          declare(strict_types=1);
          // Trusted pinned RSA validation is copied verbatim from the already-tested recovery gate.
          __PINNED_RECOVERY_GATE__
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          header('X-Robots-Tag: noindex, noarchive');
          $expected='__TOKEN_HASH__';
          $provided=(string)($_SERVER['HTTP_X_MIGRATION_TOKEN']??'');
          if(!hash_equals($expected,hash('sha256',$provided))){http_response_code(403);echo json_encode(['ok'=>false,'error'=>'forbidden']);exit;}
          $self=__FILE__;
          try{
              // This script lives under public_html/api; recovery metadata lives above public_html.
              drjrRecoveryCheck(dirname(__DIR__),'__RECOVERY_REQUEST_B64__',time());
          }catch(Throwable $e){
              @unlink($self);
              http_response_code(503);
              echo json_encode(['ok'=>false,'error'=>'verified_private_recovery_required']);
              exit;
          }
          try{
              $cfg=require __DIR__.'/config.local.php';
              if(!is_array($cfg))throw new RuntimeException('config_invalid');
              $pdo=new PDO((string)($cfg['db_dsn']??''),(string)($cfg['db_user']??''),(string)($cfg['db_password']??''),[
                  PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,
                  PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC,
                  PDO::ATTR_EMULATE_PREPARES=>false,
              ]);
              $existing=[];
              foreach($pdo->query("SHOW COLUMNS FROM commerce_orders")->fetchAll() as $row){$existing[(string)$row['Field']]=true;}
              $changes=[];
              if(!isset($existing['customer_email'])){$pdo->exec("ALTER TABLE commerce_orders ADD COLUMN customer_email VARCHAR(254) NULL AFTER currency");$changes[]='customer_email';}
              if(!isset($existing['customer_json'])){$pdo->exec("ALTER TABLE commerce_orders ADD COLUMN customer_json LONGTEXT NULL AFTER customer_email");$changes[]='customer_json';}
              if(!isset($existing['receipt_email_sent_at'])){$pdo->exec("ALTER TABLE commerce_orders ADD COLUMN receipt_email_sent_at DATETIME NULL AFTER paid_at");$changes[]='receipt_email_sent_at';}
              $indexes=[];
              foreach($pdo->query("SHOW INDEX FROM commerce_orders")->fetchAll() as $row){$indexes[(string)$row['Key_name']]=true;}
              if(!isset($indexes['idx_commerce_customer_email'])){$pdo->exec("CREATE INDEX idx_commerce_customer_email ON commerce_orders(customer_email)");$changes[]='idx_commerce_customer_email';}
              $check=[];
              foreach($pdo->query("SHOW COLUMNS FROM commerce_orders")->fetchAll() as $row){$check[]=(string)$row['Field'];}
              $ok=in_array('customer_email',$check,true)&&in_array('customer_json',$check,true)&&in_array('receipt_email_sent_at',$check,true);
              echo json_encode(['ok'=>$ok,'changes'=>$changes,'schema'=>'commerce-v2'],JSON_UNESCAPED_SLASHES);
              if(!$ok)http_response_code(500);
          }catch(Throwable $e){
              http_response_code(500);
              echo json_encode(['ok'=>false,'error'=>'migration_failed']);
          }finally{
              @unlink($self);
          }
          PHP
          sed -i "s/__TOKEN_HASH__/$TOKEN_HASH/" "/tmp/$SCRIPT_NAME"
          # Assemble source-controlled PHP, never embed an owner private key.
          python3 - "$SCRIPT_NAME" <<'PY'
          import base64,pathlib,sys
          target=pathlib.Path('/tmp')/sys.argv[1]
          php=target.read_text()
          guard=pathlib.Path('scripts/bertina-private-recovery-gate.php').read_text().removeprefix('<?php').lstrip('\n')
          public_request=base64.b64encode(pathlib.Path('.bertina-backup-trigger').read_bytes()).decode('ascii')
          assert '__PINNED_RECOVERY_GATE__' in php and '__RECOVERY_REQUEST_B64__' in php
          assert php.index('drjrRecoveryCheck(dirname(__DIR__)') < php.index("require __DIR__.'/config.local.php'")
          php=php.replace('__PINNED_RECOVERY_GATE__',guard).replace('__RECOVERY_REQUEST_B64__',public_request)
          target.write_text(php)
          target.chmod(0o600)
          PY
          php -l "/tmp/$SCRIPT_NAME"
          {
            echo "token=$TOKEN"
            echo "script_name=$SCRIPT_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Upload migration over protected FTPS
        env:
          FTP_USER: ${{ secrets.BERTINA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BERTINA_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.BERTINA_FTP_REMOTE_DIR }}
          SCRIPT_NAME: ${{ steps.prep.outputs.script_name }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/migration/bertina-linux6 | cut -f1)" = "$GITHUB_SHA"
          echo "188.40.203.218 server388.bertina.biz" | sudo tee -a /etc/hosts >/dev/null
          timeout 90s lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://server388.bertina.biz" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 1
          set net:timeout 20
          cd "$FTP_REMOTE_DIR/api"
          put "/tmp/$SCRIPT_NAME" -o "$SCRIPT_NAME"
          bye
          LFTP

      - name: Run and verify migration
        env:
          TOKEN: ${{ steps.prep.outputs.token }}
          SCRIPT_NAME: ${{ steps.prep.outputs.script_name }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/migration/bertina-linux6 | cut -f1)" = "$GITHUB_SHA"
          RESPONSE="$(curl -fsS --max-time 60             --resolve drjavadrezazadeh.com:443:188.40.203.218             -H "X-Migration-Token: $TOKEN"             "https://drjavadrezazadeh.com/api/$SCRIPT_NAME")"
          printf '%s' "$RESPONSE" > /tmp/migration.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/migration.json','utf8'));
          if(d.ok!==true||d.schema!=='commerce-v2') throw new Error('Commerce schema migration failed');
          console.log('Commerce schema migration PASS:', JSON.stringify(d.changes||[]));
          NODE

      - name: Cleanup temporary script if still present
        if: always()
        env:
          FTP_USER: ${{ secrets.BERTINA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BERTINA_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.BERTINA_FTP_REMOTE_DIR }}
          SCRIPT_NAME: ${{ steps.prep.outputs.script_name }}
        run: |
          test -n "$SCRIPT_NAME" || exit 0
          echo "188.40.203.218 server388.bertina.biz" | sudo tee -a /etc/hosts >/dev/null
          timeout 60s lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://server388.bertina.biz" <<LFTP || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          cd "$FTP_REMOTE_DIR/api"
          rm -f "$SCRIPT_NAME"
          bye
          LFTP
