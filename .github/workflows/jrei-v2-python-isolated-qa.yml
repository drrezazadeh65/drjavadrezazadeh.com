name: JREI V2 Python-first Isolated QA (NO DEPLOY)
on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - '.github/workflows/jrei-v2-python-isolated-qa.yml'
      - 'platform/jrei-python/**'
      - 'platform/jrei-v5/windows-worker/jrei-autocode-sandbox-startup.ps1'
      - 'platform/jrei-v5/windows-worker/jrei-vulkan-qwen-single-pass.ps1'
      - 'api/jrei-apex-owner-missions.php'
      - 'api/jrei-apex-python-plan.php'
      - 'api/jrei-python-owner-skills.php'
      - 'api/operations.php'
      - 'api/index.php'
      - 'docs/migrations/20261026_jrei_*.sql'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jrei-v2-python-isolated-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-unit:
    name: Model-free Python contracts (no network/data writes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: platform/jrei-python/pyproject.toml
      - name: Install locked direct source requirements
        working-directory: platform/jrei-python
        run: python -m pip install -e .
      - name: Compile every Python module
        working-directory: platform/jrei-python
        run: python -m compileall -q jrei_core jrei_learning jrei_orchestrator jrei_service jrei_skills jrei_memory
      - name: Deterministic model-free suite
        working-directory: platform/jrei-python
        env:
          JREI_PYTHON_PRIVATE_ENABLED: '0'
          JREI_PYTHON_OWNER_MEMORY_ENABLED: '0'
          JREI_PYTHON_OWNER_MEMORY_REVOKE_ENABLED: '0'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Explicit no-deploy result
        if: always()
        run: echo 'Python source QA only. No Bertina SSH/FTP/SQL, Windows changes, Qwen activation or automatic model training.' >> "$GITHUB_STEP_SUMMARY"
  php-syntax:
    name: Original owner gateway and proposal syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint new and unchanged PHP routes
        run: |
          set -euo pipefail
          php -l api/jrei-apex-owner-missions.php
          php -l api/jrei-apex-python-plan.php
          php -l api/jrei-python-owner-skills.php
          php -l platform/jrei-python/php/jrei-python-internal-client.php
          php -l api/operations.php
          php -l api/index.php
      - name: Report no-live-DB boundary
        if: always()
        run: echo 'No MySQL migrations applied. Only php -l. Owner MFA, DB and worker runtime require separately observed stage.' >> "$GITHUB_STEP_SUMMARY"

  windows-birth-supervisor:
    name: Source-only Windows startup parser (NO TASK INSTALLATION)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse owner-gated JREI sandbox startup source
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          $path=(Resolve-Path 'platform/jrei-v5/windows-worker/jrei-autocode-sandbox-startup.ps1').Path
          $null=[System.Management.Automation.Language.Parser]::ParseFile(
            $path,[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){
            $errors|ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          $code=Get-Content -LiteralPath $path -Raw
          if($code -notmatch "RunLevel Limited" -or
             $code -notmatch "AUTOCODE_OWNER_APPROVAL_REQUIRED" -or
             $code -notmatch "autocode-settings.v1.json" -or
             $code -notmatch "JREI_CONTINUOUS_AUTOCODE_ENABLED" -or
             $code -match "Start-ScheduledTask"){
            throw 'JREI_BIRTH_SUPERVISOR_SOURCE_UNSAFE'
          }
          Write-Output 'JREI_WINDOWS_SANDBOX_SUPERVISOR_SOURCE_PARSED_NO_INSTALLATION'
          # Source-only parser: Vulkan lab must not start a process in CI.
          $gpu='platform/jrei-v5/windows-worker/jrei-vulkan-qwen-single-pass.ps1'
          $gpuTokens=$null
          $gpuErrors=$null
          $null=[System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $gpu).Path,[ref]$gpuTokens,[ref]$gpuErrors)
          if($gpuErrors.Count -gt 0){
            $gpuErrors|ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          $gpuCode=Get-Content -LiteralPath $gpu -Raw
          foreach($must in @('finally{','LAB_PROCESS_CLEANUP_REQUESTED',
            'APPROVED_MODEL_HASH_MISMATCH','VULKAN_ARCHIVE_SHA256_MISMATCH',
            '--n-gpu-layers','127.0.0.1:8082','enable_thinking',
            'ValidateRange(0,37)','RX580_VRAM_HEADROOM_UNSAFE',
            'minimumFreeMiB=if($GpuLayers -ge 33){5120}else{4096}',
            'gpuFreeMiB -lt $minimumFreeMiB')){
            if(-not $gpuCode.Contains($must)){
              throw 'JREI_GPU_LAB_MISSING_OWNER_GUARD'
            }
          }
          Write-Output 'JREI_VULKAN_SOURCE_PARSED_NO_GPU_OR_LOCAL_MODEL_STARTED'
          # Mock response regression: llama.cpp can omit usage and
          # reasoning_content. The owner experiment must still report a
          # real nonempty content string under strict PowerShell mode.
          $source=Get-Content -LiteralPath $gpu -Raw
          $functionNode=($null -ne $gpuTokens) -and ($gpuTokens.Count -ge 0)
          $gpuAst=[System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $gpu).Path,[ref]$gpuTokens,[ref]$gpuErrors)
          $helpers=@($gpuAst.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
            $node.Name -eq 'Get-OptionalJsonField'
          },$true))
          if($helpers.Count -ne 1){
            throw 'JREI_VULKAN_OPTIONAL_FIELD_HELPER_MISSING'
          }
          . ([scriptblock]::Create($helpers[0].Extent.Text))
          $sample='{"choices":[{"message":{"content":"Hello"},"finish_reason":"stop"}]}'
          $parsed=$sample | ConvertFrom-Json
          Set-StrictMode -Version Latest
          $message=Get-OptionalJsonField $parsed.choices[0] 'message'
          $content=Get-OptionalJsonField $message 'content'
          $missingReasoning=Get-OptionalJsonField $message 'reasoning_content'
          $missingUsage=Get-OptionalJsonField $parsed 'usage'
          if($content -cne 'Hello' -or $null -ne $missingReasoning -or
             $null -ne $missingUsage){
            throw 'JREI_VULKAN_OPTIONAL_RESPONSE_REGRESSION'
          }
          Write-Output 'JREI_VULKAN_ABSENT_OPTIONAL_FIELDS_MOCK_PASS'
