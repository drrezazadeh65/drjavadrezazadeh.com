name: RAVE analytics quality
on:
  pull_request:
    paths:
      - 'rave/analytics/**'
      - '.github/workflows/rave-analytics-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test rave/analytics/events.test.mjs rave/analytics/funnel.test.mjs
      - run: node rave/analytics/service-inventory.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rave-service-inventory
          path: rave/reports/service-inventory.json
          retention-days: 14
