name: Bertina Commerce Runtime Readiness
on:
  workflow_dispatch:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - 'scripts/commerce-live-readiness-audit.mjs'
      - 'api/**'
      - 'assets/js/commerce-checkout.js'
      - '.github/workflows/commerce-live-readiness.yml'

# readiness-run: 2026-10-10T15:02:00Z
permissions:
  contents: read

concurrency:
  group: commerce-runtime-readiness
  cancel-in-progress: true

jobs:
  read-only-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate commerce source syntax
        run: |
          php -l api/index.php
          node --check assets/js/book-store.js
      - name: Verify hardened commerce contract at Bertina origin
        run: |
          set -euo pipefail
          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:188.40.203.218 \
            https://drjavadrezazadeh.com/api/commerce/health -o /tmp/commerce-origin.json
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/commerce-origin.json','utf8'));
          if(h?.ok!==true || h.service!=='commerce') throw new Error('commerce_origin_health_invalid');
          if(h.hardeningRevision!=='tls-gate-v1') throw new Error('payment_hardening_revision_not_deployed');
          if(typeof h.requirements?.publicTlsConfirmed!=='boolean') throw new Error('public_tls_gate_missing');
          if(h.checkout===true && h.requirements.publicTlsConfirmed!==true) throw new Error('checkout_without_tls_confirmation');
          console.log('ORIGIN_HARDENING_PASS',JSON.stringify({
            revision:h.hardeningRevision,
            checkout:h.checkout,
            publicTlsConfirmed:h.requirements.publicTlsConfirmed,
            orderCapture:h.orderCapture
          }));
          NODE
      - name: Verify deployed Bertina commerce contract without initiating payment
        run: node scripts/commerce-live-readiness-audit.mjs
