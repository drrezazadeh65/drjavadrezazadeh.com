name: JREI-LM Disposable MariaDB Roundtrip (No Production)
on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - '.github/workflows/jrei-local-first-mariadb.yml'
      - 'api/jrei-local-chat.php'
      - 'api/jrei-local-schema-caretaker.php'
      - 'api/internal/jrei-owner-one-shot-bootstrap.php'
      - 'docs/migrations/20261023_jrei_model_registry_mother_mysql.sql'
      - 'api/internal/jrei-local-schema-caretaker-worker.php'
      - 'tests/jrei-local-schema-caretaker-fixture.php'
      - 'api/jrei-ai-public-service-route.php'
      - 'api/jrei-ai-answer-guard.php'
      - 'api/jrei-ai-uncited-answer-guard.php'
      - 'docs/migrations/20261024_jrei_local_inference_queue_mother_mysql.sql'
      - 'docs/migrations/20261024_jrei_local_chat_signed_freshness_mother_mysql.sql'
      - 'tests/jrei-local-mariadb-fixture.php'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jrei-lm-fixture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  disposable-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: jrei-disposable-ci-only
          MARIADB_DATABASE: drjavad1_store
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=8s
          --health-timeout=5s
          --health-retries=12
    env:
      MYSQL_PWD: jrei-disposable-ci-only
      JREI_FIXTURE_DB_PASSWORD: jrei-disposable-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable MariaDB PHP fixture
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client php-mysql php-xml php-zip
          for try in $(seq 1 45); do
            if mariadb -h127.0.0.1 -P3306 -uroot -Nse 'SELECT VERSION()' drjavad1_store >/dev/null 2>&1; then break; fi
            sleep 2
          done
          php -r 'exit((extension_loaded("pdo_mysql") && extension_loaded("sodium")) ? 0 : 1);'
      - name: Install only original identity and hybrid dependencies (omit JREI-LM registry and queue)
        run: |
          set -euo pipefail
          db() { mariadb -h127.0.0.1 -P3306 -uroot drjavad1_store "$@"; }
          db < docs/BERTINA_MYSQL_SCHEMA.sql
          db < database/unified/001_core_governance.sql
          for file in \
            docs/migrations/20261023_jrei_hybrid_worker_mother_mysql.sql \
            docs/migrations/20261023_operations_cron_master_mysql.sql; do
            db < "$file"
          done
          # Genuine fixture backup, deliberately private and recent.
          mariadb-dump -h127.0.0.1 -P3306 -uroot \
            --single-transaction drjavad1_store > "$RUNNER_TEMP/jrei-mother-fixture.sql"
          for number in $(seq 1 900); do echo '-- disposable CI backup padding' >> "$RUNNER_TEMP/jrei-mother-fixture.sql"; done
          echo "JREI_FIXTURE_BACKUP_PATH=$RUNNER_TEMP/jrei-mother-fixture.sql" >> "$GITHUB_ENV"
          echo "JREI_FIXTURE_BACKUP_SHA256=$(sha256sum "$RUNNER_TEMP/jrei-mother-fixture.sql" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Test governed automatic additive table creation and source idempotence
        run: |
          set -euo pipefail
          php -l api/jrei-local-schema-caretaker.php
          php -l api/internal/jrei-owner-one-shot-bootstrap.php
          php -l tests/jrei-local-schema-caretaker-fixture.php
          php tests/jrei-local-schema-caretaker-fixture.php
      - name: Test ephemeral encrypted conversation, model lease, citations and deletion
        run: |
          set -euo pipefail
          mariadb -h127.0.0.1 -P3306 -uroot drjavad1_store < docs/migrations/20261024_jrei_local_chat_signed_freshness_mother_mysql.sql
          php -l api/jrei-local-chat.php
          php -l tests/jrei-local-mariadb-fixture.php
          php tests/jrei-local-mariadb-fixture.php
      - name: Report production boundary
        if: always()
        run: |
          echo 'This test verifies idempotent backup-gated schema creation on disposable MariaDB, fake model metadata and fake worker identity.' >> "$GITHUB_STEP_SUMMARY"
          echo 'It executes no Windows local model, no OpenAI API, no Bertina migration, no production deployment.' >> "$GITHUB_STEP_SUMMARY"
