name: JREI AI Master VNext Isolated Execution (No Deployment)
on:
  push:
    branches:
      - migration/bertina-linux6
    paths:
      - 'platform/jrei-v5/jrei-deterministic-arithmetic.mjs'
      - 'platform/jrei-v5/jrei-educational-answer-review.mjs'
      - 'platform/jrei-v5/jrei-reviewed-knowledge-capsules.mjs'
      - 'platform/jrei-v5/jrei-original-item-factory.mjs'
      - 'platform/jrei-v5/jrei-adaptive-study-cycle.mjs'
      - 'platform/jrei-v5/jrei-scoped-mission-planner.mjs'
      - 'platform/jrei-v5/jrei-explainable-site-apprentice.mjs'
      - 'platform/jrei-v5/jrei-nightly-acquisition-planner.mjs'
      - 'platform/jrei-v5/windows-worker/jrei-local-chat-worker.mjs'
      - 'platform/news-intelligence/jrei-official-news-correction.mjs'
      - 'api/jrei-local-answer-integrity.php'
      - 'api/jrei-local-chat.php'
      - 'api/jrei-local-quality-telemetry.php'
      - 'api/jrei-daily-review-observations.php'
      - 'api/jrei-ai-improvement-sensors.php'
      - 'api/internal/jrei-daily-learning-worker.php'
      - 'api/index.php'
      - 'assets/js/assistant.js'
      - 'assets/js/operations-jrei-hybrid-nodes-v1.js'
      - 'platform/jrei-v5/windows-worker/jrei-worker.mjs'
      - 'tests/jrei-model-production-gates.php'
      - 'api/jrei-owner-private-pilot.php'
      - 'api/operations.php'
      - 'assets/js/operations-jrei-owner-pilot-v1.js'
      - 'fa/app/admin/index.html'
      - 'platform/jrei-v5/windows-worker/jrei-owner-pilot-worker.mjs'
      - 'tests/jrei-owner-private-pilot.test.mjs'
      - 'tests/jrei-owner-private-pilot-offline.php'
      - 'tests/jrei-ai-master-development-vnext.test.mjs'
      - '.github/workflows/jrei-ai-master-vnext-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-executable-source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check new and integrated JREI source without private backends
        run: |
          set -euo pipefail
          for file in \
            platform/jrei-v5/jrei-deterministic-arithmetic.mjs \
            platform/jrei-v5/jrei-educational-answer-review.mjs \
            platform/jrei-v5/jrei-reviewed-knowledge-capsules.mjs \
            platform/jrei-v5/jrei-original-item-factory.mjs \
            platform/jrei-v5/jrei-adaptive-study-cycle.mjs \
            platform/jrei-v5/jrei-scoped-mission-planner.mjs \
            platform/jrei-v5/jrei-explainable-site-apprentice.mjs \
            platform/jrei-v5/jrei-nightly-acquisition-planner.mjs \
            platform/jrei-v5/windows-worker/jrei-local-chat-worker.mjs \
            platform/news-intelligence/jrei-official-news-correction.mjs
          do node --check "$file"; done
          php -l api/jrei-local-answer-integrity.php
          php -l api/jrei-local-chat.php
          php -l api/jrei-local-quality-telemetry.php
          php -l api/jrei-daily-review-observations.php
          php -l api/jrei-ai-improvement-sensors.php
          php -l api/internal/jrei-daily-learning-worker.php
          php -l api/index.php
          php -l api/operations.php
          php -l api/jrei-owner-private-pilot.php
          node --check platform/jrei-v5/windows-worker/jrei-owner-pilot-worker.mjs
          node --check assets/js/operations-jrei-owner-pilot-v1.js
          node --check platform/jrei-v5/windows-worker/jrei-worker.mjs
          node --check assets/js/assistant.js
          node --check assets/js/operations-jrei-hybrid-nodes-v1.js
      - name: Execute isolated source contracts; no live database, worker or model
        run: |
          set -euo pipefail
          node --test tests/jrei-ai-master-development-vnext.test.mjs
          node --test tests/jrei-local-chat-worker-offline.test.mjs
          node --test tests/jrei-local-quality-triage.test.mjs
          node --test tests/jrei-operational-apprentice.test.mjs
          php tests/jrei-model-production-gates.php
          php tests/jrei-owner-private-pilot-offline.php
          node --test tests/jrei-owner-private-pilot.test.mjs
          php -r 'define("BERTINA_API_BOOTSTRAPPED",true);require "api/jrei-local-answer-integrity.php";if(jrJreiSimpleArithmeticExpected("عدد ۱۲ را در ۷ ضرب کن و نتیجه را فقط با رقم بنویس.")!=="84")exit(1);if(jrJreiLocalDraftIntegrityFailure("عدد ۱۲ را در ۷ ضرب کن و نتیجه را فقط با رقم بنویس.","۴۸","fa")===null)exit(2);'
      - name: No deployment or backend activation
        run: |
          echo 'SOURCE_ONLY: no Bertina requests, no Windows private config changes, no model-quality attestation, no production deploy.'
