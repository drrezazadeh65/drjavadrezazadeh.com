name: JREI Native Windows Desktop EXE Installer (NO DEPLOY)

# Runs ONLY when manually dispatched after code completion/owner acceptance.
# A successful package build is NOT an integration test or a signed release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jrei-native-windows-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-desktop:
    if: github.ref == 'refs/heads/migration/bertina-linux6'
    name: Build owner-only GUI installer (no tests, no deployment)
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          ref: migration/bertina-linux6
          persist-credentials: false

      - name: Python Windows x64 packaging runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Install packaging utilities on isolated GitHub runner only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input 'pyinstaller==6.16.0'
          if ($LASTEXITCODE -ne 0) { throw 'JREI_PACKAGING_PYINSTALLER_UNAVAILABLE' }
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            choco install innosetup --version=6.7.1 --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'JREI_PACKAGING_INNO_SETUP_UNAVAILABLE' }
          }
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw 'JREI_INNO_COMPILER_NOT_FOUND'
          }

      - name: Build native Tk EXE and explicitly unaccepted installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $desktop = 'platform/jrei-v5/windows-desktop'
          $source = "$desktop/jrei_desktop.py"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw 'JREI_NATIVE_DESKTOP_SOURCE_MISSING'
          }
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -notmatch '^[a-f0-9]{40}$') {
            throw 'JREI_BUILD_SOURCE_COMMIT_INVALID'
          }
          $runId = [long]$env:GITHUB_RUN_ID
          if ($runId -le 0) { throw 'JREI_WINDOWS_BUILD_RUN_ID_INVALID' }
          $stamp = Join-Path $env:RUNNER_TEMP 'jrei-desktop-build.json'
          @{
            schema = 'jr.jrei.desktop-source-stamp.v1'
            source_commit = $commit
            branch = 'migration/bertina-linux6'
            github_workflow_run_id = $runId
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath $stamp -Encoding utf8NoBOM
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --name JREI --add-data "$stamp;." --distpath "$desktop/build" --workpath "$env:RUNNER_TEMP/jrei-build" --specpath "$env:RUNNER_TEMP/jrei-spec" "$source"
          if ($LASTEXITCODE -ne 0) { throw 'JREI_NATIVE_DESKTOP_EXE_BUILD_FAILED' }
          if (-not (Test-Path -LiteralPath "$desktop/build/JREI.exe" -PathType Leaf)) {
            throw 'JREI_NATIVE_DESKTOP_EXE_MISSING'
          }
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $compiler "$desktop/JREI.iss"
          if ($LASTEXITCODE -ne 0) { throw 'JREI_NATIVE_INNO_INSTALLER_FAILED' }
          $installer = "$desktop/output/JREI-Setup-Windows-x64-v0.1.3.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw 'JREI_NATIVE_INSTALLER_NOT_CREATED'
          }
          New-Item -ItemType Directory -Force 'JREI-OWNER-DOWNLOAD' | Out-Null
          Copy-Item -LiteralPath $installer -Destination 'JREI-OWNER-DOWNLOAD/JREI-Setup-Windows-x64-v0.1.3.exe'
          # Exactly ONE user-facing setup EXE in the downloadable artifact.
          # No A/B/RAM role scripts, confidential config or auxiliary apps
          # are shipped alongside it; the included inventory is read-only.
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "## JREI universal Windows x64 setup (source-only package)"
            ""
            "- One installer, for any existing or newly enrolled computer."
            "- Installer file: `JREI-Setup-Windows-x64-v0.1.3.exe`"
            "- Installer SHA-256: `$hash`"
            "- Canonical source commit: `$commit`"
            "- Workflow run ID: `$runId`"
            "- Signing: UNSIGNED (hash != code-signature)."
            "- Independent Windows acceptance: NOT RUN by this job."
            "- Signed worker enrollment on new machines: NOT PERFORMED."
            "- Installed native neural weights: NOT INCLUDED."
            "- Site deployment / live Windows install: NOT PERFORMED."
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8


      - name: Upload owner-only installer artifact (not an accepted release)
        uses: actions/upload-artifact@v4
        with:
          name: JREI-WINDOWS-DESKTOP-INSTALLER
          path: JREI-OWNER-DOWNLOAD/JREI-Setup-Windows-x64-v0.1.3.exe
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
