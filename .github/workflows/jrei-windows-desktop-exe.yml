name: JREI Native Windows Desktop EXE Installer (NO DEPLOY)

# Runs ONLY when manually dispatched after code completion/owner acceptance.
# A successful package build is NOT an integration test or a signed release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jrei-native-windows-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-desktop:
    if: github.ref == 'refs/heads/migration/bertina-linux6'
    name: Build owner-only GUI installer (no tests, no deployment)
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          ref: migration/bertina-linux6
          persist-credentials: false

      - name: Python Windows x64 packaging runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Install packaging utilities on isolated GitHub runner only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input 'pyinstaller==6.16.0'
          if ($LASTEXITCODE -ne 0) { throw 'JREI_PACKAGING_PYINSTALLER_UNAVAILABLE' }
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            choco install innosetup --version=6.7.1 --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'JREI_PACKAGING_INNO_SETUP_UNAVAILABLE' }
          }
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw 'JREI_INNO_COMPILER_NOT_FOUND'
          }

      - name: Build native Tk EXE and explicitly unaccepted installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $desktop = 'platform/jrei-v5/windows-desktop'
          $source = "$desktop/jrei_desktop.py"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw 'JREI_NATIVE_DESKTOP_SOURCE_MISSING'
          }
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -notmatch '^[a-f0-9]{40}$') {
            throw 'JREI_BUILD_SOURCE_COMMIT_INVALID'
          }
          $runId = [long]$env:GITHUB_RUN_ID
          if ($runId -le 0) { throw 'JREI_WINDOWS_BUILD_RUN_ID_INVALID' }
          $stamp = Join-Path $env:RUNNER_TEMP 'jrei-desktop-build.json'
          @{
            schema = 'jr.jrei.desktop-source-stamp.v1'
            source_commit = $commit
            branch = 'migration/bertina-linux6'
            github_workflow_run_id = $runId
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath $stamp -Encoding utf8NoBOM
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --name JREI --add-data "$stamp;." --distpath "$desktop/build" --workpath "$env:RUNNER_TEMP/jrei-build" --specpath "$env:RUNNER_TEMP/jrei-spec" "$source"
          if ($LASTEXITCODE -ne 0) { throw 'JREI_NATIVE_DESKTOP_EXE_BUILD_FAILED' }
          if (-not (Test-Path -LiteralPath "$desktop/build/JREI.exe" -PathType Leaf)) {
            throw 'JREI_NATIVE_DESKTOP_EXE_MISSING'
          }
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $compiler "$desktop/JREI.iss"
          if ($LASTEXITCODE -ne 0) { throw 'JREI_NATIVE_INNO_INSTALLER_FAILED' }
          $installer = "$desktop/output/JREI-Setup-Windows-x64-v0.1.2.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw 'JREI_NATIVE_INSTALLER_NOT_CREATED'
          }
          New-Item -ItemType Directory -Force 'JREI-OWNER-DOWNLOAD' | Out-Null
          Copy-Item -LiteralPath $installer -Destination 'JREI-OWNER-DOWNLOAD/JREI-Setup-Windows-x64-v0.1.2.exe'
          # The SAME unsigned UI installer is used on both PCs. Role-specific
          # wrappers are strictly opt-in, verify existing signed node identity,
          # exact source commit, SHA256 and the independent acceptance ledger.
          $worker = 'platform/jrei-v5/windows-worker'
          foreach ($name in @(
            'jrei-two-pc-owner-install.ps1',
            'JREI-SETUP-THIS-PC.cmd',
            'JREI-SETUP-NODE-A.cmd',
            'JREI-SETUP-NODE-B.cmd'
          )) {
            $sourceFile = Join-Path $worker $name
            if (-not (Test-Path -LiteralPath $sourceFile -PathType Leaf)) {
              throw 'JREI_TWO_PC_INSTALL_SCRIPT_NOT_IN_CANONICAL_SOURCE'
            }
            Copy-Item -LiteralPath $sourceFile -Destination (Join-Path 'JREI-OWNER-DOWNLOAD' $name)
          }
          Copy-Item -LiteralPath "$desktop/README-JREI-WINDOWS-EXE.md" -Destination 'JREI-OWNER-DOWNLOAD/README-TWO-PC-RELEASE.md'
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  JREI-Setup-Windows-x64-v0.1.2.exe" | Set-Content -Encoding ascii 'JREI-OWNER-DOWNLOAD/SHA256SUMS.txt'
          @(
            "JREI Owner Native Desktop Installer"
            "GITHUB_SOURCE_COMMIT=$commit"
            "CLIENT_EMBEDDED_SOURCE_COMMIT=$commit"
            "CLIENT_PACKAGING_RUN_ID=$runId"
            "INSTALLER_SHA256=$hash"
            "INSTALLER_VERSION=0.1.2"
            "WINDOWS_TARGET=x64"
            "SIGNATURE=UNSIGNED"
            "SOURCE_IDENTITY_NOT_CODE_SIGNATURE=TRUE"
            "BACKEND_REQUIRED=127.0.0.1:8092"
            "NODE_A_ROLE=EXISTING_VERIFIED_SIGNED_32GB_WINDOWS_OWNER_PC"
            "NODE_B_ROLE=EXISTING_VERIFIED_SIGNED_16GB_WINDOWS_OWNER_PC"
            "ONE_INSTALLER_FOR_BOTH_NODES=TRUE"
            "PER_NODE_SHA256_AND_ACCEPTANCE_GATES_REQUIRED=TRUE"
            "SIGNED_WORKER_IDENTITY_NOT_REPLACED=TRUE"
            "INTEGRATED_WINDOWS_ACCEPTANCE=NOT_RUN"
            "MODEL_WEIGHTS_NOT_TRAINED_BY_THIS_JOB=TRUE"
            "NO_LIVE_INSTALL=TRUE"
            "NO_WEBSITE_DEPLOYMENT=TRUE"
          ) | Set-Content -Encoding utf8 'JREI-OWNER-DOWNLOAD/BUILD-MANIFEST.txt'
          @{
            schema = 'jr.jrei.native-installer-artifact.v1'
            source_commit = $commit
            github_workflow_run_id = $runId
            installer_name = 'JREI-Setup-Windows-x64-v0.1.2.exe'
            installer_sha256 = $hash
            os = 'windows-x64'
            signed = $false
            integrated_acceptance_performed = $false
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath 'JREI-OWNER-DOWNLOAD/installer-manifest.json' -Encoding utf8NoBOM
          "Package built but NOT installed, signed or integration-tested. Source: $commit" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload owner-only installer artifact (not an accepted release)
        uses: actions/upload-artifact@v4
        with:
          name: JREI-WINDOWS-DESKTOP-INSTALLER
          path: JREI-OWNER-DOWNLOAD/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
