name: JREI Native Windows Desktop EXE Installer (NO DEPLOY)

# Runs ONLY when manually dispatched after code completion/owner acceptance.
# A successful package build is NOT an integration test or a signed release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jrei-native-windows-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-desktop:
    if: github.ref == 'refs/heads/migration/bertina-linux6'
    name: Build owner-only offline GUI + Python engine installer (no tests, no deployment)
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          ref: migration/bertina-linux6
          persist-credentials: false

      - name: Python Windows x64 packaging runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Go native Windows no-TEMP installer build environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'

      - name: Validate bundled setup source syntax only (no tests or startup)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $desktop='platform/jrei-v5/windows-desktop'
          foreach($name in @('jrei-engine-setup.ps1','jrei-shortcuts.ps1','jrei-device-inventory.ps1')){
            $path=Join-Path $desktop $name
            $tokens=$null
            $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path).Path,
              [ref]$tokens,[ref]$parseErrors) | Out-Null
            if($parseErrors.Count -ne 0){
              throw ('JREI_SETUP_POWERSHELL_SYNTAX_INVALID: '+$name)
            }
          }
          # Parse Python text only: do not import, create owner directories,
          # initialize DB, run a neural model or access the public website.
          python -c "import ast,pathlib; root=pathlib.Path('platform'); paths=[root/'jrei-v5/windows-desktop/jrei_embedded_engine.py',root/'jrei-v5/windows-desktop/jrei_owner_python_bootstrap.py',root/'jrei-v5/windows-desktop/jrei_desktop.py',root/'jrei-python/jrei_service/windows_private_storage.py',root/'jrei-python/jrei_service/windows_command_center.py']; [ast.parse(p.read_text(encoding='utf-8'),filename=str(p)) for p in paths]"
          if($LASTEXITCODE -ne 0){throw 'JREI_FROZEN_PYTHON_SOURCE_SYNTAX_INVALID'}

      - name: Install packaging utilities on isolated GitHub runner only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input 'pyinstaller==6.16.0' 'Pillow==11.3.0'
          if ($LASTEXITCODE -ne 0) { throw 'JREI_PACKAGING_PYINSTALLER_UNAVAILABLE' }
          # Resolve pinned runtime dependencies on THE GITHUB RUNNER only.
          # The Windows owner device never connects to PyPI for installation.
          python -m pip install --disable-pip-version-check --no-input './platform/jrei-python'
          if ($LASTEXITCODE -ne 0) { throw 'JREI_PACKAGING_PRIVATE_PYTHON_DEPS_UNAVAILABLE' }
          # The native Go bootstrap replaces Inno Setup entirely.
          # Do NOT install Inno or any unnecessary tool on the runner.

      - name: Package original GUI and original 8092 Python engine without runtime downloads
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version='0.1.15'
          $desktop='platform/jrei-v5/windows-desktop'
          $build="$desktop/build"
          $source="$desktop/jrei_desktop.py"
          if(-not (Test-Path -LiteralPath $source -PathType Leaf)){throw 'JREI_NATIVE_GUI_MISSING'}
          $sha=(git rev-parse HEAD).Trim()
          if($sha -notmatch '^[a-f0-9]{40}$'){throw 'JREI_SOURCE_COMMIT_INVALID'}
          $runId=[long]$env:GITHUB_RUN_ID
          if($runId -le 0){throw 'JREI_BUILD_RUN_ID_MISSING'}
          $stamp=Join-Path $env:RUNNER_TEMP 'jrei-desktop-build.json'
          @{
            schema='jr.jrei.desktop-source-stamp.v1'
            source_commit=$sha
            branch='migration/bertina-linux6'
            github_workflow_run_id=$runId
          }|ConvertTo-Json -Compress|Set-Content -LiteralPath $stamp -Encoding utf8NoBOM

          # Onedir GUI: no PyInstaller onefile _MEI* extraction in Windows TEMP
          # on EITHER owner device, including the machine affected by Error 5.
          python -m PyInstaller --noconfirm --clean --onedir --windowed --noupx --name JREI --add-data "$stamp;." --distpath "$build/ui" --workpath "$env:RUNNER_TEMP/jrei-ui-work" --specpath "$env:RUNNER_TEMP/jrei-ui-spec" "$source"
          if($LASTEXITCODE -ne 0){throw 'JREI_GUI_BUNDLE_FAILED'}
          $uiDir="$build/ui/JREI"
          if(-not (Test-Path -LiteralPath "$uiDir/JREI.exe" -PathType Leaf)){throw 'JREI_GUI_EXE_MISSING'}

          # The previous PyInstaller-frozen command center could not write to
          # owner-private SQLite although normal CPython 3.13 on the same PC could.
          # Instead ship app-local PSF CPython and runtime packages OFFLINE.
          # Runtime is bundled below after the verified source snapshot.

          # Private/user data, credentials, keys, models, clone and Git metadata
          # are intentionally excluded. The READ-ONLY source is built from
          # immutable HEAD in the canonical checkout.
          $snapshot=Join-Path $env:RUNNER_TEMP 'jrei-tracked-source.zip'
          git archive --format=zip --output="$snapshot" HEAD platform/jrei-python platform/jrei-v5 platform/news-intelligence scripts assets/css api
          if($LASTEXITCODE -ne 0){throw 'JREI_GIT_ARCHIVE_FAILED'}
          $sourceDir="$build/source"
          New-Item -ItemType Directory -Path $sourceDir -Force|Out-Null
          Expand-Archive -LiteralPath $snapshot -DestinationPath $sourceDir -Force
          if(-not (Test-Path -LiteralPath "$sourceDir/platform/jrei-python/jrei_service/windows_command_center.py" -PathType Leaf)){
            throw 'JREI_READ_ONLY_SOURCE_NOT_PACKAGED'
          }

          # Staging directory maps 1:1 to the final per-user release folder.
          # The single Go installer writes these paths directly into the
          # version-specific program folder, NEVER into the user's TEMP.
          $bundle="$build/universal-payload"
          New-Item -ItemType Directory -Path $bundle -Force|Out-Null
          Get-ChildItem -LiteralPath $uiDir -Force|Copy-Item -Destination $bundle -Recurse -Force
          foreach($name in @('jrei-device-inventory.ps1','jrei-engine-setup.ps1','jrei-shortcuts.ps1')){
            Copy-Item -LiteralPath (Join-Path $desktop $name) -Destination (Join-Path $bundle $name) -ErrorAction Stop
          }
          $packagedSource=Join-Path $bundle ("source-v"+$version)
          New-Item -ItemType Directory -Path $packagedSource -Force|Out-Null
          Get-ChildItem -LiteralPath $sourceDir -Force|Copy-Item -Destination $packagedSource -Recurse -Force
          $launchSource=Join-Path $packagedSource 'platform/jrei-v5/windows-desktop/jrei_embedded_engine.py'
          $ownerBootstrap=Join-Path $packagedSource 'platform/jrei-v5/windows-desktop/jrei_owner_python_bootstrap.py'
          if(-not (Test-Path -LiteralPath $launchSource -PathType Leaf)){throw 'JREI_PORTABLE_ENTRYPOINT_MISSING'}
          if(-not (Test-Path -LiteralPath $ownerBootstrap -PathType Leaf)){throw 'JREI_SYSTEM_PYTHON_BOOTSTRAP_MISSING'}

          # A normal, app-local CPython interpreter, never the PyInstaller
          # engine. The owner Windows device never fetches Python or packages.
          # We copy exactly the official x64 runtime installed by setup-python
          # on this isolated runner, including DLLs and stdlib.
          $pythonHome=(python -c "import sys; print(sys.base_prefix)").Trim()
          if(-not (Test-Path -LiteralPath (Join-Path $pythonHome 'python313.dll') -PathType Leaf)){
            throw 'JREI_PSF_PYTHON313_RUNTIME_NOT_FOUND'
          }
          $portable=Join-Path $bundle ("python-v"+$version)
          New-Item -ItemType Directory -Path $portable -Force|Out-Null
          foreach($name in @('python.exe','python3.dll','python313.dll')){
            Copy-Item -LiteralPath (Join-Path $pythonHome $name) -Destination $portable -ErrorAction Stop
          }
          Get-ChildItem -LiteralPath $pythonHome -File -Filter '*.dll' | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $portable -Force -ErrorAction Stop
          }
          Copy-Item -LiteralPath (Join-Path $pythonHome 'DLLs') -Destination $portable -Recurse -Force -ErrorAction Stop
          Copy-Item -LiteralPath (Join-Path $pythonHome 'Lib') -Destination $portable -Recurse -Force -ErrorAction Stop
          $site=Join-Path $portable 'Lib/site-packages'
          if(Test-Path -LiteralPath $site){Remove-Item -LiteralPath $site -Recurse -Force -ErrorAction Stop}
          New-Item -ItemType Directory -Path $site -Force|Out-Null
          foreach($exclude in @('test','idlelib','ensurepip','turtledemo','tkinter')){
            $path=Join-Path $portable ("Lib/"+$exclude)
            if(Test-Path -LiteralPath $path){Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop}
          }
          Get-ChildItem -LiteralPath $portable -Directory -Filter '__pycache__' -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          # Vendor runtime dependencies on GitHub runner, not owner's PC.
          python -m pip install --disable-pip-version-check --no-input --target "$site" './platform/jrei-python' 'Pillow==11.3.0'
          if($LASTEXITCODE -ne 0){throw 'JREI_PORTABLE_RUNTIME_DEPENDENCIES_UNAVAILABLE'}
          @(
            'Lib'
            'DLLs'
            ('..\source-v'+$version+'\platform\jrei-python')
            'Lib\site-packages'
          )|Set-Content -LiteralPath (Join-Path $portable 'python313._pth') -Encoding ascii
          if(-not (Test-Path -LiteralPath (Join-Path $site 'fastapi/__init__.py') -PathType Leaf)){
            throw 'JREI_PORTABLE_SITE_PACKAGES_MISSING'
          }
          $license=Join-Path $pythonHome 'LICENSE.txt'
          if(-not (Test-Path -LiteralPath $license -PathType Leaf)){
            throw 'JREI_PORTABLE_PSF_LICENSE_MISSING'
          }
          Copy-Item -LiteralPath $license -Destination $portable -ErrorAction Stop
          # Importing windows_command_center verifies the immutable source
          # root and requires the matching release manifest already present.
          # Emit the complete manifest before the runner-only import attempt.
          $packagedFileCount=@(Get-ChildItem -LiteralPath $bundle -File -Recurse).Count
          if($packagedFileCount -gt 24000){
            throw 'JREI_BUNDLED_RUNTIME_TOO_MANY_FILES'
          }
          $engineSha=(Get-FileHash -LiteralPath (Join-Path $portable 'python.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          @{
            schema='jr.jrei.offline-engine-package.v1'
            source_branch='migration/bertina-linux6'
            source_commit=$sha
            engine_sha256=$engineSha
            engine_runtime='BUNDLED_CPYTHON_3_13'
            model_weights_embedded=$false
            private_node_keys_embedded=$false
            tests_performed=$false
          }|ConvertTo-Json -Compress|Set-Content -LiteralPath "$bundle/jrei-engine-manifest.json" -Encoding utf8NoBOM

          # Isolated RUNNER-ONLY packaging validation: use the actual copied
          # interpreter to import all ORIGINAL command-center dependencies.
          # Never create owner tokens, initialize owner DB, contact server or
          # dispatch model jobs. Real Windows-PC acceptance remains separate.
          & (Join-Path $portable 'python.exe') -I -B -c "import sys, sqlite3, PIL, fastapi, cryptography; from jrei_service import windows_command_center; assert sys.version_info[:2] == (3,13); print('JREI_PORTABLE_RUNTIME_IMPORTS_READY')"
          if($LASTEXITCODE -ne 0){
            throw 'JREI_PORTABLE_RUNTIME_IMPORTS_NOT_READY'
          }
          # Validate the ACTUAL launcher script using both interpreter
          # transports without starting the owner server or opening SQLite.
          # This would catch a wrong source-v parent path or missing manifest
          # before a user downloads an EXE, without any owner-device tests.
          $bootstrap=Join-Path $packagedSource 'platform/jrei-v5/windows-desktop/jrei_owner_python_bootstrap.py'
          if(-not (Test-Path -LiteralPath $bootstrap -PathType Leaf)){
            throw 'JREI_OWNER_PYTHON_BOOTSTRAP_MISSING'
          }
          & (Join-Path $portable 'python.exe') -I -B $bootstrap --verify-packaging
          if($LASTEXITCODE -ne 0){
            throw 'JREI_BUNDLED_PYTHON_BOOTSTRAP_UNVERIFIED'
          }
          & python -I -B $bootstrap --verify-packaging
          if($LASTEXITCODE -ne 0){
            throw 'JREI_SYSTEM_PYTHON_BOOTSTRAP_UNVERIFIED'
          }
          # This archive is a build-time input embedded inside ONE Go EXE.
          # It is not a separate owner download or a Windows temp archive.
          $goPayload="$desktop/payload.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path -LiteralPath $bundle).Path,
            (Join-Path (Get-Location).Path $goPayload),
            [System.IO.Compression.CompressionLevel]::Optimal, $false)
          if(-not (Test-Path -LiteralPath $goPayload -PathType Leaf)){
            throw 'JREI_EMBEDDED_ARCHIVE_NOT_CREATED'
          }

          $out="$desktop/output"
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          $installer="$out/JREI-Setup-Windows-x64-v0.1.15.exe"
          go build -trimpath '-ldflags=-H windowsgui -s -w' -o $installer "$desktop/jrei_universal_setup_windows.go"
          if($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $installer -PathType Leaf)){
            throw 'JREI_GO_NO_TEMP_INSTALLER_BUILD_FAILED'
          }
          $hash=(Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Path 'JREI-OWNER-DOWNLOAD' -Force|Out-Null
          Copy-Item -LiteralPath $installer -Destination 'JREI-OWNER-DOWNLOAD/JREI-Setup-Windows-x64-v0.1.15.exe'
          @(
            '## JREI 0.1.15 - universal offline NO-TEMP Windows setup'
            ''
            '- Exactly ONE user-facing EXE (within the GitHub artifact ZIP).'
            '- Native Windows Go bootstrap selects a writable user-profile release folder without elevation.'
            '- Tries standard LocalAppData Programs, then LocalAppData JREI-Applications, then UserProfile JREI-Applications.'
            '- Each location is checked for unsafe links and actual write access, without bypassing Windows security.'
            '- No Inno is-*.tmp; no Python frozen engine, destination pip/PyPI or runtime downloads.'
            '- Contains Tk GUI plus original Python command center on app-local PSF CPython, packaged libraries and tracked source.'
            '- Unrecognized legacy Windows task is preserved; independent local core can start on free 8092.'
            '- The native desktop rechecks and starts the same original 8092 engine through the bundled Python interpreter.'
            '- Existing private DB, user conversations, worker node IDs, keys and models are preserved.'
            '- Does not assert independent model quality, GPU compute or signed remote-node enrollment.'
            '- Does NOT deploy the website, run training or perform integrated Windows acceptance.'
            "- Source commit: $sha"
            "- GitHub run ID: $runId"
            "- Installer SHA-256: $hash"
            '- UNSIGNED publisher; hash is NOT a code-signing certificate.'
            '- After installation examine actual 8092 health on each Windows owner PC.'
          ) -join [Environment]::NewLine |
          Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload ONE unaccepted owner installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JREI-WINDOWS-DESKTOP-INSTALLER
          path: JREI-OWNER-DOWNLOAD/JREI-Setup-Windows-x64-v0.1.15.exe
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
