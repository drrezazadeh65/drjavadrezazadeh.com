name: SEO service release gate
on:
  push:
    branches: [main]
    paths:
      - 'fa/services/**'
      - 'fa/vip/**'
      - 'en/services/**'
      - 'assets/images/vip-*.svg'
      - 'assets/data/vip-catalog.json'
      - 'assets/js/commerce-checkout.js'
      - 'payment-api/commerce-routes.js'
      - 'payment-api/worker-single-file-candidate.js'
      - 'platform/paid-student-support*'
      - 'platform/identity-auth-policy.json'
      - 'assets/images/services/**'
      - 'assets/data/service-catalog.json'
      - 'sitemap-services.xml'
      - 'sitemap.xml'
      - 'scripts/seo-services-gate.cjs'
      - '.github/workflows/seo-services-gate.yml'
  pull_request:
    paths:
      - 'fa/services/**'
      - 'fa/vip/**'
      - 'en/services/**'
      - 'assets/images/vip-*.svg'
      - 'assets/data/vip-catalog.json'
      - 'assets/js/commerce-checkout.js'
      - 'payment-api/commerce-routes.js'
      - 'payment-api/worker-single-file-candidate.js'
      - 'platform/paid-student-support*'
      - 'platform/identity-auth-policy.json'
      - 'assets/images/services/**'
      - 'assets/data/service-catalog.json'
      - 'sitemap-services.xml'
      - 'sitemap.xml'
      - 'scripts/seo-services-gate.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-service-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 27 standard/VIP service pages, academic credentials, support policy, and SEO
        run: node scripts/seo-services-gate.cjs
