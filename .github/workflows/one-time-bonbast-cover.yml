name: One-time Bonbast cover upload

on:
  push:
    paths:
      - ".github/workflows/one-time-bonbast-cover.yml"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified Bonbast WebP
        env:
          BONBAST_URL: "https://sdmntprukwest.oaiusercontent.com/files/00000000-9794-8243-9cc8-50dd64872019/raw?se=2026-10-07T17%3A48%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=0c2beae7-c005-5b77-a275-376ddf6665fd&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T04%3A18%3A17Z&ske=2026-10-08T04%3A18%3A17Z&sks=b&skv=2026-02-06&sig=0Sub8HinCZVP5faHtf/Dt26/nyvw3v6HoAyoP/xwcB4%3D"
        run: |
          set -euo pipefail
          mkdir -p assets/images/books
          curl --fail --location --retry 3 --retry-delay 2 "$BONBAST_URL" -o /tmp/bonbast.webp
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/bonbast.webp')
          b=p.read_bytes()
          assert len(b) > 50000, f"unexpectedly small file: {len(b)}"
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', "download is not a WebP file"
          print("validated", len(b), "bytes")
          PY
          mv /tmp/bonbast.webp assets/images/books/bonbast-javad-rezazadeh-yazdeli-book-cover-2026.webp

      - name: Point catalog to WebP and remove corrupt AVIF
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('platform/book-catalog.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          found=False
          for book in data.get('books', []):
              if book.get('id') == 'bonbast':
                  book['bibliography']['cover_image']='/assets/images/books/bonbast-javad-rezazadeh-yazdeli-book-cover-2026.webp'
                  found=True
                  break
          assert found, 'Bonbast catalog entry not found'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -f assets/images/books/bonbast-javad-rezazadeh-yazdeli-book-cover-2026.avif

      - name: Commit repaired cover
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/book-catalog.json assets/images/books/bonbast-javad-rezazadeh-yazdeli-book-cover-2026.webp
          git add -u assets/images/books/bonbast-javad-rezazadeh-yazdeli-book-cover-2026.avif
          git diff --cached --quiet && exit 0
          git commit -m "fix(shop): replace corrupt Bonbast cover with verified WebP"
          git push origin HEAD:main
