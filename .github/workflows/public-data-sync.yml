name: Public Data Projection Sync

on:
  push:
    branches: [main]
    paths:
      - 'platform/book-catalog.json'
      - 'platform/service-catalog.json'
      - 'platform/analytics-config.json'
      - 'scripts/build-public-data.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-data-projection-sync
  cancel-in-progress: false

jobs:
  sync:
    # Retired main baseline: Codex/Bertina production owns releases and indexing.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate browser-safe projections
        run: node scripts/build-public-data.mjs
      - name: Audit generated client data
        run: node scripts/public-data-hygiene-audit.mjs
      - name: Commit projection changes
        run: |
          if git diff --quiet -- assets/data; then
            echo "Public projections already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data
          git commit -m "chore(public-data): sync safe browser projections"
          git pull --rebase origin main
          git push origin HEAD:main
