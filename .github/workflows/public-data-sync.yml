name: Public Data Projection Validation

on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - 'platform/book-catalog.json'
      - 'platform/service-catalog.json'
      - 'platform/analytics-config.json'
      - 'assets/data/**'
      - 'scripts/build-public-data.mjs'
      - '.github/workflows/public-data-sync.yml'
  pull_request:
    branches: [migration/bertina-linux6]
    paths:
      - 'platform/book-catalog.json'
      - 'platform/service-catalog.json'
      - 'platform/analytics-config.json'
      - 'assets/data/**'
      - 'scripts/build-public-data.mjs'
      - '.github/workflows/public-data-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source without publishing changes
        run: |
          node scripts/build-public-data.mjs --check
          node scripts/public-data-hygiene-audit.mjs
