name: Email Worker Check
on:
  push:
    branches: [main]
    paths:
      - 'edge/email/**'
      - '.github/workflows/email-worker-check.yml'
  pull_request:
    paths:
      - 'edge/email/**'
      - '.github/workflows/email-worker-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and run unit tests
        working-directory: edge/email
        run: npm run check
      - name: Validate Cloudflare Worker build
        working-directory: edge/email
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/email-worker-build
