name: Full Route Visual Crawl

on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - '**/*.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'tests/full-route-visual-crawl.spec.js'
      - '.github/workflows/full-route-visual-crawl.yml'
  pull_request:
    branches: [migration/bertina-linux6]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: full-route-visual-crawl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The public UI intentionally uses system-native font stacks.
      # Disable Playwright's internal document.fonts.ready wait in Linux CI
      # so screenshot certification measures layout rather than runner font state.
      PW_TEST_SCREENSHOT_NO_FONTS_READY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright runtime
        run: npm install --no-save @playwright/test@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/drsite-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/drsite-http.log
          exit 1
      - name: Capture complete route matrix
        run: |
          set -o pipefail
          npx playwright test tests/full-route-visual-crawl.spec.js --workers=4 --reporter=line 2>&1 | tee full-route-visual-crawl.log
      - name: Write inventory
        if: always()
        run: |
          count="$(find test-results/full-route-visual-crawl -type f -name '*.jpg' 2>/dev/null | wc -l | tr -d ' ')"
          echo "Captured screenshots: $count" | tee test-results/full-route-visual-crawl-inventory.txt
      - name: Upload visual certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-route-visual-crawl
          path: |
            test-results/full-route-visual-crawl
            test-results/full-route-visual-crawl-inventory.txt
            full-route-visual-crawl.log
          if-no-files-found: warn
          retention-days: 14
