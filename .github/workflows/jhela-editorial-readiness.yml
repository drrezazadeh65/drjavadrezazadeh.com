name: JHELA Editorial Readiness

on:
  push:
    branches:
      - migration/bertina-linux6
    paths:
      - 'scripts/journal-ojs-preflight.php'
      - 'tests/journal-ojs-preflight.php'
      - 'docs/journal/**'
      - '.github/workflows/jhela-editorial-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate preflight and closed-by-default contract
        run: |
          php -l scripts/journal-ojs-preflight.php
          php -l tests/journal-ojs-preflight.php
          php tests/journal-ojs-preflight.php
      - name: Owner-authorised native intake remains host-gated and fail-closed
        run: |
          grep -Fq 'Submission availability is verified in real time' journal/submission/index.html
          grep -Fq 'وضعیت دریافت امن مقاله به‌صورت زنده بررسی می‌شود' journal/fa/submission/index.html
          grep -Fq "getenv('JR_JHELA_INTAKE_ENABLED')!=='true'" api/jhela-intake.php
          node --test tests/jhela-founding-intake.test.mjs
      - name: Record scope
        run: |
          echo 'JHELA source-only QA: OJS remains prohibited. Owner-authorised native preliminary intake is guarded by independent Bertina host TLS, private storage, ClamAV, account and database checks; live activation is NOT certified here.' >> "$GITHUB_STEP_SUMMARY"
