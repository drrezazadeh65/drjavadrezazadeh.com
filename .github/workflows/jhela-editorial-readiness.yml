name: JHELA Editorial Readiness
on:
  push:
    branches:
      - migration/bertina-linux6
    paths:
      - 'api/jhela-intake.php'
      - 'api/jhela-native-editorial.php'
      - 'api/operations.php'
      - 'assets/js/jhela-author-workspace.js'
      - 'assets/js/operations-jhela-host-readiness.js'
      - 'assets/js/operations-jhela-manuscripts.js'
      - 'journal/**'
      - 'docs/journal/**'
      - 'tests/jhela-founding-intake.test.mjs'
      - 'tests/jhela-antivirus-timeout.php'
      - 'tests/jhela-host-readiness.test.mjs'
      - 'tests/jhela-owner-triage.test.mjs'
      - 'tests/jhela-no-retired-vendor-public.test.mjs'
      - '.github/workflows/jhela-editorial-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, fileinfo, openssl
          coverage: none
      - name: Validate native PHP handlers and browser scripts
        run: |
          php -l api/jhela-intake.php
          php -l tests/jhela-antivirus-timeout.php
          php tests/jhela-antivirus-timeout.php
          php -l api/jhela-native-editorial.php
          php -l api/operations.php
          node --check assets/js/jhela-author-workspace.js
          node --check assets/js/operations-jhela-host-readiness.js
          node --check assets/js/operations-jhela-manuscripts.js
      - name: Verify native intake, host safety, editorial and no-retired-platform contracts
        run: |
          node --test tests/jhela-founding-intake.test.mjs tests/jhela-host-readiness.test.mjs tests/jhela-owner-triage.test.mjs tests/jhela-no-retired-vendor-public.test.mjs
      - name: Record evidence boundary
        run: |
          echo 'JHELA native source contracts passed. The live server must separately prove private storage, TLS, antivirus, verified account, real receipt, reviewer workflow, finance and publication. Source CI is not production certification.' >> "$GITHUB_STEP_SUMMARY"
