name: Retired Automatic Cache Writer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source without publishing changes
        run: |
          node --check sw.js
          node scripts/pwa-private-cache-audit.mjs
          echo 'Automatic cache commits are retired. Update CACHE_VERSION in a reviewed PR when changing cache policy.'
