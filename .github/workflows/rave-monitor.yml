name: RAVE portable monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run platform-neutral RAVE audit
        run: node rave/audit.mjs
      - name: Archive audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rave-audit
          path: rave/reports/latest.json
          retention-days: 30
