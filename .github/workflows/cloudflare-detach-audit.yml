name: Provider Detach Audit

on:
  push:
    branches:
      - migration/bertina-linux6
    paths:
      - '.github/workflows/cloudflare-detach-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory retired-provider references
        run: |
          set +e
          grep -RInEi             --exclude-dir=.git             --exclude-dir=node_modules             --exclude-dir=.public-site             --exclude='cloudflare-detach-audit.yml'             '(workers\.dev|cloudflare|wrangler|resend)' . || true
