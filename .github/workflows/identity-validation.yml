name: Identity OS validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'identity/**'
      - '.github/workflows/identity-validation.yml'
  pull_request:
    paths:
      - 'identity/**'
      - '.github/workflows/identity-validation.yml'
permissions:
  contents: read
jobs:
  preview-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run bilingual preview tests
        run: node --test identity/engine/*.test.mjs
      - name: Validate document template registry
        run: node identity/engine/validate-manifest.mjs
      - name: Verify production identity is not prematurely approved
        run: |
          node --check identity/engine/brand-release-gate.mjs
          if node identity/engine/brand-release-gate.mjs; then
            echo 'Unexpected production approval: verify brand status and release evidence.' >&2
            exit 1
          fi
          echo 'Expected: unapproved Persian production logo remains blocked.'
