name: Google ProfilePage Structured Data Gate
on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - 'index.html'
      - 'fa/index.html'
      - 'en/index.html'
      - 'en/about/index.html'
      - 'en/academic-profile/index.html'
      - 'fa/darbare-man/index.html'
      - 'scripts/profilepage-schema-audit.mjs'
      - '.github/workflows/profilepage-structured-data.yml'
  pull_request:
    branches: [migration/bertina-linux6]
    paths:
      - 'index.html'
      - 'fa/index.html'
      - 'en/index.html'
      - 'en/about/index.html'
      - 'en/academic-profile/index.html'
      - 'fa/darbare-man/index.html'
      - 'scripts/profilepage-schema-audit.mjs'
      - '.github/workflows/profilepage-structured-data.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ProfilePage JSON-LD typing and canonical identity
        run: node scripts/profilepage-schema-audit.mjs
