name: JHELA Native Editorial Readiness
on:
  push:
    branches: [migration/bertina-linux6]
    paths: ['scripts/jhela-ojs-*', 'tests/jhela-ojs-trusted-tls.test.mjs', 'scripts/jhela-editorial-policy-contract-audit.mjs', 'assets/css/jhela-ojs-theme.css', 'assets/css/journal-v2.css', 'journal/**', 'assets/images/jhela/**', 'assets/media-registry.json', 'identity/templates/jhela-*', 'tests/jhela-brand-route-coverage.test.mjs', 'docs/journal/prototypes/**', 'tests/jhela-role-prototype.test.mjs', 'tests/jhela-role-showroom-packaged.test.mjs', 'platform/jhela-unified-brand-v3.json', 'identity/jhela-document.css', 'tests/jhela-unified-design.test.mjs', 'docs/journal/JHELA_UNIFIED_DESIGN_MASTER_V3_20261016.md', 'assets/css/operations-jhela-workstream.css', 'assets/css/jhela-roadmap.css', 'platform/jhela-target-architecture-v1.json', 'platform/jhela-gate-evidence-ledger-v1.json', 'scripts/jhela-evidence-ledger-audit.mjs', 'api/operations-jhela.php', 'api/operations.php', 'assets/js/operations-jhela-maturity.js', 'scripts/build-public-site.mjs', 'tests/jhela-maturity-api.test.mjs', 'tests/jhela-operations-snapshot.php', 'tests/jhela-packaged-admin-projection.test.mjs', 'tests/jhela-operations-packaged-snapshot.php', 'tests/jhela-evidence-ledger.test.mjs', 'tests/jhela-maturity-api.test.mjs', 'docs/journal/JHELA_FUTURE_SCALE_ARCHITECTURE_ADR_20261016.md', 'tests/jhela-target-architecture.test.mjs', 'journal/roadmap/index.html', 'journal/fa/roadmap/index.html', 'journal/sitemap.xml', 'scripts/jhela-discovery-audit.mjs', 'tests/jhela-international-roadmap.test.mjs', 'platform/jhela-international-roadmap-v1.json', 'assets/js/operations-jhela-workstream.js', 'fa/app/admin/index.html', 'en/account/admin/index.html', 'tests/jhela-admin-workstream.test.mjs', 'platform/jhela-ojs-role-policy-v1.json', 'docs/journal/JHELA_OJS_REVIEW_FORM_V1.md', 'docs/journal/JHELA_OJS_EDITORIAL_MESSAGES_V1.md', 'assets/images/jhela/wordmark-en*.svg', 'journal/fees/index.html', 'journal/fa/fees/index.html', 'journal/index.html', 'journal/dashboard/index.html', 'journal/author-guidelines/index.html', 'journal/fa/author-guidelines/index.html', 'assets/js/jhela-author-readiness.js', 'tests/jhela-author-readiness.test.mjs', 'tests/jhela-ojs-installer-check.py', 'platform/jhela-article-metadata-quality-policy-v1.json', 'scripts/jhela-article-metadata-audit.mjs', 'tests/jhela-article-metadata.test.mjs', 'platform/jhela-ojs-activation.json', 'api/jhela-intake.php', 'assets/js/jhela-author-workspace.js', 'assets/js/operations-jhela-reviewers.js', 'assets/css/jhela-intake.css', 'database/unified/004c_jhela_founding_intake.sql', 'tests/jhela-founding-intake.test.mjs', 'platform/jhela-ojs-editorial-workflow-v1.json', 'docs/governance/JHELA_OJS_INSTALLATION_RUNBOOK_20261012.md', '.github/workflows/jhela-ojs-readiness.yml']
  pull_request:
    branches: [migration/bertina-linux6]
    paths: ['journal/**', 'assets/images/jhela/**', 'assets/media-registry.json', 'identity/templates/jhela-*', 'tests/jhela-brand-route-coverage.test.mjs', 'scripts/jhela-ojs-*', 'tests/jhela-ojs-trusted-tls.test.mjs', 'tests/jhela-ojs-installer-check.py', 'platform/jhela-ojs-activation.json', 'platform/jhela-article-metadata-quality-policy-v1.json', 'scripts/jhela-article-metadata-audit.mjs', 'tests/jhela-article-metadata.test.mjs', 'docs/journal/JHELA_OJS_METADATA_PRODUCTION_QA_20261016.md', '.github/workflows/jhela-ojs-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jhela-ojs-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prelaunch-source-safety:
    name: Independent JHELA editorial privacy and source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, xml, dom, fileinfo, openssl, gd, intl, curl, zip
          coverage: none
      - name: Syntax and isolated journal source gates
        run: |
          php -l api/operations-jhela.php
          php -l api/jhela-intake.php
          php -l api/index.php
          php -l api/operations.php
          php -l tests/jhela-operations-snapshot.php
          php tests/jhela-operations-snapshot.php
          node scripts/jhela-discovery-audit.mjs
          node scripts/jhela-editorial-policy-contract-audit.mjs
          node scripts/jhela-evidence-ledger-audit.mjs
          node --check scripts/jhela-article-metadata-audit.mjs
          node scripts/jhela-article-metadata-audit.mjs --synthetic-contract
          node --check assets/js/operations-jhela-workstream.js
          node --check assets/js/jhela-author-readiness.js
          node --check assets/js/operations-jhela-maturity.js
          node --check assets/js/jhela-author-workspace.js
          node --check assets/js/operations-jhela-reviewers.js
          node --test tests/jhela-founding-intake.test.mjs
          node --test tests/jhela-admin-workstream.test.mjs tests/jhela-author-readiness.test.mjs tests/jhela-international-roadmap.test.mjs tests/jhela-target-architecture.test.mjs tests/jhela-evidence-ledger.test.mjs
          node --test tests/jhela-article-metadata.test.mjs
          node --test tests/jhela-unified-design.test.mjs tests/jhela-brand-route-coverage.test.mjs tests/jhela-role-prototype.test.mjs
      - name: Check protected published JHELA admin projection
        run: |
          node scripts/build-public-site.mjs
          node --test tests/jhela-packaged-admin-projection.test.mjs tests/jhela-role-showroom-packaged.test.mjs
          php -l tests/jhela-operations-packaged-snapshot.php
          php tests/jhela-operations-packaged-snapshot.php
      - name: Disclose evidence boundary
        run: |
          echo "JHELA independent editorial source checks passed for ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "No manuscript receipt, review, payment or production migration is proven by source checks. Independent live server evidence remains mandatory." >> "$GITHUB_STEP_SUMMARY"
