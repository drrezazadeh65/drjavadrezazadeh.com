name: Google Search Console Connection Test

# Existing WIF and service-account integration. Strictly nondeploying and read-only.
# Scope is a single trusted repository/ref; push runs only for this integration.
on:
  workflow_dispatch:
    inputs:
      indexation_triage:
        description: 'Optional bounded Google URL Inspection sample (no URL-level logs)'
        type: boolean
        required: false
        default: false
      sample_size:
        description: 'Maximum number of source-verified public URLs to inspect'
        type: choice
        required: false
        default: '54'
        options: ['24', '54', '90']
  push:
    branches: [migration/bertina-linux6]
    paths:
      - .github/workflows/google-search-console-sync.yml
      - scripts/gsc_oidc_verify.py
      - tests/test_gsc_oidc_connection.py
      - scripts/gsc_readonly_probes.py
      - scripts/gsc_indexation_triage.py
      - tests/test_gsc_indexation_triage.py
      - tests/test_gsc_readonly_probes.py
      - scripts/gsc_direct_snapshot_contract.py
      - tests/test_gsc_direct_snapshot_contract.py
      - scripts/ga4_oidc_verify.py
      - tests/test_ga4_oidc_connection.py
      - api/operations-gsc-direct.php
      - api/operations.php
      - tests/operations-gsc-direct.php
      - tests/operations-mysql.php
      - assets/js/operations-gsc-direct.js
      - assets/js/operations-workspace-index-v1.js
      - tests/gsc-direct-owner-panel-contract.test.mjs
      - tests/operations-workspace-index-contract.test.mjs
      - fa/app/admin/index.html
      - en/account/admin/index.html

permissions:
  contents: read

concurrency:
  group: gsc-oidc-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-search-console:
    name: Verify Google Search Console API (read-only OIDC)
    if: github.repository == 'drrezazadeh65/drjavadrezazadeh.com' && github.ref == 'refs/heads/migration/bertina-linux6'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout verified repository ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run keyless API verifier contract tests
        run: |
          python3 -m py_compile scripts/gsc_oidc_verify.py scripts/gsc_readonly_probes.py scripts/gsc_indexation_triage.py scripts/gsc_direct_snapshot_contract.py
          python3 -m unittest discover -s tests -p 'test_gsc_oidc_connection.py' -v
          python3 -m unittest discover -s tests -p 'test_gsc_readonly_probes.py' -v
          python3 -m unittest discover -s tests -p 'test_gsc_indexation_triage.py' -v
          python3 -m unittest discover -s tests -p 'test_gsc_direct_snapshot_contract.py' -v
          echo "GSC test fixture uses synthetic responses; not real Google access."

      - name: Verify GSC private owner panel contracts without external data
        run: |
          php -l api/operations-gsc-direct.php
          php -l api/operations.php
          php tests/operations-gsc-direct.php
          node --test tests/gsc-direct-owner-panel-contract.test.mjs tests/operations-workspace-index-contract.test.mjs

      - name: Authenticate with Google Cloud via GitHub OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: jr-search-intelligence
          workload_identity_provider: projects/301218972490/locations/global/workloadIdentityPools/jr-github-actions/providers/github-actions
          service_account: jr-search-console-reader@jr-search-intelligence.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false

      - name: Confirm exact URL-prefix property and historical Search Analytics
        env:
          GSC_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 scripts/gsc_oidc_verify.py

      - name: Verify direct Sitemap and URL Inspection API access (read-only)
        env:
          GSC_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 scripts/gsc_readonly_probes.py

      - name: Optional owner-run public URL indexation triage (read-only)
        if: github.event_name == 'workflow_dispatch' && github.actor == 'drrezazadeh65' && inputs.indexation_triage == true
        env:
          GSC_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GSC_TRIAGE_LIMIT: ${{ inputs.sample_size }}
        run: python3 scripts/gsc_indexation_triage.py
      - name: State remaining external IAM evidence requirement
        if: always()
        run: |
          echo "### OIDC trust-boundary qualification" >> "$GITHUB_STEP_SUMMARY"
          echo "This job requires the approved GitHub repository and migration/bertina-linux6 ref." >> "$GITHUB_STEP_SUMMARY"
          echo "A successful Google STS/impersonation/API call validates this run's authorized path, not the complete Google Cloud CEL attribute condition or every IAM binding." >> "$GITHUB_STEP_SUMMARY"
          echo "Review provider mapping, CEL condition, and service-account get-iam-policy with a Google Cloud owner before certifying exclusion of other identities." >> "$GITHUB_STEP_SUMMARY"
          echo "No tokens, raw queries, user records, secret key files, production deployments or database mutations are retained." >> "$GITHUB_STEP_SUMMARY"

  verify-ga4:
    name: Verify GA4 Data API (read-only OIDC; nondeploying)
    if: github.repository == 'drrezazadeh65/drjavadrezazadeh.com' && github.ref == 'refs/heads/migration/bertina-linux6'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout approved repository ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify GA4 offline security contracts
        run: |
          python3 -m py_compile scripts/ga4_oidc_verify.py
          python3 -m unittest discover -s tests -p 'test_ga4_oidc_connection.py' -v
          echo "GA4 offline fixtures are synthetic and not evidence of live Google access."
      - name: Authenticate Google service account with OIDC
        id: ga4_auth
        uses: google-github-actions/auth@v2
        with:
          project_id: jr-search-intelligence
          workload_identity_provider: projects/301218972490/locations/global/workloadIdentityPools/jr-github-actions/providers/github-actions
          service_account: jr-search-console-reader@jr-search-intelligence.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Probe real GA4 property metadata and runReport
        env:
          GA4_ACCESS_TOKEN: ${{ steps.ga4_auth.outputs.access_token }}
        run: python3 scripts/ga4_oidc_verify.py
      - name: GA4 interpretation and privilege caveat
        if: always()
        run: |
          echo "### Google Analytics read-only trust boundary" >> "$GITHUB_STEP_SUMMARY"
          echo "A successful API request establishes read access, not tag installation, traffic collection or container publication." >> "$GITHUB_STEP_SUMMARY"
          echo "Service-account GA4 Administrator is owner-approved and may later be reduced to Viewer after confirming equivalent reads." >> "$GITHUB_STEP_SUMMARY"
          echo "No API token, Google response row, user identifier, secret or production deployment is persisted." >> "$GITHUB_STEP_SUMMARY"
