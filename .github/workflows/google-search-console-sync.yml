name: Google Search Console Connection Test

# Existing WIF and service-account integration. Strictly nondeploying and read-only.
# Scope is a single trusted repository/ref; push runs only for this integration.
on:
  workflow_dispatch:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - .github/workflows/google-search-console-sync.yml
      - scripts/gsc_oidc_verify.py
      - tests/test_gsc_oidc_connection.py
      - scripts/gsc_readonly_probes.py
      - tests/test_gsc_readonly_probes.py

permissions:
  contents: read

concurrency:
  group: gsc-oidc-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-search-console:
    name: Verify Google Search Console API (read-only OIDC)
    if: github.repository == 'drrezazadeh65/drjavadrezazadeh.com' && github.ref == 'refs/heads/migration/bertina-linux6'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout verified repository ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run keyless API verifier contract tests
        run: |
          python3 -m py_compile scripts/gsc_oidc_verify.py scripts/gsc_readonly_probes.py
          python3 -m unittest discover -s tests -p 'test_gsc_oidc_connection.py' -v
          python3 -m unittest discover -s tests -p 'test_gsc_readonly_probes.py' -v
          echo "GSC test fixture uses synthetic responses; not real Google access."

      - name: Authenticate with Google Cloud via GitHub OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: jr-search-intelligence
          workload_identity_provider: projects/301218972490/locations/global/workloadIdentityPools/jr-github-actions/providers/github-actions
          service_account: jr-search-console-reader@jr-search-intelligence.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false

      - name: Confirm exact URL-prefix property and historical Search Analytics
        env:
          GSC_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 scripts/gsc_oidc_verify.py

      - name: Verify direct Sitemap and URL Inspection API access (read-only)
        env:
          GSC_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 scripts/gsc_readonly_probes.py

      - name: State remaining external IAM evidence requirement
        if: always()
        run: |
          echo "### OIDC trust-boundary qualification" >> "$GITHUB_STEP_SUMMARY"
          echo "This job requires the approved GitHub repository and migration/bertina-linux6 ref." >> "$GITHUB_STEP_SUMMARY"
          echo "A successful Google STS/impersonation/API call validates this run's authorized path, not the complete Google Cloud CEL attribute condition or every IAM binding." >> "$GITHUB_STEP_SUMMARY"
          echo "Review provider mapping, CEL condition, and service-account get-iam-policy with a Google Cloud owner before certifying exclusion of other identities." >> "$GITHUB_STEP_SUMMARY"
          echo "No tokens, raw queries, user records, secret key files, production deployments or database mutations are retained." >> "$GITHUB_STEP_SUMMARY"
