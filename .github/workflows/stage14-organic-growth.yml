name: Stage 14 Organic Growth Contracts
on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - 'platform/organic-growth-stage14.json'
      - 'platform/organic-growth-revenue*.mjs'
      - 'platform/conversion-event-contract.json'
      - 'platform/analytics-config.json'
      - 'assets/data/**'
      - 'assets/js/free-growth-tools.js'
      - 'assets/js/organic-sharing.js'
      - 'assets/css/free-growth-tools.css'
      - 'fa/akhbar/**'
      - 'fa/khadamat/index.html'
      - 'fa/darkhast-moshavere/index.html'
      - 'fa/app/admin/index.html'
      - 'en/account/admin/index.html'
      - 'api/index.php'
      - 'api/operations.php'
      - 'api/growth-stage14.php'
      - 'docs/BERTINA_ORGANIC_GROWTH_SCHEMA.sql'
      - 'scripts/stage14-lead-retention.php'
      - 'assets/js/consented-lead-intake.js'
      - 'assets/js/operations-growth.js'
      - 'tests/stage14-growth-privacy.test.mjs'
      - 'scripts/stage14-organic-growth-audit.mjs'
      - 'assets/js/revenue-planner-model.mjs'
      - 'assets/js/operations-revenue-planner.mjs'
      - 'assets/css/operations-revenue-planner.css'
      - 'tests/revenue-planner-model.test.mjs'
      - 'scripts/revenue-planner-contract-audit.mjs'
      - '.github/workflows/stage14-organic-growth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/free-growth-tools.js
      - run: node --check assets/js/organic-sharing.js
      - run: node --check platform/organic-growth-revenue.mjs
      - run: node --check assets/js/consented-lead-intake.js
      - run: node --check assets/js/operations-growth.js
      - run: php -l api/growth-stage14.php
      - run: php -l api/index.php
      - run: php -l api/operations.php
      - run: php -l scripts/stage14-lead-retention.php
      - run: node scripts/stage14-organic-growth-audit.mjs
      - run: node --test platform/organic-growth-revenue.test.mjs
      - run: node --check assets/js/revenue-planner-model.mjs
      - run: node --check assets/js/operations-revenue-planner.mjs
      - run: node scripts/revenue-planner-contract-audit.mjs
      - run: node --test tests/revenue-planner-model.test.mjs
      - run: node --test tests/stage14-growth-privacy.test.mjs
