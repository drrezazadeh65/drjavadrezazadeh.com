name: Historical Authority Live Verify

# Post-deploy verification runs inside deploy-bertina.yml at its exact release SHA.
# A migration-only workflow cannot rely on workflow_run/workflow_dispatch discovery
# while the older main branch remains GitHub's default. No live checks on PRs/pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/migration/bertina-linux6'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify registered historical URLs with trusted public TLS
        run: node scripts/historical-authority-live-verify.mjs /tmp/historical-authority-live.json
      - name: Retain strict verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-authority-strict-live
          path: /tmp/historical-authority-live.json
          if-no-files-found: ignore
          retention-days: 14
