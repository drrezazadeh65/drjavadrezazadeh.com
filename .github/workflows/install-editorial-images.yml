name: Install 10 Academic Editorial Images

on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - 'work/academic_articles_10_original_webp_20261011.zip'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approved-editorial-image-install
  cancel-in-progress: false

jobs:
  validate-install-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PW_TEST_SCREENSHOT_NO_FONTS_READY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact approved archive and trusted installer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          zip_path=pathlib.Path('work/academic_articles_10_original_webp_20261011.zip')
          if not zip_path.is_file():
              raise SystemExit('BLOCKED: upload approved ZIP to work/ first.')
          if hashlib.sha256(zip_path.read_bytes()).hexdigest()!='01c3fb620c303abc79407af973a6610a9c22a795fdb7ae01ecd6656c10e2d479':
              raise SystemExit('BLOCKED: ZIP checksum does not match owner-approved package.')
          dest=pathlib.Path('/tmp/approved-editorial-package')
          dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(zip_path) as z:
              manifest=json.loads(z.read('manifest.json'))['images']
              if len(manifest)!=10 or len({x['article_slug'] for x in manifest})!=10:
                  raise SystemExit('BLOCKED: expected ten unique article media records.')
              filenames={'INSTALL.md','manifest.json','publish_approved_editorial_images.py'}
              for media in manifest:
                  name='assets/images/editorial-launch/'+media['featured_image']
                  filenames.add(name)
                  if (media['width'],media['height'])!=(1672,941) or media['mime_type']!='image/webp':
                      raise SystemExit('BLOCKED: unexpected media dimensions or MIME type')
                  if hashlib.sha256(z.read(name)).hexdigest()!=media['sha256']:
                      raise SystemExit('BLOCKED: invalid media digest '+name)
              if set(z.namelist())!=filenames:
                  raise SystemExit('BLOCKED: unapproved files or missing entries in archive')
              installer=z.read('publish_approved_editorial_images.py')
              if hashlib.sha256(installer).hexdigest()!='62d5a27e8cfd979165728aa254b03e8480c9e73ea1104793a419b6c4b55e1d35':
                  raise SystemExit('BLOCKED: unapproved installer')
              for name in sorted(filenames):
                  target=dest/name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(name))
          print('Verified approved 10-image package, all SHA-256 hashes and exact installer.')
          PY

      - name: Apply approved editorial images
        run: |
          python3 /tmp/approved-editorial-package/publish_approved_editorial_images.py --repo "$PWD" --apply
          node scripts/media-library-audit.mjs
          node scripts/audit-13-articles.mjs
          node scripts/seo-regression.mjs
          node scripts/link-integrity-audit.mjs
          node scripts/design-regression.mjs
          node scripts/responsive-resilience-audit.mjs
          node scripts/build-public-data.mjs --check
          node scripts/build-public-site.mjs
          test ! -e .public-site/work
          test ! -e .public-site/assets/media-registry.json

      - name: Inspect responsive editorial layout in Chromium
        run: |
          npm install --no-save @playwright/test@1.56.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/editorial-site.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/editorial-13-responsive.spec.js --workers=1 --reporter=line

      - name: Package validated files for reviewed installation
        run: |
          set -euo pipefail
          mkdir -p /tmp/editorial-release
          cp -a assets/images/editorial-launch /tmp/editorial-release/
          cp assets/media-registry.json /tmp/editorial-release/media-registry.json
          cp -a fa/akhbar /tmp/editorial-release/akhbar
          git diff -- fa/akhbar/ assets/media-registry.json > /tmp/editorial-release/editorial-changes.patch
          echo 'Approval gate: automated source writing and deployment are prohibited by the repository governance policy.' > /tmp/editorial-release/REVIEW-FIRST.txt
          echo 'Install the verified package using Codex or a reviewed PR, run checks, then manually initiate Bertina deployment.' >> /tmp/editorial-release/REVIEW-FIRST.txt

      - name: Upload editorial reviewed-install artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verified-editorial-image-install
          path: /tmp/editorial-release
          retention-days: 30
          if-no-files-found: error

      - name: Report approval required
        run: |
          echo 'Approved ten-image package verified and tested, but repository policy forbids Actions from pushing source or deploying automatically.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Retrieve verified-editorial-image-install artifact for reviewed installation and manual production release.' >> "$GITHUB_STEP_SUMMARY"
