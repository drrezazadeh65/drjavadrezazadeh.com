name: DrJavad v5.1.0 First Usable Nondeploying Candidate

on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - '.github/workflows/v5-release-candidate.yml'
      - '.github/workflows/bertina-migration-preflight.yml'
      - '.github/workflows/jhela-bilingual-quality.yml'
      - 'index.html'
      - '.github/workflows/stage14-organic-growth.yml'
      - 'scripts/build-public-site.mjs'
      - 'scripts/build-public-data.mjs'
      - 'scripts/schema-entity-inventory.mjs'
      - 'scripts/stamp-bertina-release.mjs'
      - 'scripts/v5-ecosystem-integrity-audit.mjs'
      - 'scripts/production-health-audit.mjs'
      - '.github/workflows/production-health-monitor.yml'
      - 'scripts/production-operational-pulse.mjs'
      - 'scripts/service-private-custody-preflight.php'
      - 'scripts/bertina-auto-release-policy.mjs'
      - 'scripts/bertina-release-eligibility.mjs'
      - 'scripts/bertina-phased-release-gate.mjs'
      - '.github/workflows/deploy-bertina.yml'
      - 'scripts/bertina-controlled-cpanel-gate.php'
      - 'tests/bertina-controlled-cpanel-gate.php'
      - 'tests/bertina-release-assembly.py'
      - 'api/**'
      - 'assets/**'
      - 'fa/**'
      - 'en/**'
      - 'journal/**'
      - 'platform/**'
      - 'database/unified/**'
      - 'docs/migrations/**'
      - 'tests/**'
      - 'sitemap*.xml'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drjavad-v5-rc
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-password
          MYSQL_DATABASE: operations_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      OPERATIONS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=operations_fixture;charset=utf8mb4
      OPERATIONS_TEST_USER: root
      OPERATIONS_TEST_PASSWORD: fixture-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile production release endpoint; protect owner/private gates
        run: |
          python3 tests/bertina-release-assembly.py
          php tests/bertina-private-recovery-gate.php
          php tests/bertina-controlled-cpanel-gate.php
          python3 tests/test_bertina_commerce_migration_guard.py
      - name: Validate source governance and all v5 workstreams
        run: |
          node scripts/v5-ecosystem-integrity-audit.mjs
          node scripts/v5-1-usable-release-audit.mjs
          node tests/jr-ecosystem-visual-contract.mjs
          node --check assets/js/consented-lead-intake.js
          node --check assets/js/customer-consultation-leads.js
          node --check assets/js/customer-dashboard.js
          node --test tests/service-locale-contract.test.mjs tests/scientific-bilingual-contract.test.mjs tests/scientific-continuity-contract.test.mjs
          node --test tests/paid-service-gateway-contract.test.mjs
          node --test tests/services-visual-atlas-contract.test.mjs tests/service-delivery-evidence-contract.test.mjs
          node --test tests/service-bilingual-commerce-contract.test.mjs
          node --test tests/bertina-live-service-route-contract.test.mjs
          node --test tests/service-intake-security-contract.test.mjs tests/service-private-files-contract.test.mjs tests/service-buyer-receipt-contract.test.mjs tests/service-completed-queue-contract.test.mjs tests/service-private-custody-preflight-contract.test.mjs
          node --test tests/bertina-phmyadmin-schema-context-contract.test.mjs
          node --test tests/masterplan-100-release-gate.test.mjs
          node --check scripts/bertina-phased-release-gate.mjs
          node --test tests/bertina-phased-release-gate.test.mjs
          node --test tests/masterplan-evidence-reuse-audit.test.mjs
          node scripts/masterplan-evidence-reuse-audit.mjs --output .artifacts/masterplan-existing-work-reuse.json
          node --check assets/js/commerce-checkout-en.js
          node --check assets/js/jr-choice-studio-v1.js
          node --test tests/choice-studio-contract.test.mjs
          node --test tests/choice-feedback-contract.test.mjs
          node --test tests/v52-integrated-science-choice-release-contract.test.mjs
          node --test tests/v52-science-navigation-contract.test.mjs
          node --check assets/js/jr-service-navigator-v1.js
          node --test tests/service-navigator-contract.test.mjs
          node --check assets/js/operations-commerce.js
          node --check assets/js/account-order-history.js
          node --check assets/js/book-store.js
          node --test tests/bookstore-cover-gallery-contract.test.mjs
          node --check assets/js/operations-workspace-index-v1.js
          node --test tests/operations-workspace-index-contract.test.mjs
          node --test tests/ai-search-visibility-contract.test.mjs
          node --test tests/customer-journey-actions-contract.test.mjs
          node --test tests/customer-next-action-contract.test.mjs tests/customer-appointment-next-action-contract.test.mjs
          node --test tests/account-journey-rail-contract.test.mjs
          node --test tests/order-evidence-contract.test.mjs
          node --test tests/revenue-focus-contract.test.mjs
          node --check assets/js/commerce-checkout.js
          node --check assets/js/donation-payment.js
          node --check assets/js/institutional-brief-builder.mjs
          node --test tests/institutional-conversion.test.mjs
          node --test tests/stage14-growth-privacy.test.mjs tests/revenue-planner-model.test.mjs
          node scripts/stage14-organic-growth-audit.mjs
          node scripts/revenue-planner-contract-audit.mjs
          node scripts/workflow-governance-audit.mjs
          node scripts/seo-regression.mjs
          node --test tests/publications-entity-graph.test.mjs tests/schema-entity-inventory.test.mjs tests/bilingual-service-entity-identity.test.mjs
          node scripts/schema-entity-inventory.mjs --strict-publications
          node --test tests/production-health-evidence.test.mjs
          node --check scripts/bertina-auto-release-policy.mjs
          node --check scripts/bertina-release-eligibility.mjs
          node --test tests/bertina-auto-release-policy.test.mjs tests/bertina-release-eligibility.test.mjs
      - name: JR Future Publishing contract, ledger and author privacy checks (nondeploying)
        run: |
          php -l api/publishing.php
          php -l api/publishing-onboarding.php
          php -l api/internal/jr-publishing-allocations.php
          php -l api/internal/jr-publishing-allocation-policy.php
          php -l api/internal/jr-publishing-policy-70-30-cli.php
          php -l api/internal/jr-publishing-notifications.php
          php -l api/internal/jr-publishing-contract-draft.php
          php -l api/internal/jr-publishing-digital.php
          php -l api/internal/jr-publishing-mailer.php
          php -l api/internal/jr-publishing-mail-worker.php
          php -l api/internal/jr-publishing-provision-cli.php
          php -l api/internal/jr-publishing-activate-existing-cli.php
          php -l api/internal/jr-publishing-preflight-cli.php
          php -l api/internal/jr-publishing-private-install-cli.php
          php -l api/commerce-stage9.php
          php tests/jr-publishing-allocations.php
          php tests/jr-publishing-policy-snapshot.php
          php tests/jr-publishing-contract-preview.php
          php tests/jr-publishing-author-email.php
          php -l tests/jr-publishing-mysql-fixture.php
          node --check assets/js/jr-author-workspace-v1.js
          node --check assets/js/jr-author-onboarding-v1.js
          node --check assets/js/operations-publishing-authors-v1.js
          node --check assets/js/jr-publishing-checkout-v1.js
          node --test tests/jr-publishing-release-policy.test.mjs tests/jr-publishing-digital-payment-guard.test.mjs tests/jr-publishing-private-installer.test.mjs
          node --test tests/jr-publishing-owner-20261020-contract.test.mjs
          node --test tests/merged-master-publishing-release-contract.test.mjs
          node --test tests/jr-publishing-author-onboarding.test.mjs
          node --test tests/v52-author-dashboard-contract.test.mjs
          node --test tests/v52-bilingual-author-product.test.mjs
          node --test tests/gateway-premium-v52.test.mjs
          node --test tests/v52-publishing-checkout-runtime.test.mjs tests/v52-publishing-asset-integrity.test.mjs
          node --test tests/v52-unified-release-contract.test.mjs
          node --test tests/v52-author-visual-evolution.test.mjs
          node --check assets/js/jr-author-portrait-v52.js
          node --test tests/v52-author-resume-portrait.test.mjs
          echo 'Publishing stage remains prelaunch. This is SOURCE evidence, not permission to take payments or deploy.'
      - name: Preserve existing 41-gate and 21-service evidence pointers (NO approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterplan-existing-work-reuse
          path: .artifacts/masterplan-existing-work-reuse.json
          if-no-files-found: warn
          retention-days: 14
      - name: Archive bilingual structured-data source inventory (nonproduction evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structured-data-inventory-source
          path: .artifacts/schema-entity-inventory.json
          if-no-files-found: warn
          retention-days: 14
      - name: Exercise EXACT full deployment API and MySQL preflight before any FTP release
        env:
          OPERATIONS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=operations_fixture;charset=utf8mb4
          OPERATIONS_TEST_USER: root
          OPERATIONS_TEST_PASSWORD: fixture-password
        run: |
          set -euo pipefail
          node scripts/operations-registry-audit.mjs
          python3 scripts/operations-canonical-registry.py api/internal/operations-registry.json --validate-only --identity-manifest api/internal/operations-action-identities-v1.json
          python3 tests/operations-canonical-registry.py
          php tests/operations-reporting.php
          php tests/operations-ai-visibility.php
          for file in api/*.php; do php -l "$file"; done
          php tests/bertina-smtp-body-contract.php
          php tests/bertina-service-buyer-contact.php
          node --check assets/js/commerce-checkout.js
          node tests/bertina-service-contact-checkout.mjs
          # Scientific engines: only synthetic fixture checks, never live learner records.
          node --check platform/bahar-engine.mjs
          node --check platform/bahar-persistence.mjs
          node --check assets/js/bahar-readiness.js
          node platform/bahar-engine.test.mjs
          node platform/rcas-evidence-bridge.test.mjs
          node platform/ecosystem-journey-orchestrator.test.mjs
          node platform/module-governance.test.mjs
          node platform/bahar-persistence.test.mjs
          node platform/golden-talent-book-crosswalk.test.mjs
          php tests/golden-talent-guardian.php
          php tests/bahar-bertina-schema.php
          php tests/bahar-guardian-mysql.php
          node --check assets/js/bahar-guardian-overview.js
          php tests/operations-security.php
          php tests/operations-mysql.php
          # Fail immediately on PHP parser regressions in newly integrated private custody.
          php -l api/index.php
          php -l api/operations.php
          php -l api/service-files.php
          php -l api/service-buyer-receipt.php
          php -l api/operations-service-delivery.php
          php -l tests/commerce-service-advance-mysql.php
          php -l tests/service-private-files-crypto.php
          # Paid-claim, buyer preference and owner-controlled appointment gate.
          php tests/service-private-files-crypto.php
          php tests/commerce-service-advance-mysql.php
          php tests/consultation-preference-mysql.php
          node --check assets/js/operations-social.js
          node --check assets/js/operations-social-composer.js
          node --test platform/social-distribution/*.test.mjs
          # Only isolated CI MySQL 8. Never connect to the live Bertina database.
          php -r '$pdo=new PDO("mysql:host=127.0.0.1;port=3306;dbname=operations_fixture;charset=utf8mb4","root","fixture-password"); $pdo->exec("CREATE DATABASE IF NOT EXISTS social_fixture CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          SOCIAL_TEST_DSN='mysql:host=127.0.0.1;port=3306;dbname=social_fixture;charset=utf8mb4' SOCIAL_TEST_USER=root SOCIAL_TEST_PASSWORD=fixture-password php tests/social-queue-mysql.php
          php tests/bertina-receipt-access.php
          php tests/bertina-receipt-contract.php
          php tests/bertina-commerce-callback-contract.php
          php tests/bertina-commerce-mysql-contract.php
          # Isolated, disposable publishing_fixture schema; no BitPay/SMTP calls.
          php tests/jr-publishing-mysql-fixture.php
          php tests/bertina-donations-mysql-contract.php
          php tests/jrei-iran-night-acquisition.php
          php tests/bertina-student-support-contract.php
          php -l scripts/service-private-custody-preflight.php
          php -l scripts/journal-ojs-preflight.php
          php -l tests/journal-ojs-preflight.php
          php tests/journal-ojs-preflight.php
      - name: Summary of test scope
        run: |
          echo 'PASS means isolated CI only. No real Bertina migration, payment, email, physical stock or OJS intake.'
          echo 'Controlled cPanel custody does not establish independent isolated restore; exact owner and target SHA required on manual deployment.'
          echo 'DO NOT treat this job as recovery sign-off or permission to bypass any production gate.'

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium and Playwright
        run: |
          npm install --no-save @playwright/test@1.56.0
          # Ubuntu GitHub runners already carry Chromium runtime libraries (as
          # demonstrated by full-route visual and responsive QA on this branch).
          # Avoid slow apt/systemd changes in an owner-authorized release.
          npx playwright install chromium
      - name: Verify bilingual owner dashboard and bookstore flows
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/v5-rc-browser-server.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/gateway-premium-v52.browser.spec.js tests/customer-dashboard-browser.spec.js tests/customer-journey-actions.browser.spec.js tests/customer-next-action.browser.spec.js tests/customer-appointment-next-action.browser.spec.js tests/order-evidence.browser.spec.js tests/revenue-focus.browser.spec.js tests/scientific-continuity.browser.spec.js tests/v52-science-navigation.browser.spec.js tests/account-journey-rail.browser.spec.js tests/operations-browser.spec.js tests/operations-workspace-index.browser.spec.js tests/operations-reporting-browser.spec.js tests/jrei-exams-candidate-recovery.browser.spec.js tests/bookstore-checkout-browser.spec.js tests/bookstore-cover-gallery.browser.spec.js tests/service-request-summary.spec.js tests/institutional-conversion.spec.js tests/rcas-start-browser.spec.js tests/choice-studio-browser.spec.js tests/choice-feedback.browser.spec.js tests/service-navigator-browser.spec.js tests/rcas-english-browser.spec.js tests/donation-payment-browser.spec.js tests/bahar-readiness-browser.spec.js tests/bahar-guardian-browser.spec.js --reporter=line
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v5-rc-browser-failures
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  candidate:
    needs: [contracts, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble the sanitized owner-review candidate (NO FTP or live writes)
        run: |
          set -euo pipefail
          node scripts/build-public-data.mjs --check
          node scripts/build-public-site.mjs
          node --test tests/jrei-news-private-release.test.mjs
          test -f .public-site/assets/data/service-descriptions-en.json
          cmp -s assets/data/service-descriptions-en.json .public-site/assets/data/service-descriptions-en.json
          node scripts/bookstore-release-audit.mjs
          node scripts/public-retired-commerce-audit.mjs
          node scripts/stamp-bertina-release.mjs
          test -f .public-site/.htaccess
          test -f .public-site/assets/css/gateway-premium-v52.css
          grep -F 'gateway-premium-v52.css?v=20261020-v1' .public-site/index.html
          test -f .public-site/journal/sitemap.xml
          test ! -e .public-site/.bertina-backup-trigger
          test ! -e .public-site/.bertina-deploy-trigger
          test ! -e .public-site/platform
          test ! -e .public-site/scripts
          test ! -e .public-site/tests
          test ! -e .public-site/docs
          test ! -e .public-site/.github
          grep -F "jr-site-bertina-$GITHUB_SHA" .public-site/sw.js
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path('.public-site')
          names=sorted(x for x in root.rglob('*') if x.is_file())
          files={x.relative_to(root).as_posix():hashlib.sha256(x.read_bytes()).hexdigest() for x in names}
          assert len(files)>=500
          assert not any(path.startswith(('.github/','platform/','tests/','docs/','scripts/')) for path in files)
          assert '.bertina-backup-trigger' not in files
          archive=pathlib.Path('bertina-v5.1.0-rc.zip')
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for f in names:z.write(f,f.relative_to(root).as_posix())
          proof={
              'schema':'drjavad-v5-release-candidate-v1',
              'status':'SOURCE_ARTIFACT_ONLY_NOT_DEPLOYED',
              'versionTarget':'v5.1.0',
              'sourceSha':os.environ['GITHUB_SHA'],
              'runId':os.environ['GITHUB_RUN_ID'],
              'sanitizedFileCount':len(files),
              'zipSha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
              'sourceAndBrowserContractsPassed':True,
              'independentSignedBertinaRecoveryCertified':None,
              'stage09LiveSchemaCompatible':None,
              'currentLiveReleaseSha':None,
              'productionAcceptance':False,
              'archiveType':'review_candidate_not_final_production_bundle',
              'limitations':'No private operations-release evidence, Bertina upload, live MySQL migration, financial settlement, stock reconciliation or bank charge was performed.',
          }
          pathlib.Path('v5-rc-evidence.json').write_text(json.dumps(proof,indent=2)+'\n')
          print('Ready for owner/operator review: '+str(len(files))+' sanitized files, SHA256 '+proof['zipSha256'])
          PY
      - name: Upload immutable SHA-bound nonproduction candidate
        uses: actions/upload-artifact@v4
        with:
          name: bertina-v5.1.0-rc
          path: |
            bertina-v5.1.0-rc.zip
            v5-rc-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Explicit release boundary
        run: |
          echo 'Prepared v5.1.0 source candidate. NO FILES WERE UPLOADED TO BERTINA.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production requires signed owner-private restore gate AND live Stage09 schema preflight, followed by a fresh full deploy-run acceptance.' >> "$GITHUB_STEP_SUMMARY"

  public-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe current live release without cookies or credentials
        continue-on-error: true
        env:
          PROD_ORIGIN: https://drjavadrezazadeh.com
          PRODUCTION_HEALTH_STRICT: '0'
          PRODUCTION_HEALTH_EVIDENCE_PATH: v5-live-public-evidence.json
        run: node scripts/production-health-audit.mjs
      - name: Attach release-drift evidence to candidate run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-public-live-drift
          path: v5-live-public-evidence.json
          if-no-files-found: warn
          retention-days: 14
