name: Account Commerce Consistency
on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - 'fa/register/**'
      - 'en/register/**'
      - 'fa/login/**'
      - 'en/login/**'
      - 'register/**'
      - 'login/**'
      - 'fa/shop/**'
      - 'en/shop/**'
      - 'assets/js/book-store.js'
      - 'api/index.php'
      - 'assets/js/commerce-checkout.js'
      - 'assets/js/donation-payment.js'
      - 'fa/shop/payment-result/**'
      - 'tests/bertina-receipt-contract.php'
      - 'tests/bertina-receipt-access.php'
      - 'scripts/commerce-receipt-contract-audit.mjs'
      - 'tests/account-commerce-consistency.test.mjs'
      - 'tests/bertina-account-order-history.php'
      - 'api/commerce-stage9.php'
      - 'docs/migrations/20261012_stage09_commerce.sql'
      - 'tests/stage09-commerce-atomic.php'
      - 'assets/js/account-order-history.js'
      - 'assets/js/customer-dashboard.js'
      - 'fa/app/account/orders/index.html'
      - '.github/workflows/account-commerce-consistency.yml'
  pull_request:
    branches: [migration/bertina-linux6]
    paths:
      - 'api/index.php'
      - 'assets/js/commerce-checkout.js'
      - 'assets/js/donation-payment.js'
      - 'fa/shop/payment-result/**'
      - 'tests/bertina-receipt-contract.php'
      - 'tests/bertina-receipt-access.php'
      - 'scripts/commerce-receipt-contract-audit.mjs'
      - 'assets/js/book-store.js'
      - 'fa/register/**'
      - 'en/register/**'
      - 'fa/login/**'
      - 'en/login/**'
      - 'register/**'
      - 'login/**'
      - 'fa/shop/**'
      - 'en/shop/**'
      - 'tests/account-commerce-consistency.test.mjs'
      - 'tests/bertina-account-order-history.php'
      - 'api/commerce-stage9.php'
      - 'docs/migrations/20261012_stage09_commerce.sql'
      - 'tests/stage09-commerce-atomic.php'
      - 'assets/js/account-order-history.js'
      - 'assets/js/customer-dashboard.js'
      - 'fa/app/account/orders/index.html'
      - '.github/workflows/account-commerce-consistency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify account and shop links
        run: node --test tests/account-commerce-consistency.test.mjs
      - name: Verify same-origin receipt access and payment isolation
        run: |
          php -l api/index.php
          php tests/bertina-receipt-access.php
          php tests/bertina-receipt-contract.php
          php tests/bertina-account-order-history.php
          php -l api/commerce-stage9.php
          php -l tests/stage09-commerce-atomic.php
          php tests/stage09-commerce-atomic.php
          node --check assets/js/account-order-history.js
          node --check assets/js/customer-dashboard.js
          node scripts/commerce-receipt-contract-audit.mjs

