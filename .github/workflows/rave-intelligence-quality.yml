name: RAVE intelligence quality
on:
  pull_request:
    paths:
      - 'rave/intelligence/**'
      - '.github/workflows/rave-intelligence-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test rave/intelligence/metrics.test.mjs
