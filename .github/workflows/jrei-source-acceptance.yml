name: JREI source and twin-Windows acceptance (No Deployment)
on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - ".github/workflows/jrei-source-acceptance.yml"
      - ".github/workflows/v5-release-candidate.yml"
      - "platform/jrei-v5/**"
      - "assets/js/assistant.js"
      - "assets/js/site-extras.js"
      - "assets/js/site.js"
      - "platform/assistant-runtime-policy.json"
      - "assets/css/assistant.css"
      - "docs/governance/JREI_CHATGPT_CLASS_FUTURE_EXPERIENCE_STANDARD_20261024.md"
      - "api/jrei-*.php"
      - "api/operations-cron-dispatcher.php"
      - "api/internal/jrei-daily-learning-worker.php"
      - "assets/js/operations-jrei-*.js"
      - "assets/css/operations-jrei-*.css"
      - "fa/app/admin/index.html"
      - "en/account/admin/index.html"
      - "tests/jrei-*.test.mjs"
      - "tests/jrei*.test.mjs"
      - "tests/admin-session-persistence.test.mjs"
      - "api/operations.php"
      - "assets/js/operations-control.js"
      - "tests/jrei-*.php"
      - "tests/educational-intelligence-*.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jrei-source-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jrei-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all JREI v3 and v5 source tests; no HTTP or models
        run: |
          node --test tests/admin-session-persistence.test.mjs
          node --test \
            tests/educational-intelligence-*.test.mjs \
            tests/jrei-examination-testly-research.test.mjs \
            tests/jrei-v5-learning-loop.test.mjs \
            tests/jrei-v5-reviewed-retrieval-evaluator.test.mjs \
            tests/jrei-v5-two-windows-node-gates.test.mjs \
            tests/jrei-chat-experience.test.mjs \
            tests/jrei-local-first-bridge.test.mjs \
            tests/jrei-local-chat-worker-offline.test.mjs \
            tests/jrei-local-model-activation.test.mjs \
            tests/jrei-existing-worker-public-key.test.mjs \
            tests/jrei-local-doctor.test.mjs \
            tests/jrei-local-model-benchmark.test.mjs \
            tests/jrei-worker-error-code.test.mjs \
            tests/jrei-qwen-visible-answer.test.mjs \
            tests/jrei-node-a-local-artifacts.test.mjs \
            tests/jrei-local-quality-evidence.test.mjs \
            tests/jrei-local-quality-triage.test.mjs \
            tests/jrei-single-release-chat-readiness.test.mjs \
            tests/jrei-offline-self-introduction.test.mjs \
            tests/jrei-site-apprentice.test.mjs \
            tests/jrei-historical-development-backfill.test.mjs \
            tests/jrei-universal-public-chat-consent.test.mjs \
            tests/jrei-original-paid-exam-policy.test.mjs \
            tests/jrei-news-knowledge-learning-bridge.test.mjs \
            tests/jrei-four-track-official-exam-scout.test.mjs
      - name: Parse every Windows PowerShell AI launcher without executing commands
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem 'platform/jrei-v5/windows-worker' -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $issues = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$issues) | Out-Null
            if ($issues.Count -gt 0) {
              throw "Windows JREI source syntax unavailable: $($_.Name)"
            }
          }
      - name: Check JREI model worker syntax and model privacy firewall
        run: |
          set -euo pipefail
          for file in platform/jrei-v5/*.mjs platform/jrei-v5/windows-worker/*.mjs assets/js/operations-jrei-*.js; do
            node --check "$file"
          done
      - name: Check new source PHP and CLI syntax without executing it
        run: |
          set -euo pipefail
          for file in api/jrei-*.php api/internal/jrei-daily-learning-worker.php api/operations-cron-dispatcher.php api/internal/operations-master-dispatcher.php; do
            php -l "$file"
          done
      - name: Verify universal discovery and self-improvement offline PHP regressions
        run: |
          php tests/jrei-universal-discovery-offline.php
          php tests/jrei-universal-staging-offline.php
          php tests/jrei-docx-private-extraction-offline.php
          php tests/jrei-self-improvement-offline.php
          php tests/jrei-public-service-route-offline.php
          php tests/jrei-public-uncited-answer-offline.php
          php tests/jrei-local-chat-offline.php
          php tests/jrei-exam-scoring-offline.php
          php tests/jrei-cron-registry-separation-offline.php
      - name: Assert private worker is outbound and nothing is deployed
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('platform/jrei-v5/windows-worker/jrei-worker.mjs','utf8');if(!s.includes('redirect:\x27error\x27')||s.includes('createServer('))process.exit(1)"
          echo "Offline source-only tests. No Bertina, Windows, SMTP, MySQL, provider, model, deployment or live browser actions." >> "$GITHUB_STEP_SUMMARY"
