name: Bertina Master SEO Audit
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.ops_request != '' && format('Admin audit {0}', inputs.ops_request) || github.workflow }}

on:
  push:
    branches:
      - migration/bertina-linux6
  pull_request:
    branches:
      - migration/bertina-linux6
  workflow_dispatch:
    inputs:
      ops_request:
        description: 'Optional owner audit request correlation (not a credential)'
        required: false
        type: string
permissions:
  contents: read

# audit-run: 2026-10-10T15:45:00Z

concurrency:
  group: bertina-master-seo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run complete source SEO quality matrix
        run: |
          set +e
          failed=0
          failed_labels=()
          run_audit() {
            echo
            echo "===== $1 ====="
            label="$1"
            shift
            "$@"
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "::error::FAILED: $label (exit $code)"
              failed_labels+=("$label")
              failed=1
            else
              echo "PASS"
            fi
          }
          run_audit "Public data projection" node scripts/build-public-data.mjs --check
          run_audit "SEO/GEO regression" node scripts/seo-regression.mjs
          run_audit "JHELA independent journal discovery" node scripts/jhela-discovery-audit.mjs
          run_audit "JHELA bilingual journal release" node scripts/jhela-release-audit.mjs
          run_audit "Design regression" node scripts/design-regression.mjs
          run_audit "Responsive resilience" node scripts/responsive-resilience-audit.mjs
          run_audit "Frontend copy hygiene" node scripts/frontend-copy-hygiene-audit.mjs
          run_audit "Public data hygiene" node scripts/public-data-hygiene-audit.mjs
          run_audit "Canonical media library" node scripts/media-library-audit.mjs
          run_audit "Link integrity" node scripts/link-integrity-audit.mjs
          run_audit "URL stability" node scripts/url-stability-audit.mjs
          run_audit "Historical authority recovery" node scripts/historical-authority-audit.mjs
          run_audit "Historical authority tests" node --test tests/historical-authority-recovery.test.mjs
          run_audit "Historical URL/CSV intake fixtures" node --test tests/historical-backlink-import-fixtures.test.mjs
          run_audit "Internal link graph" node scripts/internal-link-graph-audit.mjs
          run_audit "Structured/social URLs" node scripts/structured-url-audit.mjs
          run_audit "llms.txt discovery" node scripts/llms-txt-audit.mjs
          run_audit "AI crawler policy" node scripts/ai-crawler-policy-audit.mjs
          run_audit "AI discovery privacy regressions" node --test tests/ai-discovery-privacy.test.mjs
          run_audit "Metadata uniqueness" node scripts/metadata-uniqueness-audit.mjs
          run_audit "Accessibility source" node scripts/accessibility-source-audit.mjs
          run_audit "Performance source" node scripts/performance-source-audit.mjs
          run_audit "Public secret exposure" node scripts/public-secret-audit.mjs
          run_audit "PWA private cache" node scripts/pwa-private-cache-audit.mjs
          run_audit "Admin keyword privacy" node --test tests/admin-intelligence-private.test.mjs
          run_audit "Bounded schema intelligence" node --test tests/admin-schema-intelligence.test.mjs
          run_audit "Bilingual schema sitemap and canonical guards" node --test tests/operations-intelligence-sitemaps.test.mjs
          run_audit "Admin schema engine runtime fixtures and MFA boundary" node --test tests/admin-schema-intelligence-runtime.test.mjs
          run_audit "Bilingual in-press book and sitemap contract" node --test tests/hll5-book-bilingual.test.mjs
          run_audit "Global FA/EN typography and bidi contract" node --test tests/bilingual-typography-contract.test.mjs
          run_audit "Community scholarly moderation and owner reply contract" node --test tests/community-moderation.test.mjs tests/community-design-consistency.test.mjs tests/community-academic-replies.test.mjs tests/community-service-projection.test.mjs
          run_audit "Public bilingual site and JHELA search privacy/discovery" node --test tests/site-search-public-scope.test.mjs
          run_audit "Single-source 15-banner FA/EN projection" node scripts/render-home-campaigns.mjs --check
          run_audit "Bilingual 15-banner registry and rendering safety" node --test tests/home-campaigns.test.mjs tests/home-campaigns-renderer.test.mjs
          run_audit "Bilingual brand motto" node --test tests/brand-motto-home.test.mjs
          run_audit "Owner mobile/store/version/editorial regression" node --test tests/owner-mobile-store-version-editorial.test.mjs
          run_audit "One-time PWA offer" node --test tests/pwa-install-once.test.mjs
          run_audit "Premium bookstore layout" node --test tests/bookstore-premium-layout.test.mjs
          run_audit "Private cache behavior" node --test tests/private-cache-behavior.test.mjs
          run_audit "Ordered stylesheet bundles" node scripts/stylesheet-bundles.mjs --check
          run_audit "Service SEO and Bertina commerce gates" node scripts/seo-services-gate.cjs
          run_audit "Workflow governance" node scripts/workflow-governance-audit.mjs
          run_audit "Trust/legal" node scripts/trust-legal-audit.mjs
          run_audit "News trust/freshness" node scripts/news-trust-audit.mjs
          run_audit "Sitemap lastmod" node scripts/sitemap-lastmod-audit.mjs
          run_audit "Evergreen guide trust" node scripts/evergreen-guide-trust-audit.mjs
          run_audit "Related content graph" node scripts/related-content-audit.mjs
          run_audit "FAQ integrity" node scripts/faq-integrity-audit.mjs
          run_audit "RSS distribution" node scripts/rss-audit.mjs
          run_audit "Conversion paths" node scripts/conversion-path-audit.mjs
          run_audit "Analytics/privacy contract" node scripts/analytics-contract-audit.mjs
          run_audit "Commerce fail-closed schema" node scripts/commerce-schema-safety-audit.mjs
          run_audit "Bertina receipt integrity" node scripts/commerce-receipt-contract-audit.mjs
          run_audit "Public entity schema" node platform/public-entity-schema-audit.mjs
          run_audit "Sanitized public build" node scripts/build-public-site.mjs
          run_audit "Retired commerce and bookstore hero" node scripts/public-retired-commerce-audit.mjs
          echo
          if [ "$failed" -ne 0 ]; then
            echo "===== FAILED AUDIT CHECKS ====="
            printf 'FAIL: %s\n' "${failed_labels[@]}"
            {
              echo '### Bertina Master SEO Audit — failing checks'
              printf -- '- ❌ `%s`\n' "${failed_labels[@]}"
              echo
              echo 'Successful checks remain enforced; investigate these failures before deployment.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PASS: All source SEO audit checks"
            echo '### Bertina Master SEO Audit — all source checks passed' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$failed"

      - name: Diagnostic live Bertina SEO/cache surface (TLS trust not certified)
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          ORIGIN_IP=188.40.203.218
          for path in /fa/ /en/ /fa/shop/ /en/shop/ /fa/khadamat/ /en/services/ /robots.txt /sitemap.xml /llms.txt; do
            code="$(curl -kLsS -o /tmp/body -w '%{http_code}' --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP "https://drjavadrezazadeh.com$path")"
            echo "$path HTTP $code"
            test "$code" = "200"
          done

          curl -kisS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP https://drjavadrezazadeh.com/fa/ -o /tmp/public-head
          echo "----- PUBLIC /fa/ HEADERS -----"
          sed -n '1,/^\r$/p' /tmp/public-head
          grep -Eiq '^cache-control:.*(no-cache|must-revalidate)' /tmp/public-head

          curl -kisS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP https://drjavadrezazadeh.com/fa/shop/checkout/ -o /tmp/private-head
          echo "----- PRIVATE CHECKOUT HEADERS -----"
          sed -n '1,/^\r$/p' /tmp/private-head
          grep -Eiq '^cache-control:.*no-store' /tmp/private-head
          grep -Eiq '^x-robots-tag:.*noindex' /tmp/private-head

          curl -kfsS --compressed --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP https://drjavadrezazadeh.com/fa/ -o /tmp/compressed.html
          grep -F '<html lang="fa" dir="rtl">' /tmp/compressed.html

          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP https://drjavadrezazadeh.com/robots.txt | grep -F 'Sitemap: https://drjavadrezazadeh.com/sitemap.xml'
          curl -kfsS --max-time 30 --resolve drjavadrezazadeh.com:443:$ORIGIN_IP https://drjavadrezazadeh.com/sitemap.xml | grep -F 'sitemap-fa.xml'

          # Read-only, strict TLS anonymous private-evidence exposure audit.
          # This checks the currently deployed revision, not branch-HEAD parity;
          # never download confidential response bodies or trigger a new deploy.
          echo "----- STRICT OWNER EVIDENCE DENIAL -----"
          for path in \
            /api/internal/operations-registry.json \
            /api/internal/operations-gsc-observation.json \
            /api/internal/ai-search-visibility-baseline-20261020.json \
            /api/operations-ai-visibility.php; do
            code="$(curl --noproxy '*' -sS --max-time 20 \
              --resolve drjavadrezazadeh.com:443:$ORIGIN_IP \
              -o /dev/null -w '%{http_code}' "https://drjavadrezazadeh.com$path")"
            echo "$path anonymous HTTPS $code"
            case "$code" in 403|404) ;; *)
              echo "::error::Private evidence resource exposed or inaccessible: $path HTTP $code"; exit 1;;
            esac
          done
          curl --noproxy '*' -sS --max-time 20 \
            --resolve drjavadrezazadeh.com:443:$ORIGIN_IP \
            -D /tmp/aisv-denial-headers -o /dev/null -w '%{http_code}' \
            https://drjavadrezazadeh.com/api/admin/operations/ai-visibility \
            > /tmp/aisv-denial-status
          test "$(cat /tmp/aisv-denial-status)" = 401
          tr -d '\r' < /tmp/aisv-denial-headers | grep -Eiq '^cache-control:.*no-store'
          tr -d '\r' < /tmp/aisv-denial-headers | grep -Eiq '^x-robots-tag:.*noindex'
          echo "PASS: 4 private files denied; owner AISV API HTTP 401, no-store and noindex."
