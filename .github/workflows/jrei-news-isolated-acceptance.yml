name: JREI News Isolated Acceptance (NO DEPLOYMENT)
# One consolidated, source-only acceptance campaign requested by the
# owner for the completed bilingual 21-desk JREI News release candidate.
# No FTP, Bertina access, real customer DB or automatic deployment here.
on:
  workflow_dispatch:
  pull_request:
    branches: [migration/bertina-linux6]
    paths:
      - ".github/workflows/jrei-news-isolated-acceptance.yml"
  push:
    branches: [migration/bertina-linux6]
    paths:
      - ".github/workflows/jrei-news-isolated-acceptance.yml"
      - "platform/news-intelligence/**"
      - "api/news-public-*.php"
      - "api/jrei-news-*.php"
      - "assets/js/jrei-news-*.js"
      - "assets/js/jrei-news-owner-panel-v1.mjs"
      - "assets/js/operations-jrei-newsroom-v1.js"
      - "assets/css/jrei-news-*.css"
      - "fa/akhbar/index.html"
      - "en/news-insights/index.html"
      - "scripts/build-public-site.mjs"
      - "docs/migrations/2026102*_jrei_news_*.sql"
permissions:
  contents: read
concurrency:
  group: jrei-news-isolated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: fixture-password
          MARIADB_DATABASE: news_fixture
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      JREI_NEWS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=news_fixture;charset=utf8mb4
      JREI_NEWS_TEST_USER: root
      JREI_NEWS_TEST_PASSWORD: fixture-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Source syntax for EVERY isolated news module
        shell: bash
        run: |
          set -euo pipefail
          find platform/news-intelligence/php -name '*.php' -type f -print0 |
            while IFS= read -r -d '' f; do php -l "$f"; done
          find platform/news-intelligence -name '*.mjs' -type f -print0 |
            while IFS= read -r -d '' f; do node --check "$f"; done
          find platform/news-intelligence/ui -name '*.js' -type f -print0 |
            while IFS= read -r -d '' f; do node --check "$f"; done
          node -e "JSON.parse(require('node:fs').readFileSync('platform/news-intelligence/integration-manifest.json','utf8'))"
      - name: Verify original PHP 8.3 source adapters and private CLI intake syntax
        run: |
          set -euo pipefail
          for file in api/jrei-news-*.php api/operations-jrei-news.php api/internal/jrei-news-*.php; do
            php -l "$file"
          done
      - name: Shipping News UI and read-only public API syntax
        run: |
          set -euo pipefail
          for file in api/news-public-*.php; do php -l "$file"; done
          for file in assets/js/jrei-news-*.js; do node --check "$file"; done
          node --check assets/js/jrei-news-owner-panel-v1.mjs
          node --check assets/js/operations-jrei-newsroom-v1.js
      - name: Offline Node contract and newsroom UI source regressions, no network/provider
        run: node --test platform/news-intelligence/tests/*.test.mjs
      - name: Build exact sanitized Bertina release candidate without deployment
        run: |
          set -euo pipefail
          node scripts/build-public-data.mjs --check
          node scripts/build-public-site.mjs
          node --test tests/jrei-news-private-release.test.mjs
      - name: Install isolated Chromium visual acceptance tooling
        run: |
          npm install --no-save @playwright/test@1.56.0
          npx playwright install --with-deps chromium
      - name: Visual QA — 21-section Persian and English newsrooms, mobile and desktop
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .public-site > /tmp/jrei-news-web.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/fa/akhbar/ > /dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/newsroom-21-browser.spec.js --workers=1
      - name: Preserve real RTL/LTR screenshot evidence from final QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrei-news-21-visual-evidence-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            /tmp/jrei-news-web.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Offline PHP source boundaries
        run: php platform/news-intelligence/tests/news-source-contracts.php
      - name: Disposable MariaDB mother-schema compatibility and workflows
        run: php platform/news-intelligence/tests/news-schema-fixture.php
      - name: Explicitly prohibit deploy side effects
        run: |
          echo 'JREI News offline PHP/JS + disposable MariaDB 10.11 tests. NO FTP, SSH, Bertina access, real customer database, SMTP, provider inference, public sitemap mutation or deployment.' >> "$GITHUB_STEP_SUMMARY"
