name: Catalog selected-checkout routing
on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - 'fa/services/**'
      - 'fa/vip/**'
      - 'assets/js/commerce-checkout.js'
      - 'assets/data/service-catalog.json'
      - 'assets/data/vip-catalog.json'
      - 'tests/catalog-checkout-routing.test.mjs'
      - '.github/workflows/catalog-checkout-routing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check selected service and VIP catalog routing
        run: node --test tests/catalog-checkout-routing.test.mjs
