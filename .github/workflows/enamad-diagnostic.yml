name: Enamad External Diagnostic

on:
  push:
    branches: [migration/bertina-linux6]
    paths:
      - '.github/workflows/enamad-diagnostic.yml'
      - 'index.html'
      - '60347010.txt'
      - 'CNAME'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: DNS and HTTP diagnostics
        shell: bash
        run: |
          set +e
          echo '=== DNS ==='
          getent ahostsv4 drjavadrezazadeh.com || true
          getent ahostsv4 www.drjavadrezazadeh.com || true
          python3 - <<'PY'
          import socket
          for h in ['drjavadrezazadeh.com','www.drjavadrezazadeh.com']:
              try:
                  print(h, socket.getaddrinfo(h, 443, type=socket.SOCK_STREAM))
              except Exception as e:
                  print(h, 'ERROR', repr(e))
          PY
          echo '=== DNS RESOLVER MATRIX ==='
          for resolver in 8.8.8.8 1.1.1.1 178.22.122.100 185.51.200.2; do
            echo "### resolver $resolver"
            dig +time=4 +tries=1 @$resolver drjavadrezazadeh.com A +short || true
            dig +time=4 +tries=1 @$resolver www.drjavadrezazadeh.com A +short || true
          done
          echo '=== AUTHORITATIVE NS ==='
          dig drjavadrezazadeh.com NS +short || true
          echo '=== FULL DNS MATRIX ==='
          for resolver in 8.8.8.8 1.1.1.1 178.22.122.100; do
            echo "### resolver $resolver A"
            dig +time=4 +tries=1 @$resolver drjavadrezazadeh.com A +short || true
            echo "### resolver $resolver AAAA"
            dig +time=4 +tries=1 @$resolver drjavadrezazadeh.com AAAA +short || true
            echo "### resolver $resolver CAA"
            dig +time=4 +tries=1 @$resolver drjavadrezazadeh.com CAA +short || true
            echo "### resolver $resolver WWW"
            dig +time=4 +tries=1 @$resolver www.drjavadrezazadeh.com CNAME +short || true
          done
          echo '### authoritative ns1 A/AAAA/CAA'
          dig +time=4 +tries=1 @ns1.desec.io drjavadrezazadeh.com A +short || true
          dig +time=4 +tries=1 @ns1.desec.io drjavadrezazadeh.com AAAA +short || true
          dig +time=4 +tries=1 @ns1.desec.io drjavadrezazadeh.com CAA +short || true
          dig +time=4 +tries=1 @ns1.desec.io www.drjavadrezazadeh.com CNAME +short || true
          echo '=== EMAIL DNS ==='
          for resolver in 8.8.8.8 1.1.1.1 178.22.122.100; do
            echo "### resolver $resolver MX"
            dig +time=4 +tries=1 @$resolver drjavadrezazadeh.com MX +short || true
            echo "### resolver $resolver DKIM"
          done
          echo '### authoritative deSEC MX/DKIM'
          dig +time=4 +tries=1 @ns1.desec.io drjavadrezazadeh.com MX +short || true
          echo '=== TLS VERBOSE ==='
          curl -Iv --connect-timeout 10 --max-time 20 https://drjavadrezazadeh.com/ 2>&1 | sed -n '1,120p' || true
          curl -Iv --connect-timeout 10 --max-time 20 https://www.drjavadrezazadeh.com/ 2>&1 | sed -n '1,120p' || true
          echo '=== LIVE ENAMAD SEAL ==='
          for u in 'https://drjavadrezazadeh.com/' 'https://drjavadrezazadeh.com/fa/' 'https://drjavadrezazadeh.com/en/'; do
            echo "### $u"
            curl -A 'Mozilla/5.0 (compatible; PaymentGatewayReviewer/1.0)' -sS --connect-timeout 10 --max-time 30 "$u" | grep -Eo "https://trustseal\.enamad\.ir/[^'\"< >]+|sealMJydDpzqNid1Ty82Y90Ef6SZLah1" | head -8 || true
          done
          echo '=== ENAMAD IMAGE ENDPOINT ==='
          rm -f /tmp/enamad-logo /tmp/enamad-headers
          curl -sS -L --connect-timeout 10 --max-time 30 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
            -e 'https://drjavadrezazadeh.com/' \
            -D /tmp/enamad-headers \
            -o /tmp/enamad-logo \
            'https://trustseal.enamad.ir/logo.aspx?id=8075712&Code=sealMJydDpzqNid1Ty82Y90Ef6SZLah1' || true
          sed -n '1,100p' /tmp/enamad-headers 2>/dev/null || true
          echo '-- bytes/type --'
          wc -c /tmp/enamad-logo 2>/dev/null || true
          file /tmp/enamad-logo 2>/dev/null || true
          echo '-- magic --'
          od -An -tx1 -N24 /tmp/enamad-logo 2>/dev/null || true
          echo '=== HTTP PROBES ==='
          for u in             'http://drjavadrezazadeh.com/'             'https://drjavadrezazadeh.com/'             'http://www.drjavadrezazadeh.com/'             'https://www.drjavadrezazadeh.com/'             'http://drjavadrezazadeh.com/60347010.txt'             'https://drjavadrezazadeh.com/60347010.txt'
          do
            echo "### $u"
            rm -f /tmp/h /tmp/b
            curl -A 'Mozilla/5.0 (compatible; EnamadDiagnostic/1.0)' -sS -L               --connect-timeout 10 --max-time 30               -D /tmp/h -o /tmp/b "$u"
            rc=$?
            echo "curl_exit=$rc"
            echo '-- headers --'
            sed -n '1,80p' /tmp/h 2>/dev/null || true
            echo '-- body markers --'
            wc -c /tmp/b 2>/dev/null || true
            grep -Eio '<title>[^<]*</title>|<meta[^>]+name=["'"'"']enamad["'"'"'][^>]*>|<h1[^>]*>[^<]*</h1>|60347010' /tmp/b 2>/dev/null | head -20 || true
            echo
          done
