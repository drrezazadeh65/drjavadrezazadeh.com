name: External Link Monitor
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.ops_request != '' && format('Admin audit {0}', inputs.ops_request) || github.workflow }}

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      ops_request:
        description: 'Optional owner audit request correlation (not a credential)'
        required: false
        type: string
  push:
    branches: [migration/bertina-linux6]
    paths:
      - 'scripts/external-link-audit.mjs'
      - '.github/workflows/external-link-monitor.yml'

permissions:
  contents: read

concurrency:
  group: external-link-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'migration/bertina-linux6' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public external links
        run: node scripts/external-link-audit.mjs
