name: External Link Monitor

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/external-link-audit.mjs'
      - '.github/workflows/external-link-monitor.yml'

permissions:
  contents: read

concurrency:
  group: external-link-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public external links
        run: node scripts/external-link-audit.mjs
