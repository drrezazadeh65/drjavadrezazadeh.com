name: JREI Bertina - One-File Signature Hotfix
# Manual owner-only release; does not deploy the full website.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bertina-production-deploy
  cancel-in-progress: false
jobs:
  one-file-hotfix:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'drrezazadeh65' && github.ref == 'refs/heads/migration/bertina-linux6'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact source and Ed25519 cross-runtime contract
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git ls-remote origin refs/heads/migration/bertina-linux6 | cut -f1)"
          test "$head_sha" = "$GITHUB_SHA"
          php -l api/jrei-hybrid-worker.php
          node --check platform/jrei-v5/windows-worker/jrei-worker.mjs
          node --test tests/jrei-v5-two-windows-node-gates.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          code=Path('api/jrei-hybrid-worker.php').read_bytes()
          approved=b'$canonical="jrei-worker-v1\\n".$verb."\\n/api".$path."\\n".'
          assert code.count(approved)==1
          assert b'sodium_crypto_sign_verify_detached($sig,$canonical,$public)' in code
          PY
      - name: Install secure FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Read authoritative current Bertina file (no writes)
        shell: bash
        env:
          FTP_USER: ${{ secrets.BERTINA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BERTINA_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.BERTINA_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          test -n "$FTP_USER" && test -n "$FTP_PASSWORD" && test -n "$FTP_REMOTE_DIR"
          test "$FTP_REMOTE_DIR" != "/" && test "$FTP_REMOTE_DIR" != "."
          echo "188.40.203.218 server388.bertina.biz" | sudo tee -a /etc/hosts >/dev/null
          timeout 100s lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://server388.bertina.biz" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 1
          set net:timeout 20
          cd "$FTP_REMOTE_DIR"
          get api/jrei-hybrid-worker.php -o /tmp/jrei-before.php
          bye
          LFTP
          test -s /tmp/jrei-before.php
          php -l /tmp/jrei-before.php
      - name: Build strictly one-expression patch from live PHP, preserving every other byte
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          original=Path('/tmp/jrei-before.php').read_bytes()
          old=b'$canonical="jrei-worker-v1\\n".$verb."\\n".$path."\\n".'
          new=b'$canonical="jrei-worker-v1\\n".$verb."\\n/api".$path."\\n".'
          if original.count(old)!=1 or original.count(new)!=0:
              raise SystemExit('Unexpected live canonical expression; no patch performed')
          if not 3000<len(original)<100000 or b'function jrHybridAuthenticate' not in original:
              raise SystemExit('Unexpected live file; no patch performed')
          patched=original.replace(old,new)
          assert patched.replace(new,old)==original
          Path('/tmp/jrei-after.php').write_bytes(patched)
          print('Only one approved expression changed; all other production bytes preserved.')
          PY
          php -l /tmp/jrei-after.php
      - name: Retain original PHP for owner-controlled rollback
        uses: actions/upload-artifact@v4
        with:
          name: jrei-worker-original-${{ github.run_id }}
          path: /tmp/jrei-before.php
          if-no-files-found: error
          retention-days: 14
      - name: Stage, read back, atomically rename and independently verify ONLY worker module
        shell: bash
        env:
          FTP_USER: ${{ secrets.BERTINA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BERTINA_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.BERTINA_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          stage="api/.jrei-worker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.php"
          timeout 100s lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://server388.bertina.biz" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 1
          set net:timeout 20
          cd "$FTP_REMOTE_DIR"
          put /tmp/jrei-after.php -o "$stage"
          get "$stage" -o /tmp/jrei-staged.php
          bye
          LFTP
          cmp /tmp/jrei-after.php /tmp/jrei-staged.php
          php -l /tmp/jrei-staged.php
          timeout 100s lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://server388.bertina.biz" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 1
          set net:timeout 20
          cd "$FTP_REMOTE_DIR"
          mv "$stage" api/jrei-hybrid-worker.php
          get api/jrei-hybrid-worker.php -o /tmp/jrei-verified.php
          bye
          LFTP
          cmp /tmp/jrei-after.php /tmp/jrei-verified.php
          php -l /tmp/jrei-verified.php
          {
            echo '### JREI one-file signature hotfix: VERIFIED'
            echo "GitHub source SHA: $GITHUB_SHA"
            echo 'Only api/jrei-hybrid-worker.php was changed on Bertina.'
            echo 'The full site, config.local.php, databases, payments and two node statuses were untouched.'
            echo 'Original live file saved in 14-day Actions artifact.'
            echo 'Signed heartbeat and final online readiness still require owner acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
