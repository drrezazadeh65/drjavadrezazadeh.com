name: Free Scholarly Metadata Observation

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [migration/bertina-linux6]
    paths:
      - scripts/free-scholarly-source-observer.mjs
      - .github/workflows/free-scholarly-observation.yml

permissions:
  contents: read

concurrency:
  group: free-scholarly-observation-canonical
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'migration/bertina-linux6' || github.ref }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic observer contracts
        run: |
          node --check scripts/free-scholarly-source-observer.mjs
          node scripts/free-scholarly-source-observer.mjs --self-test
      - name: Read public DOI metadata from free Crossref API
        run: node scripts/free-scholarly-source-observer.mjs --collect
      - name: Validate dated evidence and bounded schema
        run: node scripts/free-scholarly-source-observer.mjs --check
      - name: Preserve observation for review if branch update is unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-crossref-metadata-observation
          path: api/internal/free-scholar-observation.json
          if-no-files-found: ignore
          retention-days: 14
