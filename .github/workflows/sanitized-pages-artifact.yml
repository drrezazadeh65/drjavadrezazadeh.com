name: Sanitized Pages Artifact

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'sw.js'
      - 'site.webmanifest'
      - 'robots.txt'
      - 'llms.txt'
      - 'sitemap*.xml'
      - 'feed.xml'
      - 'CNAME'
      - '_config.yml'
      - 'scripts/build-public-site.mjs'
      - '.github/workflows/sanitized-pages-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitized-pages-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify safe public data projections
        run: node scripts/build-public-data.mjs --check
      - name: Build sanitized public site
        run: node scripts/build-public-site.mjs
      - name: Verify no engineering directories are published
        run: |
          test ! -e .public-site/platform
          test ! -e .public-site/foundation
          test ! -e .public-site/scripts
          test ! -e .public-site/tests
          test ! -e .public-site/edge
          test ! -e .public-site/payment-api
          test ! -e .public-site/docs
          test ! -e .public-site/.github
          test ! -e .public-site/assets/media-registry.json
      - name: Upload sanitized public artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-public-site
          path: .public-site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
