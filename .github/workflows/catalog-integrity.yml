name: Catalog integrity (v4.4.1)
on:
  push:
    paths:
      - 'assets/data/service-catalog.json'
      - 'assets/data/vip-catalog.json'
      - 'assets/data/book-catalog.json'
      - 'assets/images/books/**'
      - 'fa/services/**'
      - 'fa/vip/**'
      - 'scripts/catalog-integrity.mjs'
      - 'assets/js/commerce-checkout.js'
      - 'assets/js/book-store.js'
      - 'fa/shop/checkout/index.html'
      - 'fa/shop/payment-start/index.html'
      - '.github/workflows/catalog-integrity.yml'
      - 'assets/css/shop-customer-premium-20261017.css'
      - 'assets/css/jr-future-publishing-author-v1.css'
      - 'fa/shop/purchase-guide/index.html'
      - 'fa/shop/customer-policy/index.html'
      - 'fa/shop/receipt/index.html'
      - 'en/shop/purchase-guide/index.html'
      - 'en/shop/customer-policy/index.html'
      - 'en/shop/receipt/index.html'
      - 'en/shop/checkout/index.html'
      - 'fa/shop/authors/mehrab-mirkarimi/index.html'
      - 'tests/shop-premium-customer-design.test.mjs'
      - 'fa/shop/cart/index.html'
      - 'en/shop/cart/index.html'
      - 'docs/governance/BERTINA_OBSERVED_TABLE_CATALOG_20261017.json'
      - 'tests/bertina-observed-schema-registry.test.mjs'
      - 'docs/migrations/20261016_private_service_intake.sql'
      - 'docs/migrations/20261017_private_service_files.sql'
      - 'docs/migrations/20261017_service_buyer_receipt.sql'
      - 'database/unified/004c_jhela_founding_intake.sql'
      - 'docs/migrations/20261017_jr_future_publishing.sql'
      - 'docs/migrations/20261017_jr_publishing_contract_and_reserve.sql'
      - 'docs/migrations/20261017_jr_publishing_author_onboarding.sql'
  pull_request:
    branches: [migration/bertina-linux6]
    paths:
      - 'assets/data/**'
      - 'assets/images/books/**'
      - 'fa/services/**'
      - 'fa/vip/**'
      - 'scripts/catalog-integrity.mjs'
      - 'assets/js/commerce-checkout.js'
      - 'assets/js/book-store.js'
      - '.github/workflows/catalog-integrity.yml'
      - 'assets/css/shop-customer-premium-20261017.css'
      - 'assets/css/jr-future-publishing-author-v1.css'
      - 'fa/shop/purchase-guide/index.html'
      - 'fa/shop/customer-policy/index.html'
      - 'fa/shop/receipt/index.html'
      - 'en/shop/purchase-guide/index.html'
      - 'en/shop/customer-policy/index.html'
      - 'en/shop/receipt/index.html'
      - 'en/shop/checkout/index.html'
      - 'fa/shop/authors/mehrab-mirkarimi/index.html'
      - 'tests/shop-premium-customer-design.test.mjs'
      - 'fa/shop/cart/index.html'
      - 'en/shop/cart/index.html'
      - 'docs/governance/BERTINA_OBSERVED_TABLE_CATALOG_20261017.json'
      - 'tests/bertina-observed-schema-registry.test.mjs'
      - 'docs/migrations/20261016_private_service_intake.sql'
      - 'docs/migrations/20261017_private_service_files.sql'
      - 'docs/migrations/20261017_service_buyer_receipt.sql'
      - 'database/unified/004c_jhela_founding_intake.sql'
      - 'docs/migrations/20261017_jr_future_publishing.sql'
      - 'docs/migrations/20261017_jr_publishing_contract_and_reserve.sql'
      - 'docs/migrations/20261017_jr_publishing_author_onboarding.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check scripts/catalog-integrity.mjs
          node --check assets/js/commerce-checkout.js
          node --check assets/js/book-store.js
      - name: Validate service, VIP and bookstore catalogs
        run: node scripts/catalog-integrity.mjs
      - name: Validate bilingual premium shop guidance and preserved payment semantics
        run: node --test tests/shop-premium-customer-design.test.mjs
      - name: Validate documented 253-table Bertina schema inventory without production access
        run: node --test tests/bertina-observed-schema-registry.test.mjs
