function listing(type){const arr=data[type];return arr.length?arr.map(x=>'<div class="item"><div><strong>'+esc(x.title)+'</strong><small>'+esc(x.note||'')+'</small></div><button class="link" data-remove="'+type+'" data-id="'+esc(x.id)+'" aria-label="حذف مورد">حذف</button></div>').join(''):'<div class="empty">هنوز موردی ثبت نشده است.</div>'}
function dashboard(){return shell('dashboard','فضای پژوهشی شما','به محیط آزمایشی JREI Academic خوش آمدید.','<div class="stats">'+[['projects','پروژه'],['library','منبع'],['jobs','نتیجه محلی']].map(x=>'<div class="card"><div class="stat">'+fa(data[x[0]].length)+'</div><span class="stat-label">'+x[1]+'</span></div>').join('')+'</div><div class="workspace"><div class="card"><h3>امروز روی چه چیزی کار می‌کنید؟</h3><p>یک پروژه ایجاد کنید یا ابزار مناسب را انتخاب کنید.</p><div class="actions"><a class="btn" href="#projects">پروژه جدید</a><a class="btn secondary" href="#tool/chat">دستیار پژوهشی</a></div></div><div class="card"><h3>پروژه‌های اخیر</h3><div class="items">'+listing('projects')+'</div></div></div><div class="section-head" style="margin-top:25px"><h2>ابزارهای پرکاربرد</h2><a class="btn ghost small" href="#tools">همه ابزارها</a></div><div class="grid">'+toolCards(tools.slice(0,6))+'</div>')}
function collection(type){const p=type==='projects';return shell(type,p?'پروژه‌های پژوهشی':'کتابخانه شخصی',p?'مدیریت پروژه‌های نمونه در مرورگر':'ثبت اطلاعات کتاب‌شناختی نمونه','<div class="workspace"><form class="card" id="collection-form" data-type="'+type+'"><h3>'+(p?'پروژه جدید':'افزودن منبع')+'</h3><div class="field"><label for="title">عنوان</label><input id="title" name="title" maxlength="150" required placeholder="'+(p?'مثلاً پژوهش یادگیری زبان':'عنوان مقاله یا کتاب')+'"></div><div class="field"><label for="note">'+(p?'موضوع و هدف':'DOI یا یادداشت کتاب‌شناختی')+'</label><textarea id="note" name="note" maxlength="1000"></textarea></div><button class="btn" type="submit">ثبت در مرورگر</button></form><div class="card"><h3>'+ (p?'پروژه‌های ثبت‌شده':'منابع ثبت‌شده')+'</h3><div class="items">'+listing(type)+'</div></div></div>')}
function toolPage(t){let id=t[0];const local=['stats','citation','corpus','compare','research'].includes(id);return shell('tool/'+id,t[2],t[3],'<div class="workspace"><form id="tool-form" data-tool="'+id+'" class="card"><h3>ورودی ابزار</h3><p>'+(local?'این ابزار نمونه‌ای محلی یا پیوند جستجو ارائه می‌دهد.':'این قابلیت در انتظار اتصال به API تجاری JREI است؛ هیچ پاسخ ساختگی تولید نمی‌شود.')+'</p><div class="field"><label for="payload">'+t[4]+'</label><textarea id="payload" name="payload" required maxlength="30000"></textarea></div>'+(id==='compare'?'<div class="field"><label for="second">نسخه دوم</label><textarea id="second" name="second" maxlength="30000" required></textarea></div>':'')+'<button type="submit" class="btn">'+(local?'اجرای نمونه':'بررسی وضعیت اتصال')+'</button><div id="output" class="result" role="status" aria-live="polite">نتیجه اینجا نمایش داده می‌شود.</div></form><div class="card"><h3>راهنمای علمی</h3><p>از داده آزمایشی استفاده کنید. نتیجه ابزار محلی جایگزین بررسی علمی متخصص نیست.</p><p>شناسه مفهومی اتصال: <code dir="ltr">'+t[5]+'</code></p><h3>مرحله بعد</h3><p>پس از اتصال موتور، نتیجه، شواهد و وضعیت پردازش از سرور دریافت خواهند شد.</p><a href="#ethics" class="btn secondary small">اصول استفاده مسئولانه</a></div></div>')}
const policies={about:['درباره JREI Academic','محصول پیشنهادی برای دستیار دانشگاهی فارسی که موتور و مغز آن JREI خواهد بود. این پیش‌نمایش از سیستم خصوصی مالک مستقل است.'],privacy:['حریم خصوصی','این پیش‌نمایش داده‌های نمونه را در localStorage مرورگر نگه می‌دارد و هیچ درخواست هوش مصنوعی یا پرداختی به سرور ارسال نمی‌کند. اطلاعات واقعی، محرمانه و هویتی وارد نکنید. سیاست نهایی پس از طراحی سرور، دوره نگهداری و فرایند حذف داده تدوین می‌شود.'],ethics:['اخلاق و سلامت پژوهش','سامانه برای آموزش، راهنمایی، تحلیل و بازبینی طراحی شده است، نه فروش آثار علمی برای ارائه به نام دیگران. ارجاعات و یافته‌ها باید توسط پژوهشگر بررسی شوند؛ داده و منبع جعلی پذیرفته نیست.'],terms:['شرایط استفاده','نسخه نمایشی فاقد اشتراک فعال، تضمین کیفیت علمی و خدمات پرداخت است. استفاده عمومی تجاری منوط به آزمون امنیت، ظرفیت و بررسی حقوقی خواهد بود.'],contact:['تماس و پشتیبانی','درگاه پشتیبانی رسمی پس از راه‌اندازی تجاری معرفی خواهد شد. در این نسخه هیچ فرم ارسال اطلاعات شخصی وجود ندارد.'],guide:['راهنمای استفاده','از پیشخوان وارد پروژه‌ها شوید و یک پروژه نمونه بسازید. در ابزار آمار چند عدد، در ابزار ارجاع چند DOI و در مقایسه نسخه‌ها دو متن نمونه وارد کنید. ابزارهای مدل زبانی هنوز متصل نیستند.']};
function page(title,body){return '<section class="section"><div class="wrap article"><h1>'+title+'</h1>'+body+'</div></section>'}
function render(){let route=location.hash.slice(1)||'home';if(route==='main')route='home';let out;if(route==='home')out=home();else if(route==='dashboard')out=dashboard();else if(route==='tools')out=shell(route,'ابزارهای پژوهشی','جستجو و انتخاب ابزار مورد نیاز','<div class="field filter"><label for="filter">جستجوی ابزار</label><input id="filter" placeholder="مثلاً تحلیل یا مقاله"></div><div id="tool-grid" class="grid">'+toolCards(tools)+'</div>');else if(route==='projects'||route==='library')out=collection(route);else if(route.startsWith('tool/')){const t=tools.find(t=>t[0]===route.slice(5));out=t?toolPage(t):page('ابزار پیدا نشد','<a href="#tools">بازگشت به ابزارها</a>')}else if(route==='pricing')out='<section class="section"><div class="wrap"><h1>تعرفه‌های پیشنهادی</h1><p class="lead">خرید فعال نیست؛ هزینه‌ها و سقف مصرف پس از آزمون ظرفیت تعیین می‌شوند.</p>'+plans()+'</div></section>';else if(route==='billing')out=shell(route,'اشتراک و اعتبار','طرح‌های پیشنهادی بدون پرداخت واقعی',plans());else if(route==='jobs')out=shell(route,'نتایج محلی','سوابق اجرای ابزارهای نمونه','<div class="card"><div class="items">'+listing('jobs')+'</div></div>');else if(route==='settings')out=shell(route,'تنظیمات','مدیریت اطلاعات آزمایشی مرورگر','<div class="card"><h3>داده‌های محلی</h3><p>خروجی JSON یا پاک‌کردن داده‌های نمونه. اطلاعاتی به سرور ارسال نمی‌شود.</p><div class="actions"><button class="btn secondary" id="export">دریافت JSON</button><button class="btn secondary" id="reset">پاک‌کردن داده‌های نمونه</button></div></div>');else if(route==='login')out=page('ورود به محیط پژوهشی','<div class="card"><h3>حساب کاربری آزمایشی</h3><p>احراز هویت هنوز فعال نیست. بدون وارد کردن شماره موبایل، رمز عبور یا ایمیل وارد محیط نمایشی شوید.</p><a class="btn" href="#dashboard">ادامه به‌عنوان مهمان</a></div>');else if(policies[route])out=page(policies[route][0],'<p>'+policies[route][1]+'</p>'+(route==='guide'?faq():''));else out=page('صفحه پیدا نشد','<a class="btn" href="#home">بازگشت</a>');root.innerHTML=out;document.title='JREI Academic | '+(root.querySelector('h1')?.textContent||'پژوهش');const sel=document.getElementById('mobile-route');if(sel)sel.onchange=()=>go(sel.value);const filter=document.getElementById('filter');if(filter)filter.oninput=()=>{document.getElementById('tool-grid').innerHTML=toolCards(tools.filter(t=>t[2].includes(filter.value)||t[3].includes(filter.value))) };window.scrollTo(0,0)}
function runLocal(id,v,w){if(id==='stats'){const n=v.replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).trim().split(/[\s,،;؛]+/).map(Number);if(n.length<2||n.some(x=>!Number.isFinite(x)))return 'حداقل دو عدد معتبر وارد کنید.';const m=n.reduce((a,b)=>a+b,0)/n.length,s=Math.sqrt(n.reduce((a,b)=>a+(b-m)**2,0)/(n.length-1));if(!Number.isFinite(m)||!Number.isFinite(s))return 'مقادیر خارج از محدوده محاسبه هستند.';return 'تعداد: '+fa(n.length)+'\nمیانگین: '+fa(m)+'\nانحراف معیار نمونه: '+fa(s)+'\nکمینه: '+fa(Math.min(...n))+'\nبیشینه: '+fa(Math.max(...n))}if(id==='citation'){const matches=[...new Set((v.match(/10\.\d{4,9}\/[\-._;()/:A-Z0-9]+/gi)||[]).map(x=>x.replace(/[.,;]+$/,'')))];return matches.length?'شناسه‌های احتمالی DOI (هنوز اعتبارسنجی نشده‌اند):\n'+matches.join('\n'):'شناسه DOI قابل تشخیص یافت نشد.'}if(id==='corpus'){const words=v.toLowerCase().match(/[\p{L}\p{N}]+/gu)||[],counts=new Map;words.forEach(x=>counts.set(x,(counts.get(x)||0)+1));return 'تعداد واژه: '+fa(words.length)+'\nواژگان یکتا: '+fa(counts.size)+'\n'+[...counts].sort((a,b)=>b[1]-a[1]).slice(0,15).map(x=>x[0]+': '+fa(x[1])).join('\n')}if(id==='compare'){let a=v.split(/\s+/),b=w.split(/\s+/),i=0,j=0;while(i<Math.min(a.length,b.length)&&a[i]===b[i])i++;while(j<Math.min(a.length-i,b.length-i)&&a[a.length-1-j]===b[b.length-1-j])j++;return i===a.length&&i===b.length?'دو متن از نظر واژگان یکسان‌اند.':'بخش تغییرکرده (مقایسه واژگانی ساده):\nنسخه اول: '+a.slice(i,a.length-j).join(' ')+'\nنسخه دوم: '+b.slice(i,b.length-j).join(' ')}return null}
root.addEventListener('submit',e=>{e.preventDefault();let f=e.target;if(f.id==='collection-form'){let fd=new FormData(f),t=f.dataset.type;data[t].unshift({id:uid(),title:String(fd.get('title')).trim(),note:String(fd.get('note')).trim()});save();render()}else if(f.id==='tool-form'){let fd=new FormData(f),id=f.dataset.tool,v=String(fd.get('payload')).trim(),w=String(fd.get('second')||'').trim(),o=document.getElementById('output');if(!v){o.textContent='ورودی خالی است.';return}if(id==='research'){o.textContent='جستجوی واقعی در موتور JREI هنوز متصل نیست. می‌توانید با انتخاب پیوند، جستجو را در سایت منبع باز کنید.';[['Crossref','https://search.crossref.org/?q='],['Google Scholar','https://scholar.google.com/scholar?q=']].forEach(x=>{let a=document.createElement('a');a.className='btn secondary small';a.href=x[1]+encodeURIComponent(v);a.target='_blank';a.rel='noopener noreferrer';a.textContent=x[0];o.append(document.createElement('br'),a)});return}let result=runLocal(id,v,w);o.textContent=result??'اتصال برقرار نیست. درخواست ارسال یا پردازش نشده است.';if(result!==null){data.jobs.unshift({id:uid(),title:tools.find(t=>t[0]===id)[2],note:new Date().toLocaleString('fa-IR')});data.jobs=data.jobs.slice(0,100);save()}}});
root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.remove&&['projects','library','jobs'].includes(b.dataset.remove)){data[b.dataset.remove]=data[b.dataset.remove].filter(x=>x.id!==b.dataset.id);save();render()}if(b.id==='reset'&&confirm('تمام اطلاعات آزمایشی مرورگر پاک شود؟')){data={projects:[],library:[],jobs:[]};save();render()}if(b.id==='export'){let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='jrei-academic-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
window.addEventListener('hashchange',render);render();
</script></body></html>
