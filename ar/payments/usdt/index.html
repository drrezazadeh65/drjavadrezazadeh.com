<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>الدفع المباشر بعملة USDT</title><link rel="stylesheet" href="/assets/css/jr-usdt-commerce-v1.css?v=1"><script src="/assets/js/jr-usdt-commerce-v1.js?v=1" defer></script></head><body><main id="main" data-jr-usdt-checkout><a href="/ar/">العودة إلى الموقع</a><h1>الدفع المباشر بعملة USDT</h1><p>فاتورة محددة الصلاحية على شبكة BSC (BEP20). يتحقق المدير من وصول الإيداع فعلياً قبل تأكيد الدفع.</p><p role="status" data-usdt-status>جارٍ التحقق من توفر الدفع</p><a data-usdt-login href="/en/login/" hidden>تسجيل الدخول بحساب موثق</a><form data-usdt-form hidden><label>غرض الدفع<select name="purpose"><option value="purchase">شراء منتج أو خدمة</option><option value="donation">دعم التعليم</option></select></label><div data-usdt-purchase><label>المنتج أو الخدمة<select name="sku"></select></label><label>الكمية<input name="quantity" type="number" min="1" max="20" value="1"></label><label>الاسم الكامل<input name="name" autocomplete="name" maxlength="100"></label><label>الهاتف (اختياري)<input name="phone" autocomplete="tel" maxlength="30"></label><div data-usdt-shipping hidden><label>عنوان توصيل الكتاب المطبوع<textarea name="address" maxlength="500" autocomplete="street-address"></textarea></label><label>الرمز البريدي<input name="postal" maxlength="20" autocomplete="postal-code"></label></div></div><div data-usdt-donation hidden><label>مبلغ الدعم بالتومان<input name="amountToman" type="number" min="1000" max="10000000" step="1" value="500000"></label><label>مجال الدعم<select name="focus"><option value="general">عام</option><option value="scholarship">منحة دراسية</option><option value="books">كتب</option><option value="services">خدمات تعليمية</option><option value="essentials">الاحتياجات الأساسية</option></select></label></div><button type="submit">إصدار فاتورة ملزمة</button></form><h2>فواتيري</h2><button type="button" data-usdt-refresh>تحديث الحالة</button><section data-usdt-invoices aria-live="polite"></section></main></body></html>
