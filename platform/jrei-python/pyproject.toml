[build-system]
requires = ["setuptools>=69,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "jrei-intelligence-core"
version = "0.1.0"
description = "Private, model-independent JREI intelligence contracts and governed orchestration"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.12",
    "pydantic==2.11.4",
    "uvicorn==0.34.2",
    "PyMySQL==1.1.1",
    "cryptography==44.0.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jrei_core*", "jrei_learning*", "jrei_service*", "jrei_skills*", "jrei_orchestrator*", "jrei_memory*"]

# The Windows Command Center reads its UI from the installed Python package.
# The source tree alone is not sufficient: an offline wheel must carry it.
[tool.setuptools.package-data]
jrei_service = ["windows_owner_ui.html"]
