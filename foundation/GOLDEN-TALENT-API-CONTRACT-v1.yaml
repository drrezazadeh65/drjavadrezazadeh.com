openapi: 3.1.0
info:
  title: Golden Talent Platform API
  version: 1.0.0
  description: >
    Provider-neutral contract for RCAS Start, routed deep modules, commerce,
    entitlements, Golden Path professional review and BAHAR continuity.
servers:
  - url: https://api.example.invalid
    description: Placeholder only; no production backend is live.
paths:
  /v1/golden-talent/catalog:
    get:
      summary: Return public product stages and currently published prices
      responses:
        '200': { description: Product catalog }
  /v1/me:
    get:
      summary: Return authenticated profile and roles
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: Current user }
  /v1/me/entitlements:
    get:
      summary: Return server-verified Golden Talent feature access
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: Active and pending entitlements }
  /v1/rcas/sessions:
    post:
      summary: Start an authenticated RCAS assessment session
      security: [{ sessionAuth: [] }]
      responses:
        '201': { description: Session created }
  /v1/rcas/sessions/{sessionId}/responses:
    put:
      summary: Save versioned RCAS responses
      security: [{ sessionAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Saved }
  /v1/rcas/sessions/{sessionId}/submit:
    post:
      summary: Submit RCAS Core into the Golden Talent evidence engine
      description: >
        Server validates the persisted assessment session and its published instrument version,
        converts eligible responses into UNREVIEWED provenance-linked evidence events, then
        creates a versioned route run. Browser sessionStorage, a client-selected priority domain,
        or a client-computed score is never accepted as routing truth. No total talent score,
        normative label or automatic career prescription is produced.
      security: [{ sessionAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Evidence events persisted and auditable route run created without a total talent score }
  /v1/rcas/observer-sessions:
    post:
      summary: Start an authenticated RCAS-O1 observation session
      description: >
        Creates an RCAS-O1 session only after the server verifies that the authenticated
        PARENT or TEACHER is authorised to submit observation evidence for the subject
        student. A claimed relationship in the browser is never sufficient. RCAS-O1
        produces UNREVIEWED contextual O-source evidence and has no score, normative
        interpretation or total. Free-text observation cannot establish convergence
        until an authorised review classifies its evidential direction.
      security: [{ sessionAuth: [] }]
      responses:
        '201': { description: Authorised observer session created }
        '403': { description: Relationship, assignment or visibility permission not verified }
  /v1/rcas/observer-sessions/{sessionId}/submit:
    post:
      summary: Submit RCAS-O1 as O-source observation evidence
      description: >
        Persists versioned free-text observation fields and links them to the subject's
        evidence record without generating a talent score or trait label. Server-side
        relationship/assignment and visibility policy are re-verified at submission.
      security: [{ sessionAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Observation evidence recorded }
        '403': { description: Observer no longer authorised for the subject }
  /v1/rcas/sessions/{sessionId}/routes:
    get:
      summary: Return D1-D6 routing evidence and priority
      security: [{ sessionAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Routing result }
  /v1/golden-talent/evidence:
    post:
      summary: Record a versioned Golden Talent evidence event
      description: >
        Server records provenance, source class, visibility scope and quality state.
        Missing evidence is never converted into negative evidence.
      security: [{ sessionAuth: [] }]
      responses:
        '201': { description: Evidence event persisted }
        '403': { description: Subject relationship or evidence scope not authorised }
  /v1/golden-talent/evidence/{evidenceId}/reviews:
    post:
      summary: Append a professional review decision to an evidence event
      description: >
        The original evidence payload remains immutable. An authorised reviewer records
        quality, evidential direction and rationale. A review may classify evidence as
        SUPPORTS, CONTRADICTS or CONTEXTUALISES; it does not create a total talent score.
      security: [{ sessionAuth: [] }]
      parameters:
        - in: path
          name: evidenceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Append-only review decision recorded }
        '403': { description: Reviewer is not authorised for this evidence scope }
  /v1/golden-talent/route-runs:
    post:
      summary: Create an auditable D1-D6 evidence-routing run
      description: >
        Produces evidence states and next-evidence priorities only. It does not produce
        a total talent score, normative gifted label or automatic career prescription.
      security: [{ sessionAuth: [] }]
      responses:
        '201': { description: Versioned routing run created }
  /v1/golden-talent/route-runs/{runId}:
    get:
      summary: Return route evidence with provenance links and review state
      security: [{ sessionAuth: [] }]
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Auditable route run }
  /v1/golden-talent/route-runs/{runId}/review:
    post:
      summary: Record professional review of a Golden Talent routing run
      description: >
        Required for high-consequence synthesis. Reviewer may request more evidence,
        accept routing, revise routing with rationale, or void the run.
      security: [{ sessionAuth: [] }]
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Human review event persisted }
  /v1/checkout:
    post:
      summary: Create order and provider payment intent
      description: >
        Payment success must never be accepted from the browser alone. The client selects
        a product and market, while the server resolves the active price, canonical currency,
        eligible provider and idempotency key.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_key, market]
              additionalProperties: false
              properties:
                product_key:
                  type: string
                market:
                  type: string
                  enum: [IR, INTERNATIONAL]
                return_path:
                  type: string
                  description: Relative application path only; server validates allow-list.
      responses:
        '201': { description: Server-created order and payment intent }
        '400': { description: Invalid product, market or return path }
        '409': { description: Duplicate/idempotent checkout conflict }
  /v1/payments/webhook:
    post:
      summary: Verify provider callback and grant entitlements server-side
      responses:
        '204': { description: Verified and processed idempotently }
  /v1/golden-talent/deep-modules/{domain}/sessions:
    post:
      summary: Start an entitled D1-D6 deep-module session
      description: >
        Server validates the module contract, published instrument version and active
        entitlement. Client-side unlock state is not authoritative.
      security: [{ sessionAuth: [] }]
      parameters:
        - in: path
          name: domain
          required: true
          schema: { type: string, enum: [D1,D2,D3,D4,D5,D6] }
      responses:
        '201': { description: Versioned deep-module session created }
        '403': { description: Entitlement or role not verified }
  /v1/golden-talent/deep-modules/{domain}/sessions/{sessionId}/submit:
    post:
      summary: Submit traceable deep-module evidence
      description: >
        Task evidence enters the common evidence ledger as UNREVIEWED contextual evidence.
        Review is required before it can support or contradict a route. Submission never
        returns a total talent score or normative label.
      security: [{ sessionAuth: [] }]
      parameters:
        - in: path
          name: domain
          required: true
          schema: { type: string, enum: [D1,D2,D3,D4,D5,D6] }
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Evidence persisted and review workflow created }
  /v1/golden-path:
    post:
      summary: Request professional Golden Path synthesis
      description: >
        Golden Path synthesis is a high-consequence human-reviewed workflow. The server
        must use a persisted route run and its evidence provenance; unresolved discrepancy
        cannot be silently averaged away. Browser state cannot approve synthesis. The
        structured output preserves strengths, counterevidence, uncertainty, context
        constraints and evidence identifiers; it produces no total score, normative label
        or automatic career prescription.
      security: [{ sessionAuth: [] }]
      responses:
        '201': { description: Human-review workflow created }
  /v1/bahar/portfolios:
    post:
      summary: Create BAHAR continuity portfolio from a professionally released Golden Path
      description: >
        Server copies the released synthesis into an immutable baseline snapshot. Goals,
        success evidence and planned actions begin as human-authored DRAFT content; the
        synthesis engine cannot silently prescribe them.
      security: [{ sessionAuth: [] }]
      responses:
        '201': { description: Portfolio created }
  /v1/bahar/portfolios/{portfolioId}/weekly-cycles:
    post:
      summary: Add weekly BAHAR cycle
      security: [{ sessionAuth: [] }]
      parameters:
        - in: path
          name: portfolioId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Weekly cycle created }
  /v1/bahar/portfolios/{portfolioId}/reviews:
    post:
      summary: Record a human four-week, eight-week or ad-hoc BAHAR review
      description: >
        Review references observed weekly evidence and records CONTINUE, CHANGE, PAUSE,
        STOP or INVESTIGATE with rationale. CHANGE or INVESTIGATE may request a new
        Golden Talent route run but never rewrites or releases Golden Path automatically.
      security: [{ sessionAuth: [] }]
      parameters:
        - in: path
          name: portfolioId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Period review recorded }
  /v1/bahar/portfolios/{portfolioId}/reassessment:
    post:
      summary: Request Golden Talent reassessment from longitudinal BAHAR evidence
      description: >
        Server creates a new evidence/routing workflow from traceable longitudinal evidence.
        Historical Golden Path versions remain preserved and professional review is required.
      security: [{ sessionAuth: [] }]
      parameters:
        - in: path
          name: portfolioId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Reassessment workflow created }
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: __Host-session
