openapi: 3.1.0
info:
  title: Golden Talent Platform API
  version: 1.0.0
  description: >
    Provider-neutral contract for RCAS Start, routed deep modules, commerce,
    entitlements, Golden Path professional review and BAHAR continuity.
servers:
  - url: https://api.example.invalid
    description: Placeholder only; no production backend is live.
paths:
  /v1/golden-talent/catalog:
    get:
      summary: Return public product stages and currently published prices
      responses:
        '200': { description: Product catalog }
  /v1/me:
    get:
      summary: Return authenticated profile and roles
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: Current user }
  /v1/me/entitlements:
    get:
      summary: Return server-verified Golden Talent feature access
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: Active and pending entitlements }
  /v1/rcas/sessions:
    post:
      summary: Start an authenticated RCAS assessment session
      security: [{ sessionAuth: [] }]
      responses:
        '201': { description: Session created }
  /v1/rcas/sessions/{sessionId}/responses:
    put:
      summary: Save versioned RCAS responses
      security: [{ sessionAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Saved }
  /v1/rcas/sessions/{sessionId}/submit:
    post:
      summary: Submit RCAS Core for routing
      security: [{ sessionAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Submitted without fabricating a total talent score }
  /v1/rcas/observer-sessions:
    post:
      summary: Start an authenticated RCAS-O1 observation session
      description: >
        Creates an RCAS-O1 session only after the server verifies that the authenticated
        PARENT or TEACHER is authorised to submit observation evidence for the subject
        student. A claimed relationship in the browser is never sufficient. RCAS-O1
        produces O-source evidence and has no score, normative interpretation or total.
      security: [{ sessionAuth: [] }]
      responses:
        '201': { description: Authorised observer session created }
        '403': { description: Relationship, assignment or visibility permission not verified }
  /v1/rcas/observer-sessions/{sessionId}/submit:
    post:
      summary: Submit RCAS-O1 as O-source observation evidence
      description: >
        Persists versioned free-text observation fields and links them to the subject's
        evidence record without generating a talent score or trait label. Server-side
        relationship/assignment and visibility policy are re-verified at submission.
      security: [{ sessionAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Observation evidence recorded }
        '403': { description: Observer no longer authorised for the subject }
  /v1/rcas/sessions/{sessionId}/routes:
    get:
      summary: Return D1-D6 routing evidence and priority
      security: [{ sessionAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Routing result }
  /v1/checkout:
    post:
      summary: Create order and provider payment intent
      description: >
        Payment success must never be accepted from the browser alone. The client selects
        a product and market, while the server resolves the active price, canonical currency,
        eligible provider and idempotency key.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_key, market]
              additionalProperties: false
              properties:
                product_key:
                  type: string
                market:
                  type: string
                  enum: [IR, INTERNATIONAL]
                return_path:
                  type: string
                  description: Relative application path only; server validates allow-list.
      responses:
        '201': { description: Server-created order and payment intent }
        '400': { description: Invalid product, market or return path }
        '409': { description: Duplicate/idempotent checkout conflict }
  /v1/payments/webhook:
    post:
      summary: Verify provider callback and grant entitlements server-side
      responses:
        '204': { description: Verified and processed idempotently }
  /v1/golden-path:
    post:
      summary: Request professional Golden Path synthesis
      security: [{ sessionAuth: [] }]
      responses:
        '201': { description: Human-review workflow created }
  /v1/bahar/portfolios:
    post:
      summary: Create BAHAR continuity portfolio for entitled user
      security: [{ sessionAuth: [] }]
      responses:
        '201': { description: Portfolio created }
  /v1/bahar/portfolios/{portfolioId}/weekly-cycles:
    post:
      summary: Add weekly BAHAR cycle
      security: [{ sessionAuth: [] }]
      parameters:
        - in: path
          name: portfolioId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Weekly cycle created }
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: __Host-session
