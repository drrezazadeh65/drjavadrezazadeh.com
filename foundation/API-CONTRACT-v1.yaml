openapi: 3.1.0
info:
  title: Dr. Javad Rezazadeh Yazdeli Ecosystem API
  version: 1.0.0
  description: >
    Provider-neutral API contract for consultation, accounts, assessments,
    reports, commerce and private educational records. This is a contract
    document, not a live production endpoint.
servers:
  - url: https://app.drjavadrezazadeh.com/api/v1
    description: Future production
  - url: https://staging.app.drjavadrezazadeh.com/api/v1
    description: Future staging
tags:
  - name: System
  - name: Identity
  - name: Privacy
  - name: Consultation
  - name: Appointments
  - name: Messaging
  - name: Commerce
  - name: Assessments
  - name: Development
  - name: Coaching
  - name: Reports
  - name: Files
paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      responses:
        "200":
          description: Service healthy
  /auth/registrations:
    post:
      tags: [Identity]
      summary: Create a pending account using email plus required mobile contact
      description: >
        Email is the only login identifier and the only account-verification channel.
        Mobile is required contact data in E.164 format and cannot verify the account,
        reset a password, grant a role or create a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "202":
          description: Pending account accepted and email verification initiated
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/email-verifications:
    post:
      tags: [Identity]
      summary: Verify email ownership with a short-lived single-use token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerification"
      responses:
        "204":
          description: Email verified; account may become ACTIVE subject to role/onboarding rules
        "400":
          $ref: "#/components/responses/ValidationError"
  /auth/email-verification-requests:
    post:
      tags: [Identity]
      summary: Email verification without revealing unnecessary account state
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryRequest"
      responses:
        "202":
          description: Neutral response
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/session:
    post:
      tags: [Identity]
      summary: Create an authenticated session
      description: >
        Accept verified credentials through the production identity provider and
        issue a Secure, HttpOnly, SameSite session cookie. The API response must
        not expose the session secret to browser JavaScript.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "204":
          description: Session established
        "401":
          description: Invalid credentials
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [Identity]
      summary: End the current authenticated session
      security:
        - sessionAuth: []
      responses:
        "204":
          description: Session revoked and cookie cleared
  /auth/recovery-requests:
    post:
      tags: [Identity]
      summary: Request account recovery without revealing account existence
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryRequest"
      responses:
        "202":
          description: Neutral response returned whether or not the account exists
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/recovery-confirmations:
    post:
      tags: [Identity]
      summary: Complete recovery with a short-lived single-use token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryConfirmation"
      responses:
        "204":
          description: Credential reset and relevant sessions revoked
        "400":
          $ref: "#/components/responses/ValidationError"
  /me/consents:
    get:
      tags: [Privacy]
      summary: Return the authenticated user's versioned consent records
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Consent records
    post:
      tags: [Privacy]
      summary: Record a new consent decision without overwriting history
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentDecision"
      responses:
        "201":
          description: Consent decision recorded
  /privacy-requests:
    post:
      tags: [Privacy]
      summary: Create a tracked privacy request
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequestCreate"
      responses:
        "201":
          description: Privacy request created
    get:
      tags: [Privacy]
      summary: List privacy requests visible to the authenticated user
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Privacy request history
  /me/onboarding:
    get:
      tags: [Identity]
      summary: Return the server-authoritative onboarding and student-journey state
      description: >
        The response follows platform/onboarding-state-machine.json. Browser-local
        progress may be shown as a preview, but role, consent, paid entitlement and
        production assessment state are always resolved server-side.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Current onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
  /me:
    get:
      tags: [Identity]
      summary: Return the authenticated user profile and roles
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Identity]
      summary: Update low-risk account profile preferences
      description: >
        Updates display/profile preferences only. Email, credentials, roles and
        verified relationships require separate higher-security workflows.
        countryCode is contextual metadata and is never proof of residence,
        identity, tax status or payment-provider eligibility.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/relationships:
    get:
      tags: [Identity]
      summary: Return verified/scoped relationships visible to the authenticated user
      description: >
        Read-only account view of parent-student relationships and teacher-student
        assignments. Creating or verifying relationships is intentionally excluded
        until the production verification workflow is finalised.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Relationship and assignment summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /consultation-requests:
    post:
      tags: [Consultation]
      summary: Create an initial consultation request
      description: >
        Accepts only the minimum information required to route educational,
        academic, teacher or institutional professional-service requests.
        Sensitive student records, confidential manuscripts and other private
        documents are not uploaded at this stage.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationRequestCreate"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationRequestReceipt"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /consultation-requests/{requestId}:
    get:
      tags: [Consultation]
      summary: Read a consultation request visible to the authenticated user
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Consultation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /consultation-requests/{requestId}/triage:
    put:
      tags: [Consultation]
      summary: Create or replace the professional triage decision for a consultation request
      description: >
        Consultant/admin-only triage. This classifies the educational service,
        time pressure, evidence actually required and advisor assignment. It is
        not a clinical diagnosis and must not be used to request sensitive
        documents unless they are necessary for the defined service.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationTriageUpdate"
      responses:
        "200":
          description: Triage decision saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationTriage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Request state does not allow triage
        "422":
          $ref: "#/components/responses/ValidationError"

  /appointments:
    get:
      tags: [Appointments]
      summary: List appointments visible to the authenticated user
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Appointment list
    post:
      tags: [Appointments]
      summary: Create a booking for an eligible triaged request
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCreate"
      responses:
        "201":
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "409":
          description: Slot conflict or request not eligible
  /appointments/{appointmentId}:
    patch:
      tags: [Appointments]
      summary: Request an allowed appointment state change
      description: >
        Reschedule/cancel operations are validated against service policy,
        current status, availability and actor permissions. Clients cannot set
        arbitrary terminal states such as COMPLETED.
      security:
        - sessionAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentChangeRequest"
      responses:
        "200":
          description: Appointment updated or reschedule request accepted
        "409":
          description: Transition or requested slot not allowed
  /notifications:
    get:
      tags: [Messaging]
      summary: List private in-app notifications
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Notifications visible to the authenticated user
  /notifications/{notificationId}:
    patch:
      tags: [Messaging]
      summary: Mark a notification read or dismissed
      security:
        - sessionAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [READ, DISMISSED]
      responses:
        "204":
          description: Notification state updated
  /message-threads:
    get:
      tags: [Messaging]
      summary: List secure message threads for the authenticated user
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Message thread list
  /message-threads/{threadId}/messages:
    get:
      tags: [Messaging]
      summary: Read messages in an authorised thread
      security:
        - sessionAuth: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Messages visible to the authenticated participant
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Messaging]
      summary: Send a message to an authorised private thread
      security:
        - sessionAuth: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        "201":
          description: Message created
  /me/communication-preferences:
    get:
      tags: [Messaging]
      summary: Return communication preferences
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Communication preferences
    patch:
      tags: [Messaging]
      summary: Update optional communication preferences
      description: Transactional communication required to deliver an active service is not silently converted into marketing consent.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunicationPreferencesUpdate"
      responses:
        "200":
          description: Preferences updated
  /orders:
    get:
      tags: [Commerce]
      summary: List orders owned by the authenticated user
      description: >
        Read-only order history. Clients cannot mutate order/payment status directly.
        Monetary values are returned in integer minor units with the stored currency.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Order history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /orders/{orderId}:
    get:
      tags: [Commerce]
      summary: Read one authorised order with payment/refund/entitlement summary
      security:
        - sessionAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorised order detail
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /payment-intents:
    post:
      tags: [Commerce]
      summary: Create a provider-neutral payment intent
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentIntentCreate"
      responses:
        "201":
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
  /payments/callback/{provider}:
    post:
      tags: [Commerce]
      summary: Receive and verify a gateway callback/webhook
      description: >
        The server verifies the provider signature/reference and never trusts
        a browser redirect as proof of payment. First production adapters target
        approved Iranian payment gateways; international adapters are deferred.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Callback accepted
        "400":
          description: Invalid callback
  /assessment-sessions:
    post:
      tags: [Assessments]
      summary: Start a versioned assessment session
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentSessionCreate"
      responses:
        "201":
          description: Assessment session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSession"
  /assessment-sessions/{sessionId}/responses:
    patch:
      tags: [Assessments]
      summary: Autosave one or more assessment responses
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [responses]
              properties:
                responses:
                  type: array
                  items:
                    $ref: "#/components/schemas/AssessmentResponseInput"
      responses:
        "200":
          description: Responses saved
  /assessment-sessions/{sessionId}/submit:
    post:
      tags: [Assessments]
      summary: Submit a completed assessment session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "202":
          description: Session accepted for scoring/interpretation
  /me/progress-measurements:
    get:
      tags: [Development]
      summary: List authorised longitudinal progress observations for the current user
      description: >
        Observations remain source-labelled and comparable only within an explicit
        comparability key. The API does not return a synthetic total progress score.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Longitudinal progress observations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgressMeasurement"
    post:
      tags: [Development]
      summary: Record an allowed self-tracked progress observation
      description: >
        Accepts low-risk self-tracked observations only. Institutional, assessment,
        consultant or verified-record sources must be created through their
        authoritative server workflows.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressMeasurementCreate"
      responses:
        "201":
          description: Observation recorded
        "422":
          $ref: "#/components/responses/ValidationError"

  /study-plans:
    get:
      tags: [Development]
      summary: List versioned study plans visible to the current user
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Study plan summaries
    post:
      tags: [Development]
      summary: Create a draft study plan
      description: >
        Creating a plan does not make future AI or professional revisions
        automatically active.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyPlanCreate"
      responses:
        "201":
          description: Draft study plan created

  /study-plans/{planId}/revisions:
    post:
      tags: [Development]
      summary: Propose a versioned adaptive study-plan revision
      description: >
        Revisions are appended, not overwritten. Trigger, rationale and proposed
        capacity are retained. A proposal remains DRAFT until an authorised human
        review/approval step activates it.
      security:
        - sessionAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyPlanRevisionProposal"
      responses:
        "201":
          description: Draft revision proposed
        "409":
          description: Plan state does not permit a new revision

  /study-plan-revisions/{revisionId}/review:
    post:
      tags: [Development]
      summary: Human-review a proposed study-plan revision
      security:
        - sessionAuth: []
      parameters:
        - name: revisionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyPlanRevisionReview"
      responses:
        "200":
          description: Review recorded and revision state updated
        "403":
          $ref: "#/components/responses/Forbidden"

  /decision-support-explanations/{explanationId}:
    get:
      tags: [Development]
      summary: Read an authorised explanation for a consequential recommendation
      description: >
        Supports the "Why this recommendation?" requirement by preserving supporting
        evidence, counterevidence, contextual constraints, uncertainty and review state.
        It never represents an admission guarantee or automatic major/career prescription.
      security:
        - sessionAuth: []
      parameters:
        - name: explanationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Authorised decision-support explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionSupportExplanation"
        "403":
          $ref: "#/components/responses/Forbidden"

  /coaching-enrollments:
    get:
      tags: [Coaching]
      summary: List recurring-development programmes visible to the current user
      description: >
        Payment/entitlement state and professional educational judgement are distinct.
        The endpoint never infers progress merely from an active paid entitlement.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Authorised coaching enrolments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoachingEnrollmentSummary"

  /coaching-enrollments/{enrollmentId}/reviews:
    get:
      tags: [Coaching]
      summary: List human-reviewed periodic development reviews
      security:
        - sessionAuth: []
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Coaching review history

  /reports:
    get:
      tags: [Reports]
      summary: List private report metadata visible to the authenticated user
      description: >
        Returns report metadata and current review state only. Superseded reports
        remain visible in history when the caller is authorised; report content is
        retrieved separately from /reports/{reportId}.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Authorised report history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reports/{reportId}:
    get:
      tags: [Reports]
      summary: Read a private report
      security:
        - sessionAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Report metadata/content
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents:
    get:
      tags: [Files]
      summary: List private document metadata visible to the authenticated user
      description: >
        Returns metadata only for documents owned by the user or exposed through an
        active document_access_grant. Storage keys and provider secrets are never returned.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Authorised private document metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrivateDocumentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /documents/{documentId}/download:
    post:
      tags: [Files]
      summary: Create a short-lived private download instruction
      description: >
        Allowed only when the document is ACTIVE, malware_scan_status is CLEAN and
        the authenticated user has an active READ or DOWNLOAD grant (or is the owner).
        The server returns a short-lived provider URL/instruction; it never exposes storage credentials.
      security:
        - sessionAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Short-lived authorised download instruction
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Document not active/clean or otherwise unavailable

  /files/presign-upload:
    post:
      tags: [Files]
      summary: Create a short-lived private upload instruction
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, fileName, mediaType, sizeBytes]
              properties:
                purpose:
                  type: string
                  enum: [REPORT_CARD, CERTIFICATE, CONSULTATION_DOCUMENT, OTHER_APPROVED]
                fileName:
                  type: string
                  maxLength: 180
                mediaType:
                  type: string
                sizeBytes:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Short-lived upload instruction
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: __Host-session
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    Unauthorized:
      description: Authentication required
    Forbidden:
      description: Authenticated but not authorised for this resource
    NotFound:
      description: Resource not found
    ValidationError:
      description: Validation failed
    RateLimited:
      description: Too many requests
  schemas:
    ProgressMeasurementCreate:
      type: object
      additionalProperties: false
      required: [measureKey, measureLabel, valueNumeric, comparabilityKey, observedAt]
      properties:
        measureKey:
          type: string
          maxLength: 120
        measureLabel:
          type: string
          maxLength: 180
        valueNumeric:
          type: number
        unit:
          type: [string, "null"]
          maxLength: 40
        scaleMin:
          type: [number, "null"]
        scaleMax:
          type: [number, "null"]
        comparabilityKey:
          type: string
          maxLength: 180
        observedAt:
          type: string
          format: date-time
        contextNote:
          type: [string, "null"]
          maxLength: 1000
    ProgressMeasurement:
      allOf:
        - $ref: "#/components/schemas/ProgressMeasurementCreate"
        - type: object
          required: [id, sourceType, provenance, createdAt]
          properties:
            id:
              type: string
              format: uuid
            sourceType:
              type: string
              enum: [GRADE_RECORD, MOCK_EXAM, STUDY_LOG, ASSESSMENT, PERFORMANCE_SAMPLE, TEACHER_RECORD, CONSULTANT_RECORD, SELF_TRACKED, INSTITUTION_IMPORT, OTHER]
            provenance:
              type: object
              additionalProperties: true
            createdAt:
              type: string
              format: date-time
    StudyPlanCreate:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          type: string
          minLength: 10
          maxLength: 1000
        timezone:
          type: [string, "null"]
          maxLength: 80
        startsOn:
          type: [string, "null"]
          format: date
        endsOn:
          type: [string, "null"]
          format: date
    StudyPlanRevisionProposal:
      type: object
      additionalProperties: false
      required: [triggerType, rationale]
      properties:
        triggerType:
          type: string
          enum: [INITIAL, FELL_BEHIND, GRADE_CHANGE, NEW_EXAM, STUDY_HOURS_CHANGE, PRIORITY_CHANGE, TARGET_CHANGE, PROFESSIONAL_REVIEW, OTHER]
        goalSnapshot:
          type: array
          items:
            type: object
            additionalProperties: true
        weeklyCapacityMinutes:
          type: [integer, "null"]
          minimum: 0
        rationale:
          type: string
          minLength: 10
          maxLength: 2500
        aiAssisted:
          type: boolean
          default: false
          description: AI assistance may propose a revision but cannot activate it.
    StudyPlanRevisionReview:
      type: object
      additionalProperties: false
      required: [decision, reviewNote]
      properties:
        decision:
          type: string
          enum: [APPROVE, RETURN, REJECT]
        reviewNote:
          type: string
          minLength: 5
          maxLength: 2500
    DecisionSupportExplanation:
      type: object
      required: [id, recommendationType, supportingEvidence, counterevidence, contextualConstraints, explanation, uncertainty, status]
      properties:
        id:
          type: string
          format: uuid
        recommendationType:
          type: string
        recommendationReference:
          type: [string, "null"]
        supportingEvidence:
          type: array
          items:
            type: string
        counterevidence:
          type: array
          items:
            type: string
        contextualConstraints:
          type: array
          items:
            type: string
        explanation:
          type: string
        uncertainty:
          type: string
        status:
          type: string
          enum: [DRAFT, REVIEW_REQUIRED, APPROVED, SUPERSEDED, VOID]
        humanReviewed:
          type: boolean
        admissionGuarantee:
          type: boolean
          const: false
        automaticMajorPrescription:
          type: boolean
          const: false
        automaticCareerPrescription:
          type: boolean
          const: false
    CoachingEnrollmentSummary:
      type: object
      required: [id, programmeType, status, startsAt]
      properties:
        id:
          type: string
          format: uuid
        programmeType:
          type: string
          enum: [MONTHLY_COACHING, QUARTERLY_REVIEW, ANNUAL_DEVELOPMENT, PREMIUM_LONG_TERM]
        status:
          type: string
          enum: [PENDING, ACTIVE, PAUSED, COMPLETED, CANCELLED, EXPIRED]
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: [string, "null"]
          format: date-time
        entitlementStatus:
          type: [string, "null"]
          description: Commercial access state only; never a judgement of educational progress.
    ReportSummary:
      type: object
      required: [id, reportType, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reportType:
          type: string
          enum: [FREE_SNAPSHOT, STANDARD, PROFESSIONAL, INTEGRATED_TALENT_PROFILE, GOLDEN_PATH, HUMAN_REVIEWED]
        status:
          type: string
          enum: [GENERATING, READY, SUPERSEDED, REVOKED]
        assessmentSessionId:
          type: [string, "null"]
          format: uuid
        generatedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        humanReviewStatus:
          type: [string, "null"]
          enum: [REQUESTED, IN_REVIEW, APPROVED, REVISED, DECLINED, null]
    PrivateDocumentSummary:
      type: object
      required: [id, documentType, originalFileName, mediaType, sizeBytes, malwareScanStatus, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        documentType:
          type: string
          enum: [REPORT_CARD, CERTIFICATE, CONSULTATION_DOCUMENT, ASSESSMENT_ATTACHMENT, OTHER_APPROVED]
        originalFileName:
          type: string
          maxLength: 180
        mediaType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
        malwareScanStatus:
          type: string
          enum: [PENDING, CLEAN, BLOCKED, FAILED]
        retentionClass:
          type: string
        status:
          type: string
          enum: [ACTIVE, QUARANTINED, DELETED, EXPIRED]
        createdAt:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            type: string
            enum: [READ, DOWNLOAD, REVIEW]
    RelationshipSummary:
      type: object
      required: [parentRelationships, teacherAssignments]
      properties:
        parentRelationships:
          type: array
          items:
            $ref: "#/components/schemas/ParentStudentRelationship"
        teacherAssignments:
          type: array
          items:
            $ref: "#/components/schemas/TeacherStudentAssignment"
    ParentStudentRelationship:
      type: object
      required: [id, status, requestedAt]
      properties:
        id:
          type: string
          format: uuid
        relationshipLabel:
          type: [string, "null"]
          maxLength: 120
        status:
          type: string
          enum: [REQUESTED, PENDING_VERIFICATION, ACTIVE, REJECTED, REVOKED, EXPIRED]
        requestedAt:
          type: string
          format: date-time
        verifiedAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
    TeacherStudentAssignment:
      type: object
      required: [id, status, startsAt, scope]
      properties:
        id:
          type: string
          format: uuid
        institutionLabel:
          type: [string, "null"]
          maxLength: 160
        classLabel:
          type: [string, "null"]
          maxLength: 160
        scope:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, ENDED]
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: [string, "null"]
          format: date-time
    CurrentUser:
      type: object
      required: [id, roles]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: [string, "null"]
          maxLength: 120
        preferredLanguage:
          type: string
          enum: [fa, en]
        timezone:
          type: [string, "null"]
          maxLength: 80
        countryCode:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
        roles:
          type: array
          items:
            type: string
            enum: [STUDENT, PARENT, TEACHER, CONSULTANT, COUNSELLOR, RESEARCHER, CONSULTATION_CLIENT, INSTITUTION, EDITOR, ADMIN, SUPER_ADMIN]
    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: [string, "null"]
          maxLength: 120
        preferredLanguage:
          type: string
          enum: [fa, en]
        timezone:
          type: [string, "null"]
          maxLength: 80
        countryCode:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
    OnboardingState:
      type: object
      required: [state, nextActions]
      properties:
        state:
          type: string
          enum:
            - VISITOR
            - ACCOUNT_PENDING
            - AUTHENTICATED
            - ROLE_PENDING
            - CONSENT_PENDING
            - READY
            - RCAS_IN_PROGRESS
            - ROUTED
            - DEEP_MODULE
            - GOLDEN_PATH_REVIEW
            - BAHAR_ACTIVE
        nextActions:
          type: array
          items:
            type: string
        roleVerificationRequired:
          type: boolean
        requiredConsents:
          type: array
          items:
            type: string
        activeEntitlements:
          type: array
          items:
            type: string
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [email, mobileE164, credential, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        mobileE164:
          type: string
          pattern: "^\\+[1-9][0-9]{7,14}$"
        credential:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
        role:
          type: string
          enum: [STUDENT, PARENT, TEACHER, CONSULTANT, RESEARCHER, CONSULTATION_CLIENT]
    EmailVerification:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          writeOnly: true
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, credential]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        credential:
          type: string
          minLength: 8
          maxLength: 1024
          writeOnly: true
    RecoveryRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    RecoveryConfirmation:
      type: object
      additionalProperties: false
      required: [token, newCredential]
      properties:
        token:
          type: string
          minLength: 20
          writeOnly: true
        newCredential:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
    ConsentDecision:
      type: object
      additionalProperties: false
      required: [consentType, policyVersion, decision]
      properties:
        consentType:
          type: string
          enum: [PRIVACY, SERVICE, RESEARCH, PUBLICATION, MARKETING]
        policyVersion:
          type: string
          maxLength: 80
        decision:
          type: string
          enum: [GRANTED, DECLINED, WITHDRAWN]
    PrivacyRequestCreate:
      type: object
      additionalProperties: false
      required: [requestType]
      properties:
        requestType:
          type: string
          enum: [ACCESS, CORRECTION, EXPORT, DELETION, RESTRICTION, CONSENT_WITHDRAWAL]
        userNote:
          type: string
          maxLength: 2500
    ConsultationRequestCreate:
      type: object
      additionalProperties: false
      required:
        - serviceType
        - primaryQuestion
        - preferredLanguage
        - contactEmail
        - privacyAccepted
      properties:
        serviceType:
          type: string
          enum:
            - ACADEMIC_COUNSELLING
            - FIELD_SELECTION
            - ENTRANCE_EXAM
            - TALENT_IDENTIFICATION
            - REPORT_CARD_ANALYSIS
            - PARENT_COUNSELLING
            - ACADEMIC_ENGLISH_EDITING
            - MANUSCRIPT_DIAGNOSTIC
            - RESEARCH_CONSULTATION
            - PUBLICATION_CONSULTATION
            - REVIEWER_RESPONSE_SUPPORT
            - ACADEMIC_CAREER_CONSULTATION
            - TEACHER_MENTORING
            - ASSESSMENT_CONSULTATION
            - INSTITUTIONAL_CONSULTING
            - SPEAKING_TRAINING
        requesterContext:
          type: [string, "null"]
          enum: [STUDENT, PARENT, RESEARCHER, ACADEMIC, TEACHER, EDUCATOR, INSTITUTION, PROFESSIONAL, OTHER, null]
        contextLabel:
          type: [string, "null"]
          maxLength: 160
          description: Minimal routing context only; never use for confidential manuscript text, sensitive student records or secrets.
        educationStage:
          type: [string, "null"]
          maxLength: 80
          description: Optional and relevant mainly to student/parent educational services.
        primaryQuestion:
          type: string
          minLength: 20
          maxLength: 2500
        relevantDeadline:
          type: [string, "null"]
          format: date
        preferredLanguage:
          type: string
          enum: [fa, en]
        contactEmail:
          type: string
          format: email
        contactName:
          type: [string, "null"]
          maxLength: 120
        documentAvailability:
          type: array
          description: Availability metadata only; the initial request does not accept sensitive file uploads.
          items:
            type: string
            enum: [REPORT_CARD, EXAM_RESULT, FIELD_LIST, PRIOR_ASSESSMENT, MANUSCRIPT_DRAFT, REVIEWER_COMMENTS, ACADEMIC_CV, OTHER]
        privacyAccepted:
          type: boolean
          const: true
    ConsultationRequestReceipt:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [SUBMITTED]
        createdAt:
          type: string
          format: date-time
    ConsultationRequest:
      allOf:
        - $ref: "#/components/schemas/ConsultationRequestReceipt"
        - type: object
          properties:
            serviceType:
              type: string
            requesterContext:
              type: [string, "null"]
            contextLabel:
              type: [string, "null"]
            educationStage:
              type: [string, "null"]
            primaryQuestion:
              type: string
    ConsultationTriageUpdate:
      type: object
      additionalProperties: false
      required:
        - serviceType
        - priority
        - readiness
        - requiredEvidence
      properties:
        serviceType:
          type: string
          enum:
            - ACADEMIC_COUNSELLING
            - FIELD_SELECTION
            - ENTRANCE_EXAM
            - TALENT_IDENTIFICATION
            - REPORT_CARD_ANALYSIS
            - PARENT_COUNSELLING
            - ACADEMIC_ENGLISH_EDITING
            - MANUSCRIPT_DIAGNOSTIC
            - RESEARCH_CONSULTATION
            - PUBLICATION_CONSULTATION
            - REVIEWER_RESPONSE_SUPPORT
            - ACADEMIC_CAREER_CONSULTATION
            - TEACHER_MENTORING
            - ASSESSMENT_CONSULTATION
            - INSTITUTIONAL_CONSULTING
            - SPEAKING_TRAINING
        priority:
          type: string
          description: Educational/service time pressure; not a medical or crisis-severity label.
          enum: [STANDARD, DEADLINE_SENSITIVE, HIGH_TIME_PRESSURE]
        relevantDeadline:
          type: [string, "null"]
          format: date
        readiness:
          type: string
          enum: [READY_TO_BOOK, NEEDS_CLARIFICATION, NEEDS_EVIDENCE, OUT_OF_SCOPE]
        requiredEvidence:
          type: array
          uniqueItems: true
          maxItems: 8
          items:
            type: string
            enum:
              - REPORT_CARD
              - EXAM_RESULT
              - FIELD_LIST
              - PRIOR_ASSESSMENT
              - GOAL_NOTES
              - NONE_AT_TRIAGE
              - OTHER
        advisorUserId:
          type: [string, "null"]
          format: uuid
        internalSummary:
          type: [string, "null"]
          maxLength: 1500
        nextAction:
          type: [string, "null"]
          maxLength: 500
    ConsultationTriage:
      allOf:
        - $ref: "#/components/schemas/ConsultationTriageUpdate"
        - type: object
          required: [requestId, triagedAt, triagedByUserId]
          properties:
            requestId:
              type: string
              format: uuid
            triagedAt:
              type: string
              format: date-time
            triagedByUserId:
              type: string
              format: uuid
            version:
              type: integer
              minimum: 1

    AppointmentCreate:
      type: object
      required: [consultationRequestId, startsAt, timezone]
      properties:
        consultationRequestId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        timezone:
          type: string
          example: Asia/Tehran
    Appointment:
      type: object
      required: [id, status, startsAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [BOOKED, AWAITING_PAYMENT, CONFIRMED, CANCELLED, COMPLETED, NO_SHOW]
        startsAt:
          type: string
          format: date-time
    AppointmentChangeRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [RESCHEDULE, CANCEL]
        requestedStartsAt:
          type: string
          format: date-time
        timezone:
          type: string
        reason:
          type: string
          maxLength: 500
    CommunicationPreferencesUpdate:
      type: object
      additionalProperties: false
      properties:
        allowAppointmentReminders:
          type: boolean
        allowProductUpdates:
          type: boolean
        allowMarketing:
          type: boolean
        preferredChannel:
          type: string
          enum: [EMAIL, IN_APP]
    OrderSummary:
      type: object
      required: [id, status, currency, totalMinor, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, AWAITING_PAYMENT, PAID, FULFILLING, COMPLETED, CANCELLED, REFUNDED, PARTIALLY_REFUNDED]
        currency:
          type: string
          minLength: 3
          maxLength: 3
        subtotalMinor:
          type: integer
          minimum: 0
        discountMinor:
          type: integer
          minimum: 0
        totalMinor:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        latestPaymentStatus:
          type: [string, "null"]
          enum: [CREATED, PENDING, PAID, FAILED, CANCELLED, REFUNDED, null]
        refundStatus:
          type: [string, "null"]
          enum: [REQUESTED, PENDING, COMPLETED, FAILED, CANCELLED, null]
        invoiceNumber:
          type: [string, "null"]
        entitlementStatuses:
          type: array
          items:
            type: string
            enum: [ACTIVE, EXPIRED, REVOKED]
    PaymentIntentCreate:
      type: object
      required: [orderId, amountMinor, currency]
      properties:
        orderId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          minimum: 1
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO-style currency code. Iranian launch uses IRR; UI may display toman while backend amounts remain integer rial.
    PaymentIntent:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [CREATED, PENDING, PAID, FAILED, CANCELLED, REFUNDED]
        redirectUrl:
          type: string
          format: uri
    AssessmentSessionCreate:
      type: object
      required: [assessmentVersionId]
      properties:
        assessmentVersionId:
          type: string
          format: uuid
        subjectProfileId:
          type: string
          format: uuid
    AssessmentSession:
      type: object
      required: [id, assessmentVersionId, status]
      properties:
        id:
          type: string
          format: uuid
        assessmentVersionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [IN_PROGRESS, SUBMITTED, SCORING, COMPLETE, CANCELLED]
    AssessmentResponseInput:
      type: object
      required: [itemId, value]
      properties:
        itemId:
          type: string
          format: uuid
        value: {}
        clientUpdatedAt:
          type: string
          format: date-time
