openapi: 3.1.0
info:
  title: Dr. Javad Rezazadeh Yazdeli Ecosystem API
  version: 1.0.0
  description: >
    Provider-neutral API contract for consultation, accounts, assessments,
    reports, commerce and private educational records. This is a contract
    document, not a live production endpoint.
servers:
  - url: https://app.drjavadrezazadeh.com/api/v1
    description: Future production
  - url: https://staging.app.drjavadrezazadeh.com/api/v1
    description: Future staging
tags:
  - name: System
  - name: Identity
  - name: Privacy
  - name: Consultation
  - name: Appointments
  - name: Messaging
  - name: Commerce
  - name: Assessments
  - name: Reports
  - name: Files
paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      responses:
        "200":
          description: Service healthy
  /auth/session:
    post:
      tags: [Identity]
      summary: Create an authenticated session
      description: >
        Accept verified credentials through the production identity provider and
        issue a Secure, HttpOnly, SameSite session cookie. The API response must
        not expose the session secret to browser JavaScript.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "204":
          description: Session established
        "401":
          description: Invalid credentials
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [Identity]
      summary: End the current authenticated session
      security:
        - sessionAuth: []
      responses:
        "204":
          description: Session revoked and cookie cleared
  /auth/recovery-requests:
    post:
      tags: [Identity]
      summary: Request account recovery without revealing account existence
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryRequest"
      responses:
        "202":
          description: Neutral response returned whether or not the account exists
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/recovery-confirmations:
    post:
      tags: [Identity]
      summary: Complete recovery with a short-lived single-use token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryConfirmation"
      responses:
        "204":
          description: Credential reset and relevant sessions revoked
        "400":
          $ref: "#/components/responses/ValidationError"
  /me/consents:
    get:
      tags: [Privacy]
      summary: Return the authenticated user's versioned consent records
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Consent records
    post:
      tags: [Privacy]
      summary: Record a new consent decision without overwriting history
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentDecision"
      responses:
        "201":
          description: Consent decision recorded
  /privacy-requests:
    post:
      tags: [Privacy]
      summary: Create a tracked privacy request
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequestCreate"
      responses:
        "201":
          description: Privacy request created
    get:
      tags: [Privacy]
      summary: List privacy requests visible to the authenticated user
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Privacy request history
  /me/onboarding:
    get:
      tags: [Identity]
      summary: Return the server-authoritative onboarding and student-journey state
      description: >
        The response follows platform/onboarding-state-machine.json. Browser-local
        progress may be shown as a preview, but role, consent, paid entitlement and
        production assessment state are always resolved server-side.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Current onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
  /me:
    get:
      tags: [Identity]
      summary: Return the authenticated user profile and roles
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Identity]
      summary: Update low-risk account profile preferences
      description: >
        Updates display/profile preferences only. Email, credentials, roles and
        verified relationships require separate higher-security workflows.
        countryCode is contextual metadata and is never proof of residence,
        identity, tax status or payment-provider eligibility.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/relationships:
    get:
      tags: [Identity]
      summary: Return verified/scoped relationships visible to the authenticated user
      description: >
        Read-only account view of parent-student relationships and teacher-student
        assignments. Creating or verifying relationships is intentionally excluded
        until the production verification workflow is finalised.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Relationship and assignment summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /consultation-requests:
    post:
      tags: [Consultation]
      summary: Create an initial consultation request
      description: >
        Accepts only the minimum information required for triage. Sensitive
        documents are not uploaded at this stage.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationRequestCreate"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationRequestReceipt"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /consultation-requests/{requestId}:
    get:
      tags: [Consultation]
      summary: Read a consultation request visible to the authenticated user
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Consultation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /appointments:
    get:
      tags: [Appointments]
      summary: List appointments visible to the authenticated user
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Appointment list
    post:
      tags: [Appointments]
      summary: Create a booking for an eligible triaged request
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCreate"
      responses:
        "201":
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "409":
          description: Slot conflict or request not eligible
  /appointments/{appointmentId}:
    patch:
      tags: [Appointments]
      summary: Request an allowed appointment state change
      description: >
        Reschedule/cancel operations are validated against service policy,
        current status, availability and actor permissions. Clients cannot set
        arbitrary terminal states such as COMPLETED.
      security:
        - sessionAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentChangeRequest"
      responses:
        "200":
          description: Appointment updated or reschedule request accepted
        "409":
          description: Transition or requested slot not allowed
  /notifications:
    get:
      tags: [Messaging]
      summary: List private in-app notifications
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Notifications visible to the authenticated user
  /notifications/{notificationId}:
    patch:
      tags: [Messaging]
      summary: Mark a notification read or dismissed
      security:
        - sessionAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [READ, DISMISSED]
      responses:
        "204":
          description: Notification state updated
  /message-threads:
    get:
      tags: [Messaging]
      summary: List secure message threads for the authenticated user
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Message thread list
  /message-threads/{threadId}/messages:
    get:
      tags: [Messaging]
      summary: Read messages in an authorised thread
      security:
        - sessionAuth: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Messages visible to the authenticated participant
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Messaging]
      summary: Send a message to an authorised private thread
      security:
        - sessionAuth: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        "201":
          description: Message created
  /me/communication-preferences:
    get:
      tags: [Messaging]
      summary: Return communication preferences
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Communication preferences
    patch:
      tags: [Messaging]
      summary: Update optional communication preferences
      description: Transactional communication required to deliver an active service is not silently converted into marketing consent.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunicationPreferencesUpdate"
      responses:
        "200":
          description: Preferences updated
  /payment-intents:
    post:
      tags: [Commerce]
      summary: Create a provider-neutral payment intent
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentIntentCreate"
      responses:
        "201":
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
  /payments/callback/{provider}:
    post:
      tags: [Commerce]
      summary: Receive and verify a gateway callback/webhook
      description: >
        The server verifies the provider signature/reference and never trusts
        a browser redirect as proof of payment. First production adapters target
        approved Iranian payment gateways; international adapters are deferred.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Callback accepted
        "400":
          description: Invalid callback
  /assessment-sessions:
    post:
      tags: [Assessments]
      summary: Start a versioned assessment session
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentSessionCreate"
      responses:
        "201":
          description: Assessment session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSession"
  /assessment-sessions/{sessionId}/responses:
    patch:
      tags: [Assessments]
      summary: Autosave one or more assessment responses
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [responses]
              properties:
                responses:
                  type: array
                  items:
                    $ref: "#/components/schemas/AssessmentResponseInput"
      responses:
        "200":
          description: Responses saved
  /assessment-sessions/{sessionId}/submit:
    post:
      tags: [Assessments]
      summary: Submit a completed assessment session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "202":
          description: Session accepted for scoring/interpretation
  /reports/{reportId}:
    get:
      tags: [Reports]
      summary: Read a private report
      security:
        - sessionAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Report metadata/content
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /files/presign-upload:
    post:
      tags: [Files]
      summary: Create a short-lived private upload instruction
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, fileName, mediaType, sizeBytes]
              properties:
                purpose:
                  type: string
                  enum: [REPORT_CARD, CERTIFICATE, CONSULTATION_DOCUMENT, OTHER_APPROVED]
                fileName:
                  type: string
                  maxLength: 180
                mediaType:
                  type: string
                sizeBytes:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Short-lived upload instruction
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: __Host-session
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    Unauthorized:
      description: Authentication required
    Forbidden:
      description: Authenticated but not authorised for this resource
    NotFound:
      description: Resource not found
    ValidationError:
      description: Validation failed
    RateLimited:
      description: Too many requests
  schemas:
    RelationshipSummary:
      type: object
      required: [parentRelationships, teacherAssignments]
      properties:
        parentRelationships:
          type: array
          items:
            $ref: "#/components/schemas/ParentStudentRelationship"
        teacherAssignments:
          type: array
          items:
            $ref: "#/components/schemas/TeacherStudentAssignment"
    ParentStudentRelationship:
      type: object
      required: [id, status, requestedAt]
      properties:
        id:
          type: string
          format: uuid
        relationshipLabel:
          type: [string, "null"]
          maxLength: 120
        status:
          type: string
          enum: [REQUESTED, PENDING_VERIFICATION, ACTIVE, REJECTED, REVOKED, EXPIRED]
        requestedAt:
          type: string
          format: date-time
        verifiedAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
    TeacherStudentAssignment:
      type: object
      required: [id, status, startsAt, scope]
      properties:
        id:
          type: string
          format: uuid
        institutionLabel:
          type: [string, "null"]
          maxLength: 160
        classLabel:
          type: [string, "null"]
          maxLength: 160
        scope:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, ENDED]
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: [string, "null"]
          format: date-time
    CurrentUser:
      type: object
      required: [id, roles]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: [string, "null"]
          maxLength: 120
        preferredLanguage:
          type: string
          enum: [fa, en]
        timezone:
          type: [string, "null"]
          maxLength: 80
        countryCode:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
        roles:
          type: array
          items:
            type: string
            enum: [STUDENT, PARENT, TEACHER, CONSULTANT, RESEARCHER, EDITOR, ADMIN, SUPER_ADMIN]
    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: [string, "null"]
          maxLength: 120
        preferredLanguage:
          type: string
          enum: [fa, en]
        timezone:
          type: [string, "null"]
          maxLength: 80
        countryCode:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
    OnboardingState:
      type: object
      required: [state, nextActions]
      properties:
        state:
          type: string
          enum:
            - VISITOR
            - ACCOUNT_PENDING
            - AUTHENTICATED
            - ROLE_PENDING
            - CONSENT_PENDING
            - READY
            - RCAS_IN_PROGRESS
            - ROUTED
            - DEEP_MODULE
            - GOLDEN_PATH_REVIEW
            - BAHAR_ACTIVE
        nextActions:
          type: array
          items:
            type: string
        roleVerificationRequired:
          type: boolean
        requiredConsents:
          type: array
          items:
            type: string
        activeEntitlements:
          type: array
          items:
            type: string
    SignInRequest:
      type: object
      additionalProperties: false
      required: [identifier, credential]
      properties:
        identifier:
          type: string
          maxLength: 320
        credential:
          type: string
          minLength: 8
          maxLength: 1024
          writeOnly: true
    RecoveryRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    RecoveryConfirmation:
      type: object
      additionalProperties: false
      required: [token, newCredential]
      properties:
        token:
          type: string
          minLength: 20
          writeOnly: true
        newCredential:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
    ConsentDecision:
      type: object
      additionalProperties: false
      required: [consentType, policyVersion, decision]
      properties:
        consentType:
          type: string
          enum: [PRIVACY, SERVICE, RESEARCH, PUBLICATION, MARKETING]
        policyVersion:
          type: string
          maxLength: 80
        decision:
          type: string
          enum: [GRANTED, DECLINED, WITHDRAWN]
    PrivacyRequestCreate:
      type: object
      additionalProperties: false
      required: [requestType]
      properties:
        requestType:
          type: string
          enum: [ACCESS, CORRECTION, EXPORT, DELETION, RESTRICTION, CONSENT_WITHDRAWAL]
        userNote:
          type: string
          maxLength: 2500
    ConsultationRequestCreate:
      type: object
      additionalProperties: false
      required:
        - serviceType
        - educationStage
        - primaryQuestion
        - preferredLanguage
        - contactEmail
        - privacyAccepted
      properties:
        serviceType:
          type: string
          enum:
            - ACADEMIC_COUNSELLING
            - FIELD_SELECTION
            - ENTRANCE_EXAM
            - TALENT_IDENTIFICATION
            - REPORT_CARD_ANALYSIS
            - PARENT_COUNSELLING
        educationStage:
          type: string
          maxLength: 80
        primaryQuestion:
          type: string
          minLength: 20
          maxLength: 2500
        relevantDeadline:
          type: string
          format: date
        preferredLanguage:
          type: string
          enum: [fa, en]
        contactEmail:
          type: string
          format: email
        contactName:
          type: string
          maxLength: 120
        documentAvailability:
          type: array
          items:
            type: string
            enum: [REPORT_CARD, EXAM_RESULT, FIELD_LIST, PRIOR_ASSESSMENT, OTHER]
        privacyAccepted:
          type: boolean
          const: true
    ConsultationRequestReceipt:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [SUBMITTED]
        createdAt:
          type: string
          format: date-time
    ConsultationRequest:
      allOf:
        - $ref: "#/components/schemas/ConsultationRequestReceipt"
        - type: object
          properties:
            serviceType:
              type: string
            educationStage:
              type: string
            primaryQuestion:
              type: string
    AppointmentCreate:
      type: object
      required: [consultationRequestId, startsAt, timezone]
      properties:
        consultationRequestId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        timezone:
          type: string
          example: Asia/Tehran
    Appointment:
      type: object
      required: [id, status, startsAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [BOOKED, AWAITING_PAYMENT, CONFIRMED, CANCELLED, COMPLETED, NO_SHOW]
        startsAt:
          type: string
          format: date-time
    AppointmentChangeRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [RESCHEDULE, CANCEL]
        requestedStartsAt:
          type: string
          format: date-time
        timezone:
          type: string
        reason:
          type: string
          maxLength: 500
    CommunicationPreferencesUpdate:
      type: object
      additionalProperties: false
      properties:
        allowAppointmentReminders:
          type: boolean
        allowProductUpdates:
          type: boolean
        allowMarketing:
          type: boolean
        preferredChannel:
          type: string
          enum: [EMAIL, IN_APP]
    PaymentIntentCreate:
      type: object
      required: [orderId, amountMinor, currency]
      properties:
        orderId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          minimum: 1
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO-style currency code. Iranian launch uses IRR; UI may display toman while backend amounts remain integer rial.
    PaymentIntent:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [CREATED, PENDING, PAID, FAILED, CANCELLED, REFUNDED]
        redirectUrl:
          type: string
          format: uri
    AssessmentSessionCreate:
      type: object
      required: [assessmentVersionId]
      properties:
        assessmentVersionId:
          type: string
          format: uuid
        subjectProfileId:
          type: string
          format: uuid
    AssessmentSession:
      type: object
      required: [id, assessmentVersionId, status]
      properties:
        id:
          type: string
          format: uuid
        assessmentVersionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [IN_PROGRESS, SUBMITTED, SCORING, COMPLETE, CANCELLED]
    AssessmentResponseInput:
      type: object
      required: [itemId, value]
      properties:
        itemId:
          type: string
          format: uuid
        value: {}
        clientUpdatedAt:
          type: string
          format: date-time
