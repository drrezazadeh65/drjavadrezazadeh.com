<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>نمونه رابط مدیریت | RAVE</title><style>:root{font-family:Tahoma,Arial,sans-serif;color:#172536;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:#172536;color:#fff;padding:24px}aside h1{font-size:1.25rem}nav button{display:block;width:100%;background:transparent;border:0;color:#d9e4ef;text-align:right;padding:12px;border-radius:9px;cursor:pointer}nav button[aria-current=page]{background:#30485f;color:#fff}main{padding:32px;max-width:1200px;width:100%}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.pill{background:#fff1d8;padding:9px 13px;border-radius:30px;font-size:.82rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:25px}.card{background:#fff;padding:23px;border:1px solid #e2e8ef;border-radius:14px}.card h3{margin-top:0;font-size:1rem}.muted{color:#596b7b}.value{font-size:1.35rem;font-weight:bold}.panel{margin-top:20px;background:#fff;padding:25px;border-radius:14px;border:1px solid #e2e8ef}button:focus-visible{outline:3px solid #1d7fa8} @media(max-width:740px){.app{grid-template-columns:1fr}aside{padding:15px}nav{display:flex;overflow-x:auto}nav button{min-width:125px;text-align:center}main{padding:18px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="app"><aside><h1>مرکز فرماندهی سایت</h1><p>نمونه توسعه — بدون اطلاعات زنده</p><nav aria-label="بخش‌های مدیریت" id="nav"></nav></aside><main><div class="top"><div><h1 id="heading">نمای کلی</h1><p class="muted">نمونه بصری اولیه؛ ورود امن و اتصال داده‌ها هنوز پیاده‌سازی نشده است.</p></div><span class="pill">غیرعملیاتی · داده زنده متصل نیست</span></div><div class="grid" id="cards"></div><section class="panel"><h2>وضعیت اتصال</h2><p id="detail" class="muted">اطلاعات واقعی تنها پس از اتصال امن و احراز هویت قابل نمایش خواهند بود.</p></section></main></div><script type="module">import {MODULES} from './admin-shell.mjs';const nav=document.querySelector('#nav'),cards=document.querySelector('#cards'),heading=document.querySelector('#heading'),detail=document.querySelector('#detail');function select(m){heading.textContent=m.fa;for(const b of nav.children)b.setAttribute('aria-current',b.dataset.id===m.id?'page':'false');cards.replaceChildren();for(const label of ['وضعیت موتور','گزارش‌ها و نمودارها','تنظیمات و کنترل‌ها']){const el=document.createElement('article');el.className='card';const h=document.createElement('h3');h.textContent=label;const p=document.createElement('p');p.className='value';p.textContent='هنوز متصل نیست';el.append(h,p);cards.append(el)}detail.textContent='بخش «'+m.fa+'» در نسخه نمایشی قابل مشاهده است؛ هیچ داده مالی، کاربری یا سئوی واقعی بارگذاری نشده است.'}for(const m of MODULES){const b=document.createElement('button');b.textContent=m.fa;b.dataset.id=m.id;b.addEventListener('click',()=>select(m));nav.append(b)}select(MODULES[0]);</script></body></html>
