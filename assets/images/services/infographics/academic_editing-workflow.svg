<?xml version="1.0" encoding="utf-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ویرایش انگلیسی دانشگاهی تا ۵۰۰۰ کلمه — نقشه علمی خدمت</title><desc id="desc">برای متن دانشگاهی تا ۵۰۰۰ کلمه که از نظر علمی شکل گرفته و به پالایش انگلیسی نیاز دارد.؛ نسخه ویرایش‌شده با تمرکز بر وضوح، دقت زبانی و بیان دانشگاهی.؛ ویرایش زبان جایگزین بازطراحی پژوهش یا تولید محتوای علمی از سوی ویراستار نیست.</desc><defs><radialGradient id="bg"><stop stop-color="#27221A"/><stop offset="1" stop-color="#0B0B0B"/></radialGradient><linearGradient id="edge"><stop stop-color="#D4AF37"/><stop offset="1" stop-color="#A88955"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><rect x="28" y="28" width="1544" height="844" rx="36" fill="none" stroke="#A88955" stroke-width="2"/><path d="M80 90 H1520" stroke="#D4AF37" opacity=".3"/><g font-family="Tahoma,Arial,sans-serif"><text x="1515" y="143" text-anchor="end" direction="rtl" font-size="44" font-weight="bold" fill="#F8F5E9">ویرایش انگلیسی دانشگاهی تا ۵۰۰۰ کلمه</text><text x="1515" y="191" text-anchor="end" direction="rtl" font-size="25" fill="#D4AF37">نقشه خدمت | تصمیم مبتنی بر شواهد و خروجی قابل‌توضیح</text><rect x="840" y="236" width="660" height="210" rx="25" fill="#1F1F1F" stroke="url(#edge)"/><text x="1440" y="294" text-anchor="end" direction="rtl" font-size="28" font-weight="bold" fill="#D4AF37">مسئله و مخاطب</text><text x="1440" y="342" text-anchor="end" direction="rtl" fill="#F8F5E9" font-size="25">برای متن دانشگاهی تا ۵۰۰۰ کلمه که از</text><text x="1440" y="379" text-anchor="end" direction="rtl" fill="#F8F5E9" font-size="25">نظر علمی شکل گرفته و به پالایش</text><text x="1440" y="416" text-anchor="end" direction="rtl" fill="#F8F5E9" font-size="25">انگلیسی نیاز دارد.</text><rect x="100" y="236" width="660" height="210" rx="25" fill="#1F1F1F" stroke="url(#edge)"/><text x="700" y="294" text-anchor="end" direction="rtl" font-size="28" font-weight="bold" fill="#D4AF37">خروجی قابل انتظار</text><text x="700" y="342" text-anchor="end" direction="rtl" fill="#F8F5E9" font-size="25">نسخه ویرایش‌شده با تمرکز بر وضوح،</text><text x="700" y="379" text-anchor="end" direction="rtl" fill="#F8F5E9" font-size="25">دقت زبانی و بیان دانشگاهی.</text><path d="M195 490 Q500 370 800 490 Q1100 610 1410 490" stroke="#D4AF37" stroke-width="3" fill="none"/><circle cx="195" cy="490" r="25" fill="#D4AF37"/><circle cx="1410" cy="490" r="25" fill="#D4AF37"/><circle cx="800" cy="490" r="28" fill="#F8F5E9" stroke="#D4AF37" stroke-width="4"/><rect x="100" y="570" width="1400" height="200" rx="25" fill="#201F1D" stroke="#A88955" stroke-width="2"/><text x="1440" y="633" text-anchor="end" direction="rtl" font-size="29" font-weight="bold" fill="#D4AF37">مرز حرفه‌ای و محدودیت تفسیر</text><text x="1440" y="684" text-anchor="end" direction="rtl" fill="#F8F5E9" font-size="25">ویرایش زبان جایگزین بازطراحی پژوهش یا تولید محتوای علمی از</text><text x="1440" y="721" text-anchor="end" direction="rtl" fill="#F8F5E9" font-size="25">سوی ویراستار نیست.</text><text x="800" y="833" font-size="19" fill="#AAA18F" text-anchor="middle">DRJAVADREZAZADEH.COM · EVIDENCE-LED PROFESSIONAL SERVICES</text></g></svg>