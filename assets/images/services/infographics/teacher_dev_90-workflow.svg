<?xml version="1.0" encoding="utf-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">جلسه توسعه حرفه‌ای مدرس — نقشه علمی خدمت</title><desc id="desc">برای مدرسی که می‌خواهد یک مسئله حرفه‌ای را عمیق‌تر تحلیل و برای رشد بعدی برنامه‌ریزی کند.؛ جلسه ۹۰ دقیقه‌ای توسعه حرفه‌ای با تمرکز بر شواهد، قضاوت حرفه‌ای و اقدام بعدی.؛ گواهی یا ارتقای رسمی سازمانی تضمین نمی‌شود.</desc><defs><radialGradient id="bg"><stop stop-color="#27221A"/><stop offset="1" stop-color="#0B0B0B"/></radialGradient><linearGradient id="edge"><stop stop-color="#D4AF37"/><stop offset="1" stop-color="#A88955"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><rect x="28" y="28" width="1544" height="844" rx="36" fill="none" stroke="#A88955" stroke-width="2"/><path d="M80 90 H1520" stroke="#D4AF37" opacity=".3"/><g font-family="Tahoma,Arial,sans-serif"><text x="1515" y="143" text-anchor="end" direction="rtl" font-size="44" font-weight="bold" fill="#F8F5E9">جلسه توسعه حرفه‌ای مدرس</text><text x="1515" y="191" text-anchor="end" direction="rtl" font-size="25" fill="#D4AF37">نقشه خدمت | تصمیم مبتنی بر شواهد و خروجی قابل‌توضیح</text><rect x="840" y="236" width="660" height="210" rx="25" fill="#1F1F1F" stroke="url(#edge)"/><text x="1440" y="294" text-anchor="end" direction="rtl" font-size="28" font-weight="bold" fill="#D4AF37">مسئله و مخاطب</text><text x="1440" y="342" text-anchor="end" direction="rtl" fill="#F8F5E9" font-size="25">برای مدرسی که می‌خواهد یک مسئله</text><text x="1440" y="379" text-anchor="end" direction="rtl" fill="#F8F5E9" font-size="25">حرفه‌ای را عمیق‌تر تحلیل و برای رشد</text><text x="1440" y="416" text-anchor="end" direction="rtl" fill="#F8F5E9" font-size="25">بعدی برنامه‌ریزی کند.</text><rect x="100" y="236" width="660" height="210" rx="25" fill="#1F1F1F" stroke="url(#edge)"/><text x="700" y="294" text-anchor="end" direction="rtl" font-size="28" font-weight="bold" fill="#