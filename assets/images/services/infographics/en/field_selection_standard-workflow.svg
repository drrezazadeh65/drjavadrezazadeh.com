<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Standard university major selection — evidence-led service framework</title><desc id="desc">For applicants who need systematic, defensible priorities among programme and university choices. Expected deliverable: A structured development and review of preferences grounded in the applicant’s verified information.. Scope boundary: Admission is not guaranteed; official capacity and admission rules apply.</desc><defs><radialGradient id="bg"><stop stop-color="#28231C"/><stop offset="1" stop-color="#0B0B0B"/></radialGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><rect x="28" y="28" width="1544" height="844" rx="35" stroke="#A88955" stroke-width="2" fill="none"/><g font-family="Georgia,Arial,sans-serif"><text x="90" y="143" font-size="45" font-weight="bold" fill="#F8F5E9">Standard university major selection</text><text x="90" y="188" font-size="22" fill="#D4AF37">SERVICE FRAMEWORK · SCOPE, EVIDENCE AND PROFESSIONAL LIMITS</text><rect x="100" y="237" width="660" height="212" rx="25" fill="#1F1F1F" stroke="#A88955" stroke-width="2"/><text x="145" y="292" font-size="28" font-weight="bold" fill="#D4AF37">Who it is for</text><text x="145" y="337" font-size="24" fill="#F8F5E9">For applicants who need systematic, defensible</text><text x="145" y="370" font-size="24" fill="#F8F5E9">priorities among programme and university</text><text x="145" y="403" font-size="24" fill="#F8F5E9">choices.</text><rect x="840" y="237" width="660" height="212" rx="25" fill="#1F1F1F" stroke="#A88955" stroke-width="2"/><text x="885" y="292" font-size="28" font-weight="bold" fill="#D4AF37">Expected deliverable</text><text x="885" y="337" font-size="24" fill="#F8F5E9">A structured development and review of</text><text x="885" y="370" font-size="24" fill="#F8F5E9">preferences grounded in the applicant’s verified</text><text x="885" y="403" font-size="24" fill="#F8F5E9">information.</text><path d="M190 500 H1410" stroke="#D4AF37" stroke-width="3" stroke-dasharray="8 13"/><circle cx="190" cy="500" r="26" fill="#D4AF37"/><circle cx="1410" cy="500" r="26" fill="#D4AF37"/><circle cx="800" cy="500" r="28" fill="#F8F5E9" stroke="#D4AF37" stroke-width="4"/><rect x="100" y="575" width="1400" height="195" rx="25" fill="#1F1F1F" stroke="#A88955" stroke-width="2"/><text x="145" y="631" font-size="28" font-weight="bold" fill="#D4AF37">Professional boundary</text><text x="145" y="681" font-size="24" fill="#F8F5E9">Admission is not guaranteed; official capacity and admission rules apply.</text><text x="800" y="830" text-anchor="middle" font-size="20" fill="#BCB3A4">DRJAVADREZAZADEH.COM · PROFESSIONAL SERVICES</text></g></svg>