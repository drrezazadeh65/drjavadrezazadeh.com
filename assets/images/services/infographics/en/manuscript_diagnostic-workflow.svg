<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Manuscript diagnostic review, up to 7,000 words — evidence-led service framework</title><desc id="desc">For manuscripts of up to 7,000 words needing a diagnosis of key weaknesses before submission or revision. Expected deliverable: A diagnostic review accompanied by a prioritised revision report.. Scope boundary: Excludes ghostwriting, fabricated data and guarantees of journal acceptance.</desc><defs><radialGradient id="bg"><stop stop-color="#28231C"/><stop offset="1" stop-color="#0B0B0B"/></radialGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><rect x="28" y="28" width="1544" height="844" rx="35" stroke="#A88955" stroke-width="2" fill="none"/><g font-family="Georgia,Arial,sans-serif"><text x="90" y="143" font-size="45" font-weight="bold" fill="#F8F5E9">Manuscript diagnostic review, up to 7,000 words</text><text x="90" y="188" font-size="22" fill="#D4AF37">SERVICE FRAMEWORK · SCOPE, EVIDENCE AND PROFESSIONAL LIMITS</text><rect x="100" y="237" width="660" height="212" rx="25" fill="#1F1F1F" stroke="#A88955" stroke-width="2"/><text x="145" y="292" font-size="28" font-weight="bold" fill="#D4AF37">Who it is for</text><text x="145" y="337" font-size="24" fill="#F8F5E9">For manuscripts of up to 7,000 words needing a</text><text x="145" y="370" font-size="24" fill="#F8F5E9">diagnosis of key weaknesses before submission or</text><text x="145" y="403" font-size="24" fill="#F8F5E9">revision.</text><rect x="840" y="237" width="660" height="212" rx="25" fill="#1F1F1F" stroke="#A88955" stroke-width="2"/><text x="885" y="292" font-size="28" font-weight="bold" fill="#D4AF37">Expected deliverable</text><text x="885" y="337" font-size="24" fill="#F8F5E9">A diagnostic review accompanied by a prioritised</text><text x="885" y="370" font-size="24" fill="#F8F5E9">revision report.</text><path d="M190 500 Q500 370 800 500 Q1100 630 1410 500" stroke="#D4AF37" stroke-width="3" fill="none"/><circle cx="190" cy="500" r="26" fill="#D4AF37"/><circle cx="1410" cy="500" r="26" fill="#D4AF37"/><circle cx="800" cy="500" r="28" fill="#F8F5E9" stroke="#D4AF37" stroke-width="4"/><rect x="100" y="575" width="1400" height="195" rx="25" fill="#1F1F1F" stroke="#A88955" stroke-width="2"/><text x="145" y="631" font-size="28" font-weight="bold" fill="#D4AF37">Professional boundary</text><text x="145" y="681" font-size="24" fill="#F8F5E9">Excludes ghostwriting, fabricated data and guarantees of journal acceptance.</text><text x="800" y="830" text-anchor="middle" font-size="20" fill="#BCB3A4">DRJAVADREZAZADEH.COM · PROFESSIONAL SERVICES</text></g></svg>