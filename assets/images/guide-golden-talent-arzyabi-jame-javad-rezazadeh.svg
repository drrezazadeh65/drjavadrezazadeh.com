<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">ارزیابی جامع Golden Talent؛ از شواهد استعداد تا طراحی مسیر رشد</title><desc id="d">ارزیابی جامع Golden Talent چگونه شواهد فردی، خانوادگی، آموزشی و عملکردی را ترکیب می‌کند و آن‌ها را به یک مسیر رشد بازنگری‌پذیر تبدیل می‌کند.</desc><defs><radialGradient id="g893973948" cx="75%" cy="20%"><stop offset="0" stop-color="#c8a45d" stop-opacity=".28"/><stop offset=".48" stop-color="#40331f" stop-opacity=".16"/><stop offset="1" stop-color="#070707" stop-opacity="0"/></radialGradient><linearGradient id="l893973948" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#181510"/><stop offset=".55" stop-color="#0b0b0d"/><stop offset="1" stop-color="#070707"/></linearGradient></defs><rect width="1600" height="900" fill="url(#l893973948)"/><rect width="1600" height="900" fill="url(#g893973948)"/><circle cx="268" cy="281" r="178" fill="#c8a45d" opacity=".05"/><circle cx="1022" cy="423" r="211" fill="#f0d694" opacity=".035"/><g fill="none" stroke="#d7b86d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".78"><circle cx="800" cy="450" r="175"/><path d="M800 210v480M560 450h480M665 315l270 270M935 315 665 585"/></g><path d="M140 730 C420 638 560 712 820 690 S1180 590 1460 700" fill="none" stroke="#8f7440" stroke-width="2" opacity=".32"/><g opacity=".16" fill="#f0d694"><circle cx="260" cy="220" r="8"/><circle cx="1320" cy="250" r="7"/><circle cx="1240" cy="690" r="6"/><circle cx="360" cy="690" r="5"/></g></svg>