<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Educational philosophy: human growth, learning and the Golden Path</title>
<desc id="desc">A conceptual visual of an open book becoming a luminous path toward a growing tree, symbolising learning, talent, character, hope and human development.</desc>
