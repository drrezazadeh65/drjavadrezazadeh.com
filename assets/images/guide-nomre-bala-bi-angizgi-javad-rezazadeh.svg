<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">کارنامه خوب اما بی‌انگیزگی؛ چرا نمره بالا همیشه نشانه مسیر درست نیست؟</title><desc id="d">دانش‌آموزی با نمرات بالا اما انگیزه پایین به چه بررسی‌هایی نیاز دارد؛ تفاوت عملکرد، علاقه، فشار، معنا و ظرفیت رشد در تصمیم تحصیلی.</desc><defs><radialGradient id="g1291882331" cx="75%" cy="20%"><stop offset="0" stop-color="#c8a45d" stop-opacity=".28"/><stop offset=".48" stop-color="#40331f" stop-opacity=".16"/><stop offset="1" stop-color="#070707" stop-opacity="0"/></radialGradient><linearGradient id="l1291882331" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#181510"/><stop offset=".55" stop-color="#0b0b0d"/><stop offset="1" stop-color="#070707"/></linearGradient></defs><rect width="1600" height="900" fill="url(#l1291882331)"/><rect width="1600" height="900" fill="url(#g1291882331)"/><circle cx="231" cy="305" r="111" fill="#c8a45d" opacity=".05"/><circle cx="1307" cy="390" r="270" fill="#f0d694" opacity=".035"/><g fill="none" stroke="#d7b86d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".78"><path d="M520 570c120-210 280-300 480-270 70 10 130-35 200-120"/><circle cx="520" cy="570" r="22"/><circle cx="1000" cy="300" r="22"/><circle cx="1200" cy="180" r="22"/></g><path d="M140 730 C420 621 560 779 820 690 S1180 590 1460 700" fill="none" stroke="#8f7440" stroke-width="2" opacity=".32"/><g opacity=".16" fill="#f0d694"><circle cx="260" cy="220" r="8"/><circle cx="1320" cy="250" r="7"/><circle cx="1240" cy="690" r="6"/><circle cx="360" cy="690" r="5"/></g></svg>