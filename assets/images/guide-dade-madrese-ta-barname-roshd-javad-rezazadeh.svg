<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">از داده دانش‌آموز تا برنامه رشد؛ مدارس چه اطلاعاتی واقعاً نیاز دارند؟</title><desc id="d">مدرسه برای طراحی برنامه رشد به چه داده‌هایی نیاز دارد؛ چگونه از جمع‌آوری افراطی داده پرهیز کنیم و شواهد را به تصمیم آموزشی قابل بازبینی متصل کنیم.</desc><defs><radialGradient id="g1203329519" cx="75%" cy="20%"><stop offset="0" stop-color="#c8a45d" stop-opacity=".28"/><stop offset=".48" stop-color="#40331f" stop-opacity=".16"/><stop offset="1" stop-color="#070707" stop-opacity="0"/></radialGradient><linearGradient id="l1203329519" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#181510"/><stop offset=".55" stop-color="#0b0b0d"/><stop offset="1" stop-color="#070707"/></linearGradient></defs><rect width="1600" height="900" fill="url(#l1203329519)"/><rect width="1600" height="900" fill="url(#g1203329519)"/><circle cx="299" cy="254" r="189" fill="#c8a45d" opacity=".05"/><circle cx="1152" cy="305" r="251" fill="#f0d694" opacity=".035"/><g fill="none" stroke="#d7b86d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".78"><path d="M500 610h600M560 610V320h480v290M640 400h80M760 400h80M880 400h80M640 490h80M760 490h80M880 490h80"/></g><path d="M140 730 C420 689 560 701 820 690 S1180 590 1460 700" fill="none" stroke="#8f7440" stroke-width="2" opacity=".32"/><g opacity=".16" fill="#f0d694"><circle cx="260" cy="220" r="8"/><circle cx="1320" cy="250" r="7"/><circle cx="1240" cy="690" r="6"/><circle cx="360" cy="690" r="5"/></g></svg>