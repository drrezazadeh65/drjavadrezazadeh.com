<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">استعدادیابی تخصصی اولیه؛ از کجا شروع کنیم و چه شواهدی واقعاً لازم است؟</title><desc id="d">استعدادیابی تخصصی اولیه چگونه انجام می‌شود؛ چه تفاوتی با یک تست منفرد دارد و چگونه شواهد عملکرد، علاقه، مشاهده و زمینه برای ساخت پروفایل اولیه کنار هم قرار می‌گیرند.</desc><defs><radialGradient id="g954615685" cx="75%" cy="20%"><stop offset="0" stop-color="#c8a45d" stop-opacity=".28"/><stop offset=".48" stop-color="#40331f" stop-opacity=".16"/><stop offset="1" stop-color="#070707" stop-opacity="0"/></radialGradient><linearGradient id="l954615685" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#181510"/><stop offset=".55" stop-color="#0b0b0d"/><stop offset="1" stop-color="#070707"/></linearGradient></defs><rect width="1600" height="900" fill="url(#l954615685)"/><rect width="1600" height="900" fill="url(#g954615685)"/><circle cx="385" cy="390" r="185" fill="#c8a45d" opacity=".05"/><circle cx="1023" cy="325" r="215" fill="#f0d694" opacity=".035"/><g fill="none" stroke="#d7b86d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".78"><circle cx="800" cy="450" r="175"/><path d="M800 210v480M560 450h480M665 315l270 270M935 315 665 585"/></g><path d="M140 730 C420 615 560 705 820 690 S1180 590 1460 700" fill="none" stroke="#8f7440" stroke-width="2" opacity=".32"/><g opacity=".16" fill="#f0d694"><circle cx="260" cy="220" r="8"/><circle cx="1320" cy="250" r="7"/><circle cx="1240" cy="690" r="6"/><circle cx="360" cy="690" r="5"/></g></svg>