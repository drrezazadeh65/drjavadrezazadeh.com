<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">استعداد، علاقه یا بازار کار؛ کدام‌یک در انتخاب رشته مهم‌تر است؟</title><desc id="d">در انتخاب رشته استعداد، علاقه و بازار کار چگونه باید کنار هم قرار گیرند و چرا حذف هرکدام می‌تواند تصمیم را ناقص کند.</desc><defs><radialGradient id="g4103701005" cx="75%" cy="20%"><stop offset="0" stop-color="#c8a45d" stop-opacity=".28"/><stop offset=".48" stop-color="#40331f" stop-opacity=".16"/><stop offset="1" stop-color="#070707" stop-opacity="0"/></radialGradient><linearGradient id="l4103701005" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#181510"/><stop offset=".55" stop-color="#0b0b0d"/><stop offset="1" stop-color="#070707"/></linearGradient></defs><rect width="1600" height="900" fill="url(#l4103701005)"/><rect width="1600" height="900" fill="url(#g4103701005)"/><circle cx="285" cy="222" r="175" fill="#c8a45d" opacity=".05"/><circle cx="981" cy="250" r="164" fill="#f0d694" opacity=".035"/><g fill="none" stroke="#d7b86d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".78"><circle cx="800" cy="450" r="175"/><path d="M800 210v480M560 450h480M665 315l270 270M935 315 665 585"/></g><path d="M140 730 C420 655 560 715 820 690 S1180 590 1460 700" fill="none" stroke="#8f7440" stroke-width="2" opacity=".32"/><g opacity=".16" fill="#f0d694"><circle cx="260" cy="220" r="8"/><circle cx="1320" cy="250" r="7"/><circle cx="1240" cy="690" r="6"/><circle cx="360" cy="690" r="5"/></g></svg>