<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Direct USDT payment</title><link rel="stylesheet" href="/assets/css/jr-usdt-commerce-v1.css?v=1"><script src="/assets/js/jr-usdt-commerce-v1.js?v=1" defer></script></head><body><main id="main" data-jr-usdt-checkout><a href="/en/">Return to website</a><h1>Direct USDT payment</h1><p>A time-limited, server-issued invoice on BSC (BEP20). The owner independently checks the credited deposit before confirming payment.</p><p role="status" data-usdt-status>Checking payment availability</p><a data-usdt-login href="/en/login/" hidden>Sign in with your verified account</a><form data-usdt-form hidden><label>Payment purpose<select name="purpose"><option value="purchase">Purchase a product or service</option><option value="donation">Educational support</option><option value="authorized" disabled>Approved JREI invoice</option></select></label><div data-usdt-authorized hidden><label>Contractual invoice<select name="offerId" disabled></select></label></div><div data-usdt-purchase><label data-usdt-product-field>Product or service<select name="sku"></select></label><label>Quantity<input name="quantity" type="number" min="1" max="20" value="1"></label><label>Full name<input name="name" autocomplete="name" maxlength="100"></label><label>Phone (optional)<input name="phone" autocomplete="tel" maxlength="30"></label><div data-usdt-shipping hidden><label>Printed book delivery address<textarea name="address" maxlength="500" autocomplete="street-address"></textarea></label><label>Postal code<input name="postal" maxlength="20" autocomplete="postal-code"></label></div></div><div data-usdt-donation hidden><label>Support amount (toman)<input name="amountToman" type="number" min="1000" max="10000000" step="1" value="500000"></label><label>Support purpose<select name="focus"><option value="general">General</option><option value="scholarship">Scholarship</option><option value="books">Books</option><option value="services">Education services</option><option value="essentials">Essentials</option></select></label></div><button type="submit">Issue binding invoice</button></form><h2>My invoices</h2><button type="button" data-usdt-refresh>Refresh status</button><section data-usdt-invoices aria-live="polite"></section></main></body></html>
