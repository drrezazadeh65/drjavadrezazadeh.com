# v4.3.0 public-site exclusion boundary for branch-based GitHub Pages.
# This file is inert while .nojekyll exists. It becomes the canonical exclusion
# policy only after the Jekyll validation workflow passes and .nojekyll is removed.
exclude:
  - .github
  - docs
  - edge
  - foundation
  - node_modules
  - platform
  - payment-backend
  - scripts
  - tests
  - test-results
  - .public-site
  - README.md
  - CACHE_STANDARD.md
  - assets/media-registry.json

include:
  - CNAME

plugins: []
