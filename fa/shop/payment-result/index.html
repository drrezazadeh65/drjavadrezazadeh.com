<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>نتیجه پرداخت | فروشگاه دکتر جواد رضازاده</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#d8e7ed,transparent 48%),linear-gradient(145deg,#f8fafc,#e7edf5);font-family:Tahoma,Arial,sans-serif;color:#13233c;display:grid;place-items:center;padding:22px}main{width:min(100%,660px);padding:clamp(24px,5vw,52px);background:#fff;border:1px solid #d5deea;border-radius:28px;box-shadow:0 22px 70px #14243a1a}h1{font-size:clamp(24px,4vw,34px);line-height:1.5;margin:0 0 14px}p{line-height:2;color:#475569}small{color:#64748b}a{display:inline-block;background:#173e69;color:white;text-decoration:none;border-radius:12px;padding:13px 20px;margin-top:20px}code{direction:ltr;unicode-bidi:isolate;display:inline-block;overflow-wrap:anywhere;font-size:13px}.eyebrow{font-weight:bold;letter-spacing:.1em;color:#9a7238;margin-bottom:18px}.status{border-right:4px solid #c99b52;padding-right:16px}
</style></head><body><main><div class="eyebrow">SECURE PAYMENT · DR. REZAZADEH</div><h1 id="title">در حال بررسی وضعیت پرداخت</h1><p class="status" id="status" role="status" aria-live="polite">نتیجه پرداخت فقط پس از تأیید سرور معتبر است.</p><p id="order" hidden>شناسه سفارش: <code></code></p><small>در صورت نامشخص بودن وضعیت، دوباره پرداخت نکنید. از بخش تماس سایت پیگیری کنید.</small><div><a href="/fa/shop/">بازگشت به فروشگاه</a></div></main><script>
(async function(){const p=new URLSearchParams(location.search),id=p.get('order'),title=document.getElementById('title'),status=document.getElementById('status');if(!/^[a-f0-9-]{36}$/i.test(id||'')){title.textContent='شناسه سفارش نامعتبر است';status.textContent='برای پیگیری از بخش تماس سایت استفاده کنید.';return}document.querySelector('#order').hidden=false;document.querySelector('#order code').textContent=id;try{const r=await fetch('https://drjavadrezazadeh-payment.dr-rezazadeh65.workers.dev/commerce/status?order='+encodeURIComponent(id),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error('status');if(d.state==='paid'){title.textContent='پرداخت با موفقیت تأیید شد';status.textContent='تراکنش در سامانه سفارش‌ها ثبت شده است.'}else if(d.state==='pending'||d.state==='created'){title.textContent='پرداخت در انتظار تأیید است';status.textContent='تا زمان تأیید بانکی دوباره پرداخت نکنید.'}else{title.textContent='پرداخت تأیید نشده است';status.textContent='وضعیت سفارش: '+String(d.state)}}catch(e){title.textContent='استعلام وضعیت ممکن نشد';status.textContent='در صورت برداشت وجه، مجدداً پرداخت نکنید و با پشتیبانی تماس بگیرید.'}})();
</script></body></html>
