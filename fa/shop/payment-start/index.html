<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="strict-origin-when-cross-origin"><title>ورود امن به درگاه پرداخت | دکتر جواد رضازاده</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f7f9fc;color:#17253d;line-height:2;margin:0;padding:7vh 18px}main{max-width:560px;margin:auto;background:#fff;border:1px solid #e0e5ee;border-radius:16px;padding:30px;text-align:center}a.pay{display:inline-block;background:#19549b;color:white;text-decoration:none;border-radius:9px;padding:10px 22px;margin:15px}small{display:block;color:#596779}</style></head><body><main><h1>ورود به درگاه پرداخت بیت‌پی</h1><p id="status">در حال بررسی لینک پرداخت...</p><a id="pay" class="pay" hidden rel="noreferrer">ورود به درگاه بیت‌پی</a><small>پرداخت تنها در وب‌سایت رسمی بیت‌پی انجام می‌شود. هرگز اطلاعات کارت خود را در این صفحه وارد نکنید.</small><p><a href="/fa/shop/">بازگشت به فروشگاه</a></p></main><script>(function(){const raw=new URLSearchParams(location.search).get("gateway");const status=document.getElementById("status"),btn=document.getElementById("pay");try{if(!raw)throw Error("missing");const u=new URL(raw);if(u.protocol!=="https:"||u.hostname!=="bitpay.ir"||u.port||!/^\/payment\/gateway-[0-9]+-get\/?$/.test(u.pathname)||u.search||u.hash||u.username||u.password)throw Error("invalid");btn.href=u.href;btn.hidden=false;btn.removeAttribute("rel");status.textContent="لینک پرداخت آماده است. برای ادامه، دکمه زیر را انتخاب کنید."; }catch(e){status.textContent="لینک پرداخت نامعتبر است. لطفاً فرآیند پرداخت را از فروشگاه آغاز کنید.";}})();</script></body></html>
