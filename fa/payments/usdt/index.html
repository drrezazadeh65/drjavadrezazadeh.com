<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>پرداخت مستقیم تتر (USDT)</title><link rel="stylesheet" href="/assets/css/jr-usdt-commerce-v1.css?v=1"><script src="/assets/js/jr-usdt-commerce-v1.js?v=1" defer></script></head><body><main id="main" data-jr-usdt-checkout><a href="/fa/">بازگشت به سایت</a><h1>پرداخت مستقیم تتر (USDT)</h1><p>فاکتور معتبر و زمان‌دار؛ پرداخت فقط روی BSC (BEP20). پس از انتقال، دریافت واقعی وجه توسط مدیر بررسی می‌شود.</p><p role="status" data-usdt-status>در حال بررسی وضعیت پرداخت</p><a data-usdt-login href="/fa/login/" hidden>ورود با حساب تأییدشده</a><form data-usdt-form hidden><label>نوع پرداخت<select name="purpose"><option value="purchase">خرید محصول یا خدمت</option><option value="donation">حمایت مالی</option><option value="authorized" disabled>فاکتور تأییدشده JREI</option></select></label><div data-usdt-authorized hidden><label>فاکتور قراردادی<select name="offerId" disabled></select></label></div><div data-usdt-purchase><label data-usdt-product-field>محصول یا خدمت<select name="sku"></select></label><label>تعداد<input name="quantity" type="number" min="1" max="20" value="1"></label><label>نام کامل<input name="name" autocomplete="name" maxlength="100"></label><label>تلفن (اختیاری)<input name="phone" autocomplete="tel" maxlength="30"></label><div data-usdt-shipping hidden><label>نشانی ارسال کتاب چاپی<textarea name="address" maxlength="500" autocomplete="street-address"></textarea></label><label>کد پستی<input name="postal" maxlength="20" autocomplete="postal-code"></label></div></div><div data-usdt-donation hidden><label>مبلغ حمایت به تومان<input name="amountToman" type="number" min="1000" max="10000000" step="1" value="500000"></label><label>هدف حمایت<select name="focus"><option value="general">عمومی</option><option value="scholarship">بورسیه</option><option value="books">کتاب</option><option value="services">خدمات آموزشی</option><option value="essentials">نیازهای ضروری</option></select></label></div><button type="submit">صدور فاکتور قطعی</button></form><h2>فاکتورهای من</h2><button type="button" data-usdt-refresh>به‌روزرسانی وضعیت</button><section data-usdt-invoices aria-live="polite"></section></main></body></html>
